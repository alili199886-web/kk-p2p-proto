/* 私盘分组：开盘后复制原比赛生成，紧随原比赛下方展示，仅展示开放盘口 */
/* 该场是否已有进行中的投注项卖出挂单（卖出中 / 已封盘计入） */
const hasItemSell=mid=>legacySells.some(o=>o.mid===mid&&["卖出中","部分成交"].includes(o.state));
/* 该场是否已有进行中的私盘 */
const hasOpenMarket=mid=>markets.some(m=>m.mid===mid&&["open","soldout"].includes(m.status));
/* P2P 与私盘本期仅对足球开放 */
const P2P_SPORT="足球";
/* 该场是否展示 P2P：足球 + 该场官方盘有会员投注项卖出。
   不同会员互不影响，别人开了私盘不影响这场的 P2P 展示 */
const matchP2P=(g,mt)=>!!(!g.priv&&g.sport===P2P_SPORT&&(mt.p2p!==undefined?mt.p2p:g.p2p));
/* 开盘入口：未开赛（滚球不可开）+ 足球 + 本人在该场没有进行中的投注项卖出 */
const canOpenMarket=(g,mt)=>!!(mt.date&&!g.priv&&g.sport===P2P_SPORT&&!hasItemSell(mt.id));
/* 当前筛选范围内是否可能出现 P2P / 私盘 */
function p2pScope(){
  const sp=S.page==="live"?S.chip:(S.page==="hot"?"全部":S.sport);
  return sp==="全部"||sp===P2P_SPORT;
}
function privGroupsFor(mid,g){
  if(g.sport!==P2P_SPORT||g.priv)return[];      /* 私盘本期仅足球 */
  const ms=markets.filter(m=>m.mid===mid&&m.status==="open"&&m.sport===P2P_SPORT
    &&m.items.filter(it=>it.status==="on").length>=OM_CFG.minItems);
  if(!ms.length)return[];
  const shown=ms.slice(0,OM_CFG.displayLimit);
  return shown.map(m=>({
    league:g.league,sport:g.sport,flag:g.flag,p2p:false,priv:true,market:m,
    parent:g,parentMatch:g.matches.find(x=>x.id===mid),
    markets:g.markets,
    matches:[{...g.matches.find(x=>x.id===mid),id:mid+"#"+m.id,privOf:m}]
  }));
}
/* 私盘赔率格：把列表的盘口列 + 选项文案映射到庄家开放的投注项；
   未开放的盘口显示 -- 置灰，单项封盘显示锁定态 */
function privCell(m,mkName,label){
  const half=/上半场|半场/.test(mkName);
  const isO=/^大|大\s/.test(label), isU=/^小|小\s/.test(label);
  const isA=/客/.test(label), isH=/主/.test(label), isD=/和|平/.test(label);
  let k=null;
  if(half)k=null;                                   /* 本期示例盘只开全场项 */
  else if(/独赢|1\*2/.test(mkName))k=isH?"1x2-h":isA?"1x2-a":null;
  else if(/让球|让分/.test(mkName))k=(isA||/^\+/.test(label))?"ah-a":"ah-h";
  else if(/大小|大\/小|总分/.test(mkName))k=isO?"ou-o":isU?"ou-u":null;
  if(!k)return null;
  return m.items.find(x=>x.status!=="removed"&&itemSlot(x.name)===k)||null;
}
/* 庄单投注项名（"全场 大/小 · 大 3"）→ 列表盘口槽位，用于把庄单映射到赔率格 */
function itemSlot(name){
  const parts=String(name).split("·");
  const mk=parts[0]||"", label=(parts[1]||"").trim();
  if(/半场/.test(mk))return null;
  const isO=/^大/.test(label), isU=/^小/.test(label);
  const isA=/客/.test(label), isH=/主/.test(label);
  if(/独赢|1\*2/.test(mk))return isH?"1x2-h":isA?"1x2-a":null;
  if(/让球|让分/.test(mk))return (isA||/^\+/.test(label))?"ah-a":"ah-h";
  if(/大小|大\/小|总分/.test(mk))return isO?"ou-o":isU?"ou-u":null;
  return null;
}

        pf.appendChild(more);

    foot.appendChild(st);
    const openDetail=cat=>{S.page="detail";S.detailMatch=mt;S.detailLeague=g.league;S.detailSport=g.sport;
      S.detailChip=cat||"全部";S.detailPriv=null;S.heroOpen=true;render()};
    const more=el("button","mchip",`全部 <b>+${mt.more}</b> <span class="ar">›</span>`);
    more.title="查看该场全部盘口";
    more.onclick=()=>openDetail();
    foot.appendChild(more);
    if(matchP2P(g,mt)){
      const n=(mt.id.charCodeAt(1)%3)+1;
      const pc=el("button","mchip is-p2p",`P2P <b>${n}</b> <span class="ar">›</span>`);
      pc.title=`该场有 ${n} 个投注项存在会员卖单`;

    wrap.style.cssText="border-top:1px solid var(--line);padding-bottom:6px";
    sc.appendChild(wrap);
  });
  tbl.appendChild(sc);
  /* 盘口装得下就不出横向翻页，装不下才给 » */
  {
    const nb=el("button","nextbtn","»");
    nb.style.display="none";
    nb.onclick=()=>sc.scrollBy({left:Math.round(sc.clientWidth*0.8),behavior:"smooth"});
    tbl.appendChild(nb);
    const sync=()=>{nb.style.display=sc.scrollWidth-sc.clientWidth>4?"grid":"none"};
    requestAnimationFrame(sync);
    sc.addEventListener("scroll",sync);
  }
  c.appendChild(tbl);
  return c;
}
function betBtn([label,odds],ctx){
  const on=S.slip.some(x=>x.key===ctx.key);
  const b=el("button","bet"+(on?" on":"")+(ctx.p2p?" hasp2p":""),
    `<span class="bl">${esc(label)}</span><span class="bo">${odds}</span>${ctx.p2p?'<i class="p2pdot" title="有会员挂出更优赔率"></i>':""}`);
  b.dataset.odds=odds;
  b.onclick=()=>{
    const i=S.slip.findIndex(x=>x.key===ctx.key);
    if(i>=0){S.slip.splice(i,1);delete S.stakes[ctx.key]}
    else S.slip.push({...ctx,pick:label,odds});
    S.sideMode=S.slip.length?"slip":"menu";
    if(S.slipTab!=="卖出")S.slipTab="买入";
    if(S.slip.length<2)S.buyMode="单关";
    if(i<0)S.bookOpen=true;   /* 新选中投注项时，卖单薄默认展开 */
    render();
  };
  return b;
}

/* ============ 日期区间筛选（买单 / 卖单 / 汇总报表共用） ============ */
const DR_TODAY="2026-09-22";
const dAdd=(ds,n)=>{const t=new Date(ds+"T00:00:00");t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
/* 预置项 → 日期区间；返回 null 表示不限 */
function presetRange(v){
  if(v==="全部"||!v)return null;
  if(v==="今天")return[DR_TODAY,DR_TODAY];
  if(v==="昨天"){const y=dAdd(DR_TODAY,-1);return[y,y]}
  if(v==="近7天")return[dAdd(DR_TODAY,-6),DR_TODAY];
  if(v==="近30天")return[dAdd(DR_TODAY,-29),DR_TODAY];
  if(v==="本周")return["2026-09-21",DR_TODAY];
  if(v==="本月")return[DR_TODAY.slice(0,7)+"-01",DR_TODAY];
  return null;
}
/* 自定义区间优先于预置项 */
function activeRange(key,preset){
  const c=S.dr[key];
  return c?[c.from,c.to]:presetRange(preset);
}
const inActive=(d,key,preset)=>{const r=activeRange(key,preset);return !r||(d>=r[0]&&d<=r[1])};

function dateRangeBox(key,onChange){
  const c=S.dr[key];
  const b=el("div","fbox dr"+(c?" on":""));
  b.innerHTML=c
    ? `📅 <span>${c.from.replace(/-/g,"/")}</span><span style="color:var(--ink-mute)">至</span><span>${c.to.replace(/-/g,"/")}</span><button class="x" title="清除">✕</button>`
    : `📅 <span>选择时间段</span><span class="caret">▼</span>`;
  b.onclick=e=>{
    if(e.target.classList.contains("x")){e.stopPropagation();S.dr[key]=null;onChange&&onChange();render();return}
    openDateRange(key,onChange);
  };
  return b;
}
function openDateRange(key,onChange){
  const layer=$("#layer");
  const mask=el("div","mask");
  const mo=el("div","modal sm");
  const c=S.dr[key]||{from:"",to:""};
  mo.innerHTML=`<header>选择时间段<span class="tools"><button id="cls">✕</button></span></header>
    <div class="dr-body">
      <div class="dr-row"><label>开始</label><input type="date" id="drF" value="${c.from}" max="${DR_TODAY}"></div>
      <div class="dr-row" style="margin-bottom:0"><label>结束</label><input type="date" id="drT" value="${c.to}" max="${DR_TODAY}"></div>
    </div>
    <footer><button id="clr">清除</button><button class="ok" id="ok">确定</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#clr",mo).onclick=()=>{S.dr[key]=null;close();onChange&&onChange();render()};
  $("#ok",mo).onclick=()=>{
    const f=$("#drF",mo).value, t=$("#drT",mo).value;
    if(!f||!t)return toast("请选择完整的开始与结束日期");
    if(f>t)return toast("开始日期不得晚于结束日期");
    if(t>DR_TODAY)return toast("结束日期不得晚于今天");
    if(dAdd(f,365)<t)return toast("时间跨度不得超过 1 年");
    S.dr[key]={from:f,to:t};close();onChange&&onChange();render();
    toast(`已筛选 ${f} 至 ${t}`);
  };
}

      <div class="sf-row" style="border:0"><span>补充金额</span>
        <span class="sf-in"><input id="addAmt" inputmode="decimal" placeholder="10~5000"><i>CNY</i></span></div>
      <div class="quick">${[100,500,1000,2000,5000].map(v=>`<button data-v="${v}">+${money(v)}</button>`).join("")}<button data-v="max">MAX</button></div>

      <div class="ad-tip">余额 CNY <b class="num">${money(S.balance)}</b>　补充部分即时进入挂出额度，已成交部分不受影响。</div>
    </div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok" disabled>确认补充</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const inp=$("#addAmt",mo);
  const sync=()=>{
    const v=parseFloat(inp.value||0)||0;
    $("#adQuota",mo).textContent="¥"+money(o.cap+v/rate);
    $("#ok",mo).disabled=!(v>=10&&v<=S.balance);
  };
  inp.oninput=e=>{e.target.value=e.target.value.replace(/[^\d.]/g,"");sync()};
  mo.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    inp.value=b.dataset.v==="max"?String(Math.floor(S.balance)):String((parseFloat(inp.value||0)+parseFloat(b.dataset.v)).toFixed(2));
    sync();
  });
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#ok",mo).onclick=()=>{
    const v=parseFloat(inp.value||0)||0;
    if(v<10){toast("补充金额不得低于 10 CNY");return}

    o.dep=+(o.dep+v).toFixed(2);

    if(o.state==="已售罄")o.state="卖出中";
    S.balance-=v;close();render();
    toast(`已补充押金 ¥${money(v)}，可卖额度增至 ¥${money(o.cap)}`);
  };
}

const RP_TODAY="2026-09-22", RP_WEEK_START="2026-09-21", RP_MONTH="2026-09";
function reportDays(){
  const map=new Map();
  const row=d=>{if(!map.has(d))map.set(d,{date:d,buy:0,sell:0,buys:[],sells:[]});return map.get(d)};
  S.bets.filter(b=>b.status!=="未结算"&&b.settle).forEach(b=>{
    const r=row(b.settle.slice(0,10));
    const pnl=b.status==="取消"?0:(b.stamp==="赢"?(b.refund||0):-b.stake);
    r.buy+=pnl;r.buys.push({bet:b,pnl});
  });
  legacySells.filter(o=>o.state==="已结算"&&o.settleTime).forEach(o=>{
    const r=row(o.settleTime.slice(0,10));
    r.sell+=(o.net||0);r.sells.push(o);
  });
  /* 自定义区间优先，其次预置项；报表按结算时间归集 */
  return [...map.values()].filter(r=>inActive(r.date,"report",S.reportRange)).sort((a,b)=>a.date<b.date?1:-1);
}

/* 选项列：四行定高排版 —— 联赛 / 玩法·选项·赔率 / 对阵 / 比分条 */
function legCell(l,b,settled){
  const tone=b.status==="取消"?"void":b.stamp==="赢"?"win":b.stamp==="输"?"lose":"";
  const chips=[];
  if(l.live)chips.push(`<span class="sc-chip">下注 ${esc(l.score||"0-0")}</span>`);
  if(settled)chips.push(l.final
    ? `<span class="sc-chip fin ${tone}">结算 ${esc(l.final)}</span>`
    : `<span class="sc-chip fin void">结算 —</span>`);
  if(settled&&l.half)chips.push(`<span class="sc-half">${esc(l.half)}</span>`);
  const why=settled&&l.finalNote
    ? `<span class="bt-why" title="${esc(l.finalNote)}">${esc(l.finalNote)}</span>`:"";
  return `<div class="bt-leg">
    <div class="bt-l1"><span class="bt-sport">[${esc(l.sport||"篮球")}]</span><span class="bt-lg">${esc(l.league)}</span></div>
    <div class="bt-l2">
      ${l.live?'<span class="bt-live">滚球</span>':""}
      <span class="bt-mk">${esc(l.market)}</span>
      ${l.pick?`<span class="bt-sel">${esc(l.pick)}</span>`:""}
      <span class="bt-od num">@${l.odds}</span><span class="bt-ot">[${esc(l.oddsType||"欧洲盘")}]</span>
    </div>
    <div class="bt-l3">${esc(l.home)} <span class="vs">vs</span> ${esc(l.away)}</div>
    ${chips.length||why?`<div class="bt-l4">${chips.join("")}${why}</div>`:""}
  </div>`;
}
/* 字段名 : 值 的定义行 */
function kv(rows){
  return `<div class="kv">${rows.map(([k,v])=>`<span class="kv-k">${k}</span><span class="kv-v">${v}</span>`).join("")}</div>`;
}
/* 比分盒：小字段名 + 比分 */
function sbox(label,score,tone){
  return `<span class="sbox ${tone||""}"><i>${label}</i><b class="num">${esc(score)}</b></span>`;
}
/* 投注详情：联赛 / 队名 / 投注项 + 投注时间 + 注单号（两栏通用） */
function betDetailCell(b){
  return `${b.legs.map(l=>`<div class="bd-leg">
      <div class="bt-l1"><span class="bt-sport">[${esc(l.sport||"篮球")}]</span><span class="bt-lg">${esc(l.league)}</span></div>
      <div class="bd-mt">${esc(l.home)} <span class="vs">vs</span> ${esc(l.away)}</div>
      <div class="bd-pick">${l.live?'<span class="bt-live">滚球</span>':""}<span class="bt-mk">${esc(l.market)}</span>${l.pick?`<span class="bt-sel">${esc(l.pick)}</span>`:""}</div>
    </div>`).join("")}
    <div class="bd-foot">${kv([
      ["投注时间",`<span class="num">${esc(b.time)}</span>`],
      ["注单号",`<span class="num">${esc(b.no)}</span> <span class="copy" title="复制单号">⧉</span>`]
    ])}</div>`;
}
/* 选项：未结算 = 下注时比分 + 投注赔率；已结算 = 结算比分 + 判定依据 + 结算赔率 + 结算时间 */
function optionCell(b,settled){
  const tone=b.status==="取消"?"void":b.stamp==="赢"?"win":b.stamp==="输"?"lose":"";
  if(!settled){
    return `${b.legs.map(l=>`<div class="st-leg">
        ${l.live?`<div class="st-sc">${sbox("下注时",l.score||"0-0","")}</div>`:""}
        ${kv([["投注赔率",`<b class="od-v num">@${l.odds}</b> <span class="ot-v">[${esc(l.oddsType||"欧洲盘")}]</span>`]])}
      </div>`).join("")}
      <div class="bd-foot">${kv([["结算说明",`赛事结束后按官方赛果自动结算`]])}</div>`;
  }
  return `${b.legs.map(l=>`<div class="st-leg">
      <div class="st-sc">
        ${l.half?sbox("上半场",l.half,""):""}
        ${l.final?sbox("全场",l.final,tone):sbox("全场","—","void")}
      </div>
      ${l.finalNote?`<div class="st-why">${esc(l.finalNote)}</div>`:""}
      ${kv([["结算赔率",`<b class="od-v num">@${l.odds}</b> <span class="ot-v">[${esc(l.oddsType||"欧洲盘")}]</span>`]])}
    </div>`).join("")}
    <div class="bd-foot">${kv([["结算时间",`<span class="num">${esc(b.settle||"—")}</span>`]])}</div>`;
}
function statusCell(b){
  if(b.status==="未结算")return `<div class="bt-ok">已确认</div>`;
  return `<div class="bt-status ${b.status==="取消"?"r":"g"}">${esc(b.status)}</div>`;
}
/* 结算逻辑：线上由 IM 赛果驱动，原型内部保留以便生成样本 */
function settle(b){
  const r=Math.random();
  const win=r<.5;
  b.status=r<.92?"已结算":"取消";
  if(b.status==="取消"){
    b.stamp=null;b.refund=b.stake;b.stakeNote="本金已归还";
    b.legs.forEach(l=>{l.final=null;l.finalNote="赛事取消，该盘口不结算"});
  }else{
    b.stamp=win?"赢":"输";
    b.refund=win?+(b.stake*(parseFloat(b.legs[0].odds)||1)).toFixed(2):0;
    b.legs.forEach(l=>{
      const h=Math.floor(Math.random()*4),a=Math.floor(Math.random()*4);
      l.final=`${h}-${a}`;
      l.finalNote=win?"结算比分满足所选盘口":"结算比分不满足所选盘口";
    });
  }
  S.balance+=b.refund+(b.status==="取消"?0:(win?b.stake:0));
  S.histTab="已结算注单";render();
  toast(b.status==="取消"?"赛事取消，本金已归还":`注单结算为「${b.stamp}」，返还 ${money(b.refund)} CNY`);
}

/* 调水：新庄单赔率 = 当前庄单赔率 + 调整点位；10 秒内单项限调 1 次 */
function openAdjust(k,it){
  const now=Date.now();
  if(it.lastAdj&&now-it.lastAdj<OM_CFG.adjustThrottle*1000)
    return toast(`调水过于频繁，${OM_CFG.adjustThrottle} 秒内限 1 次`);
  const layer=$("#layer");const mask=el("div","mask");const mo=el("div","modal sm");
  mo.innerHTML=`<header>调水 · ${esc(it.name)}<span class="tools"><button id="cls">✕</button></span></header>
    <div class="dr-body">
      <div class="ad-cur">${kv([["当前庄单赔率","@"+it.odds],["官方当前赔率","@"+it.off]])}</div>
      <div class="dr-row" style="margin-top:12px"><label>调整点位</label>
        <input id="adjPt" inputmode="decimal" placeholder="可为负，最多两位小数" value=""></div>
      <div class="dr-row" style="margin-bottom:0"><label>调整后</label>
        <input id="adjNew" value="@${it.odds}" readonly></div>
    </div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确认调水</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  const pt=$("#adjPt",mo),nw=$("#adjNew",mo);
  pt.oninput=()=>{const v=parseFloat(pt.value);
    nw.value=isNaN(v)?"@"+it.odds:"@"+(parseFloat(it.odds)+v).toFixed(2)};
  $("#ok",mo).onclick=()=>{
    const v=parseFloat(pt.value);
    if(isNaN(v))return toast("点位格式：数字，最多两位小数");
    const nv=+(parseFloat(it.odds)+v).toFixed(2);
    if(nv<=0)return toast("新赔率必须大于 0");
    it.odds=nv.toFixed(2);it.lastAdj=Date.now();
    close();render();toast(`调水成功，新赔率 @${it.odds}，卖单簿已重排`);
  };
}
/* 单项封盘 / 恢复开盘，二次确认 */
function toggleSeal(k,it){
  if(it.status==="sealed"){
    it.status="on";render();return toast("已恢复开盘，重新进入卖单簿");
  }
  confirmDialog({title:"封盘",okText:"确认封盘",
    body:`确认封盘「${it.name}」？该项从卖单簿下架，暂停收单，卖出单保留。开赛前可随时恢复开盘。`,
    onOk:()=>{it.status="sealed";render();toast("该投注项已封盘，已从卖单簿下架")}});
}

/* 新增盘口：从 IM 交集内未开放的盘口里选 */
function openAddItem(k){
  if(omRemain(k)<=0)return toast("剩余押金为 0，请先补充额度");
  const used=new Set(k.items.map(x=>x.key));
  const cand=OM_ITEMS.filter(x=>x.st==="ok"&&!used.has(x.k));
  if(!cand.length)return toast("IM 交集内已无可新增的盘口");
  const layer=$("#layer");const mask=el("div","mask");const mo=el("div","modal sm");
  const pick={};
  mo.innerHTML=`<header>新增盘口<span class="tools"><button id="cls">✕</button></span></header>
    <div class="om-body" id="addL"></div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确认新增</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  const L=$("#addL",mo);
  const draw=()=>{L.innerHTML="";cand.forEach(x=>{
    const on=pick[x.k]!=null, pt=pick[x.k]||"0.01";
    const row=el("div","om-i"+(on?" on":""));
    row.innerHTML=`<div class="om-ih"><span class="om-ck">${on?"☑":"☐"}</span>
        <span class="om-nm">${esc(x.name)}</span><span class="om-off">官方 @${x.off}</span></div>
      ${on?`<div class="om-set"><span class="om-pt"><label>上浮点位</label>
          <input class="ptv" value="${pt}"></span>
        <span class="om-od">庄单赔率 <b>@${omOdds(x.off,pt)}</b></span></div>`:""}`;
    $(".om-ih",row).onclick=()=>{on?delete pick[x.k]:pick[x.k]="0.01";draw()};
    if(on){const i2=$(".ptv",row);
      i2.oninput=e=>pick[x.k]=e.target.value.replace(/[^\d.\-]/g,"");
      i2.onblur=()=>{let v=parseFloat(i2.value);if(isNaN(v))v=0;
        if(parseFloat(x.off)+v<=0){toast("结果赔率须大于 0");v=0.01}
        pick[x.k]=v.toFixed(2);draw()};}
    L.appendChild(row);
  })};
  draw();
  $("#ok",mo).onclick=()=>{
    const ps=cand.filter(x=>pick[x.k]!=null);
    if(!ps.length)return toast("请至少选择 1 个盘口");
    ps.forEach(x=>{const pt=parseFloat(pick[x.k])||0;
      k.items.push({key:x.k,name:x.name,off:x.off,pt,odds:omOdds(x.off,pt),
        status:"on",sold:0,lastAdj:0,subs:[]})});
    close();render();toast("新增成功，盘口已对买家开放");
  };
}
/* 补充额度：追加进共享池 */
function openTopup(k){

    <div class="dr-body">
      <div class="ad-cur">${kv([["当前盘押金","¥"+money(k.dep+k.topup)],
        ["剩余押金","¥"+money(Math.max(omRemain(k),0))],["最高卖出赔率","@"+mx.toFixed(2)]])}</div>

function flashOdds(force){
  const list=[...document.querySelectorAll(".bet:not(.dead):not(.lock):not(.on)")];
  if(!list.length)return;
  const n=force?4:1;
  for(let i=0;i<n;i++){
    const b=list[Math.floor(Math.random()*list.length)];
    const o=$(".bo",b);if(!o)return;
    const v=parseFloat(o.textContent);if(isNaN(v))return;
    const up=Math.random()>.5;

    o.textContent=nv.toFixed(2);
    b.classList.remove("up","down");void b.offsetWidth;b.classList.add(up?"up":"down");
    setTimeout(()=>b.classList.remove("up","down"),1400);
  }

let guideIdx=0;
/* 原型里每次进入都展示，方便随时查看；线上的触发条件见右侧需求说明 */
function guideStart(){
  guideIdx=0;
  S.topnav="体育赛事";S.page="live";S.p2pOnly=false;S.sideMode="menu";render();
  $("#guide").classList.add("show");guideRender();
}
function guideNext(){ guideIdx>=GUIDE.length-1?guideEnd():(guideIdx++,guideRender()) }
function guideEnd(){
  $("#guide").classList.remove("show");
  window.removeEventListener("resize",guideRender);
}
/* 多个目标时取并集外框 */
function guideRect(t){
  const list=Array.isArray(t)?t:[t];
  const rs=list.map(e=>e.getBoundingClientRect());
  return {left:Math.min(...rs.map(r=>r.left)),top:Math.min(...rs.map(r=>r.top)),
          right:Math.max(...rs.map(r=>r.right)),bottom:Math.max(...rs.map(r=>r.bottom))};
}
function guideRender(){
  const g=GUIDE[guideIdx],t=g.sel();
  if(!t||(Array.isArray(t)&&!t.length))return guideNext();
  (Array.isArray(t)?t[0]:t).scrollIntoView({block:"center"});
  setTimeout(()=>{
    const b=guideRect(t);
    const x=Math.max(b.left,6),y=b.top,w=b.right-Math.max(b.left,6),h=b.bottom-b.top;
    const hole=$("#g-hole");
    hole.style.cssText=`position:fixed;left:${x-4}px;top:${y-4}px;width:${w+8}px;height:${h+8}px;`+
      `border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.74);border:2px solid #FF8C00`;
    const ring=$("#g-ring");
    ring.style.cssText=`position:fixed;left:${x-11}px;top:${y-11}px;width:${w+22}px;height:${h+22}px;`+
      `border:2px dashed rgba(255,255,255,.5);border-radius:14px`;
    /* 气泡：上方空间够放上方，否则放下方；水平贴目标中线并夹在视口内 */
    const tip=$("#g-tip");
    tip.innerHTML=`<div class="g-t"><span class="g-num">${guideIdx+1}</span>${g.title}</div><div class="g-d">${g.text}</div>`;
    const tw=300,above=y>250;
    const tx=Math.max(16,Math.min(x+w/2-tw/2,window.innerWidth-tw-16));
    tip.style.left=tx+"px";tip.style.width=tw+"px";
    tip.style.top="0px";
    const th=tip.offsetHeight||110;
    tip.style.top=(above?y-24-th:y+h+30)+"px";
    /* 曲线箭头：气泡指向目标 */
    setTimeout(()=>{
      const tr=tip.getBoundingClientRect();
      const sx=tx+tw/2, sy=above?tr.bottom+2:tr.top-2;
      const ex=x+w/2,  ey=above?y-8:y+h+8;
      const cx=sx+(ex-sx)*0.2, cy=(sy+ey)/2;
      $("#g-path").setAttribute("d",`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`);
      const dir=above?1:-1;
      $("#g-head").setAttribute("points",`${ex},${ey+dir*6} ${ex-5},${ey-dir*3} ${ex+5},${ey-dir*3}`);
    },60);

/* ---- 购物车：自定义赛事投注项 ---- */
const cmSlipCtx=it=>{const c=CM.find(x=>x.id===it.cmId);return c?{c,it:cmItem(c,it.itemKey)}:null};
/* 所见 / 本笔实际 / 成交后，三者同口径（同样计入溢价与抽水） */
function cmQuote(it,stake){
  const x=cmSlipCtx(it);if(!x)return null;
  const {c}=x, e=cmEng(c), target=x.it;
  const seen=EG.showOdds(e,c.cfg,target);
  const lim=EG.limits(e,c.cfg,target);
  if(!(stake>0))return {seen,lim,eff:null,after:seen,shares:0};
  const r=EG.buy(e,c.cfg,target,stake);
  const q=e.q.slice();target.sidx.forEach(k=>q[k]+=r.shares);
  const bk=e.q;e.q=q;const after=EG.showOdds(e,c.cfg,target);e.q=bk;
  return {seen,lim,eff:r.odds,after,shares:r.shares};
}
function cmSlipCard(it,body){

  box.innerHTML=`<div class="hd2">${esc(it.home)} vs ${esc(it.away)}<div class="lgn">${esc(it.league)}</div></div>
    <button class="x" title="移除">✕</button>

      <div class="stake"><span class="cur">CNY</span><input inputmode="decimal" placeholder="限额 2.00 ~ ${money(Q.lim.max)}" value="${S.stakes[it.key]||""}" data-k="${it.key}"></div>
      <div class="quick">${[50,100,200,500].map(v=>`<button data-add="${v}" data-k="${it.key}">+${money(v)}</button>`).join("")}<button data-max="1" data-k="${it.key}">MAX</button></div>

        <em>本笔成交赔率低于该值时拒绝本笔</em></div>`:""}

  $(".x",box).onclick=()=>{S.slip=S.slip.filter(x=>x.key!==it.key);delete S.stakes[it.key];delete S.cmMinOdds[it.key];
    if(!S.slip.length)S.sideMode="menu";render()};
  const inp=$("input[data-k]",box);

    let v=ev.target.value.replace(/[^\d.]/g,"");

    S.stakes[it.key]=v;delete S.cmMinOdds[it.key];renderSide();
  };

    S.stakes[k]=String(n.toFixed(2));delete S.cmMinOdds[k];renderSide()});
  const mx=$("[data-max]",box);if(mx)mx.onclick=()=>{S.stakes[mx.dataset.k]=String(Q.lim.max);delete S.cmMinOdds[mx.dataset.k];renderSide()};
  const mo=$(`#mo-${CSS.escape(it.key)}`,box);

/* 成交：按服务端实时价格重新计算；低于最低接受赔率直接拒绝本笔 */
function cmPlaceBets(ts,ticket){
  let done=0,total=0;const list=[];
  S.slip.filter(x=>x.cm).forEach(x=>{
    const stake=parseFloat(S.stakes[x.key]||0)||0;if(stake<=0)return;
    const ctx=cmSlipCtx(x);if(!ctx)return;
    const {c}=ctx, target=ctx.it, e=cmEng(c);
    const lim=EG.limits(e,c.cfg,target);
    if(lim.paused){toast(`${x.pick} 已暂停买入，本笔未成交`);return}
    const r=EG.buy(e,c.cfg,target,stake);
    const floor=parseFloat(S.cmMinOdds[x.key]||0)||0;
    if(floor>0&&r.odds<floor){toast(`${x.pick} 成交赔率 ${r.odds.toFixed(2)} 低于最低接受赔率 ${floor.toFixed(2)}，本笔已拒绝`);return}
    EG.apply(e,c.cfg,target,stake,r.shares);
    c.subs.push({key:x.itemKey,u:"我",amt:stake,shares:r.shares,odds:r.odds,time:ts.slice(0,16),mine:true});
    const rec={no:ticket(),time:ts,cmId:c.id,home:c.home,away:c.away,league:c.league,
      market:x.market,pick:x.pick,itemKey:x.itemKey,stake,shares:r.shares,odds:r.odds,status:"未结算"};
    S.cmBets.unshift(rec);list.push(rec);rec.slipKey=x.key;
    /* 全部开放投注项都暂停 → 整盘已售罄 */
    const allPaused=e.mks.every(mk=>mk.items.every(y=>EG.limits(e,c.cfg,y).paused));
    if(allPaused&&c.state==="open")c.state="soldout";
    S.balance-=stake;total+=stake;done++;
    delete S.stakes[x.key];delete S.cmMinOdds[x.key];
  });
  return {done,total,list};
}

    deposit:Math.max(100,parseFloat(cmNew.dep)||100),mk:Object.assign({},cmNew.mk),
    ouLines:cmNew.ouLines.slice(),ahLines:cmNew.ahLines.slice(),ehLines:cmNew.ehLines.slice(),
    csMax:cmNew.csMax,maxStake:parseFloat(cmNew.maxStake)||2000});
}
/* 字段级校验：刚打开不标红；编辑过或点过提交后才标红 */
function cmBad(){
  const b={};
  const lH=parseFloat(cmNew.lH),lA=parseFloat(cmNew.lA),dep=parseFloat(cmNew.dep),sm=parseInt(cmNew.sealMin,10);
  if(!cmNew.home.trim())b.home="请填写主队名称";
  if(!cmNew.away.trim())b.away="请填写客队名称";
  if(!cmNew.time.trim())b.time="请填写开赛时间";
  if(!(lH>=0.1&&lH<=6))b.lH="场均进球 λ 需在 0.1 ~ 6 之间";
  if(!(lA>=0.1&&lA<=6))b.lA="场均进球 λ 需在 0.1 ~ 6 之间";
  if(!(dep>=100))b.dep="押金不得低于 100";
  else if(dep>S.balance)b.dep="超出账户余额";
  if(!(Number.isInteger(sm)&&sm>=0&&sm<=180))b.sealMin="自动封盘需为 0 ~ 180 的整数";
  if(!Object.values(cmNew.mk).some(v=>v))b.mk="至少开启一类玩法";
  return b;
}
/* 正文允许 HTML 的确认弹层（prototype 的 confirmDialog 会转义正文，带表单的弹层不能用它） */
function cmConfirm({title,body,okText,onOk,wide,hideCancel}){
  const layer=$("#layer");
  const mask=el("div","mask");
  const mo=el("div","modal "+(wide?"wide":"sm"));
  mo.innerHTML=`<header>${esc(title)}<span class="tools"><button id="cls">✕</button></span></header>
    <div class="ad-body"><div class="cf-body">${body||""}</div></div>
    <footer>${hideCancel?"":`<button id="cancel">取消</button>`}<button class="ok" id="ok">${esc(okText||"确认")}</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;
  const cc=$("#cancel",mo);if(cc)cc.onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#ok",mo).onclick=()=>{const keep=onOk&&onOk();if(keep!==true)close()};
  return {close,mo};
}
function openCmNew(){

function cmRenderNew(){

  const errOf=k=>(cmTried||touched[k])?(cmBad()[k]||""):"";
  const inp=(k,ph,attrs)=>{
    const e=errOf(k);
    return `<input id="cmn-${k}" placeholder="${ph}" value="${esc(cmNew[k])}" ${attrs||""}
      style="${e?"border-color:#E24B4A":""}">${e?`<em class="cm-err">${e}</em>`:""}`;
  };
  const cfg=cmNewCfg();
  let eng=null;try{eng=EG.init(cfg)}catch(err){}
  const sug=EG.suggestLines(parseFloat(cmNew.lH)||1.55,parseFloat(cmNew.lA)||1.05);
  body.innerHTML=`
    <div class="cm-sec">赛事信息</div>
    <div class="cm-grid2">
      <label>主队<span class="cm-logo" data-logo="hLogo">${cmNew.hLogo}</span>${inp("home","主队名称")}</label>
      <label>客队<span class="cm-logo" data-logo="aLogo">${cmNew.aLogo}</span>${inp("away","客队名称")}</label>
      <label>开赛时间${inp("time","MM-DD HH:mm")}</label>
      <label>赛事直播地址（选填）${inp("live","https://")}</label>
      <label>主队场均进球 λ${inp("lH","0.1 ~ 6",'inputmode="decimal"')}</label>
      <label>客队场均进球 λ${inp("lA","0.1 ~ 6",'inputmode="decimal"')}</label>
    </div>
    <div class="cm-sec">玩法与盘口线${errOf("mk")?`<em class="cm-err">${errOf("mk")}</em>`:""}
      <label class="cm-auto"><input type="checkbox" id="cm-auto" ${cmNew.auto?"checked":""}>按 λ 自动推荐盘口线</label></div>
    <div id="cm-plays"></div>
    <div class="cm-sec">押金与收单</div>
    <div class="cm-grid2">
      <label>押金金额（≥100）${inp("dep","≥100",'inputmode="decimal"')}</label>
      <label>单笔最多收${inp("maxStake","默认 2000",'inputmode="decimal"')}</label>
      <label>自动封盘（开赛前 N 分钟）${inp("sealMin","0 ~ 180",'inputmode="numeric"')}
        <span class="cm-quick">${[["开赛时",0],["5",5],["10",10],["15",15],["30",30]].map(([t,v])=>`<button data-sm="${v}">${t}</button>`).join("")}</span></label>
      <div class="cm-note">押金是本场最大亏损上限：任何比分开出，亏损都不超过它。<br>
        自动封盘：到达设定时点后盘口停止收单、玩家不可再投注，比赛结束后由你录入赛果。<br>
        提交后需运营审核，通过才上架；押金在审核通过时冻结，未通过则不冻结，驳回原因可在「卖单 → 私盘」的盘详情中查看。</div>
    </div>
    <div class="cm-foot"><span>推荐盘口线：让球 ${sug.ah} · 大小 ${sug.ouSet.join(" / ")}</span>
      <button class="om-op primary" id="cm-sub">提交审核</button></div>`;
  /* 每类玩法开启后，直接展示该类全部投注项的开盘赔率，随 λ 与盘口线实时重算 */
  const pw=$("#cm-plays",body);
  CM_PLAYS.forEach(([k,nm])=>{
    const on=!!cmNew.mk[k];
    const row=el("div","cm-play"+(on?" on":""));
    const hd=el("div","cm-play-h",`<label><input type="checkbox" ${on?"checked":""}> ${nm}</label>`);
    $("input",hd).onchange=()=>{cmNew.mk[k]=cmNew.mk[k]?0:1;cmRenderNew()};
    row.appendChild(hd);
    if(on){
      if(k==="ou"||k==="ah"||k==="eh"){
        const pool=k==="ou"?[0.5,1.5,2.5,3.5,4.5]:(k==="ah"?[-1.5,-0.5,0.5,1.5]:[-2,-1,1,2]);
        const field=k==="ou"?"ouLines":(k==="ah"?"ahLines":"ehLines");
        const ls=el("div","cm-lines");
        pool.forEach(L=>{
          const sel=cmNew[field].includes(L);
          const b=el("button","chip sm"+(sel?" on":""),String(L));
          b.onclick=()=>{
            const a=cmNew[field],i=a.indexOf(L);
            if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(L);
            a.sort((x,y)=>x-y);cmNew.auto=false;cmRenderNew();
          };
          ls.appendChild(b);
        });
        row.appendChild(ls);
      }
      if(eng){
        const mks=eng.mks.filter(m=>m.key===k||m.key.startsWith(k));
        mks.forEach(mk=>{
          const o=el("div","cm-odds",`<span class="cm-odds-n">${esc(mk.name)}</span>`);
          mk.items.forEach(it=>o.appendChild(el("span","cm-odds-i",

  body.querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>{cmNew.sealMin=b.dataset.sm;cmRenderNew()});
  body.querySelectorAll("[data-logo]").forEach(s=>s.onclick=()=>cmPickLogo(s.dataset.logo));
  const au=$("#cm-auto",body);
  if(au)au.onchange=()=>{cmNew.auto=au.checked;
    if(cmNew.auto){const s=EG.suggestLines(parseFloat(cmNew.lH)||1.55,parseFloat(cmNew.lA)||1.05);
      cmNew.ouLines=s.ouSet.slice();cmNew.ahLines=[s.ah]}
    cmRenderNew()};
  $("#cm-sub",body).onclick=cmSubmit;
}

function cmSubmit(){
  cmTried=true;cmRenderNew();

  if(keys.length){
    const first=$("#cmn-"+keys[0]);
    if(first)first.scrollIntoView({block:"center",behavior:"smooth"});
    return;
  }
  const dep=parseFloat(cmNew.dep)||100;
  const id="CM"+String(900+CM.length).slice(-3);
  const c={id,home:cmNew.home.trim(),away:cmNew.away.trim(),league:"自定义赛事",time:cmNew.time,
    created:nowStamp().slice(5),banker:BANKER_NICK,mine:true,state:"open",bucket:"today",
    lH:parseFloat(cmNew.lH),lA:parseFloat(cmNew.lA),dep,topup:0,
    sealMin:Math.max(0,Math.min(180,parseInt(cmNew.sealMin,10)||0)),
    hLogo:cmNew.hLogo,aLogo:cmNew.aLogo,live:cmNew.live.trim(),
    mk:Object.assign({},cmNew.mk),ouLines:cmNew.ouLines.slice(),ahLines:cmNew.ahLines.slice(),
    ehLines:cmNew.ehLines.slice(),csMax:cmNew.csMax,maxStake:parseFloat(cmNew.maxStake)||2000};
  CM.unshift(c);cmEng(c);

  if(window.__cmClose)window.__cmClose();
  render();
  toast(`已提交审核，押金 ${money(dep)} 将在审核通过时冻结（演示已直接上架，可在「我的卖单 › 私盘」查看）`);
}

/* ---- 开盘详情（仅本人的盘，从 我的卖单 › 私盘 进入） ---- */
function cmDetailOpen(id){S.page="cmown";S.cmOwn=id;S.cmSubOpen=new Set();render()}
function renderCmOwn(m){
  const c=CM.find(x=>x.id===S.cmOwn);
  if(!c){S.page="history";S.histSide="卖单";return render()}
  const e=cmEng(c), cfg=c.cfg, rk=cmRisk(c), st=CM_ST[c.state];
  const b=el("div","bar");
  b.innerHTML=`<button class="icon-btn" id="back">↩</button>
    <div class="bar-title" style="margin:0 auto">开盘详情</div>
    <div class="bar-right"><span class="tagx" style="color:${st[1]};border-color:${st[1]}">${st[0]}</span></div>`;

  m.appendChild(b);

  info.innerHTML=`<div class="oi-mt">${c.hLogo||"⚽"} ${esc(c.home)} <span class="vs">vs</span> ${esc(c.away)} ${c.aLogo||"⚽"}</div>
    ${c.rejected?`<div class="cm-reject"><b>${c.rejected==="score"?"赛果审核未通过":"开盘审核未通过"}</b><span>${esc(c.rejectMsg||"")}</span></div>`:""}
    <div class="oi-sub">${esc(c.league)} · 开赛 ${esc(c.time)}</div>
    <div class="oi-sub">开盘时间 ${esc(c.created)}　场均进球 λ 主 ${c.lH} / 客 ${c.lA}　自动封盘 ${c.sealMin?("开赛前 "+c.sealMin+" 分钟"):"开赛时"}</div>`;
  m.appendChild(info);

  const sum=cmSettle(c);
  const kpi=el("div","kpi");
  [["总押金","¥"+money(c.dep+(c.topup||0))],["已收单","¥"+money(e.cash)],["子单数",c.subs.length+" 笔"],
   c.state==="settled"&&sum?["本场净盈亏",(sum.net>=0?"+":"−")+"¥"+money(Math.abs(sum.net))]
                           :["押金占用",(rk.use*100).toFixed(1)+"%"]]
   .forEach(([a,v])=>kpi.appendChild(el("div","kpi-i",`<span>${a}</span><b>${v}</b>`)));
  m.appendChild(kpi);

  /* 结算明细 */
  if(c.state==="settled"&&sum){
    m.appendChild(el("div","om-sec","结算明细"));
    const sd=el("div","card cm-settle");
    sd.innerHTML=[["收到投注合计","¥"+money(sum.cash)],["命中兑付合计","−¥"+money(sum.pay)],
      ["盈亏小计",(sum.gross>=0?"+":"−")+"¥"+money(Math.abs(sum.gross))],
      [`平台抽水（盈利部分 ${(CM_COMMISSION*100).toFixed(0)}%）`,sum.fee?"−¥"+money(sum.fee):"¥0.00"],
      ["押金解冻退回","¥"+money(c.dep+(c.topup||0))],
      ["本场净盈亏",(sum.net>=0?"+":"−")+"¥"+money(Math.abs(sum.net))]]
      .map(([a,v],i,arr)=>`<div class="cs-r${i===arr.length-1?" last":""}"><span>${a}</span><b>${v}</b></div>`).join("");
    m.appendChild(sd);
    if(c.score)m.appendChild(el("div","cm-score-note",`赛果 ${c.score[0]} : ${c.score[1]}（常规时间 90 分钟，含补时）`));
  }

  const hd=el("div","om-sec",`投注项庄单(${e.mks.reduce((a,x)=>a+x.items.length,0)})`);
  const log=el("button","cm-loglink","调水记录");
  log.onclick=()=>cmAdjLog(c);hd.appendChild(log);
  m.appendChild(hd);

  const live=["open","soldout"].includes(c.state);
  e.mks.forEach(mk=>{
    const wrap=el("div","card om-items");
    const mh=el("div","cm-mkh",`<span>${esc(mk.name)}</span>`);
    if(live){
      const allSealed=cmMkAllSealed(c,mk);
      const sl=el("button","oit-b",allSealed?"已全部封盘":"整组封盘");
      if(allSealed)sl.disabled=true;else sl.onclick=()=>cmSealMk(c,mk);
      mh.appendChild(sl);
      const rm=el("button","oit-b","移除盘口");rm.onclick=()=>cmRemoveMk(c,mk);mh.appendChild(rm);
    }
    wrap.appendChild(mh);
    mk.items.forEach((it,idx)=>{
      const cur=EG.showOdds(e,cfg,it), o0=c.open0[it.key]||cur;
      const dev=((cur/o0-1)*100);
      const lim=EG.limits(e,cfg,it);
      const subs=c.subs.filter(s=>s.key===it.key);
      const sold=subs.reduce((a,s)=>a+s.amt,0);
      const need=(it.soldShares||0);
      const cell=el("div","oit"+(idx?" sep":""));
      cell.innerHTML=`<div class="oit-h">
          <span class="oit-nm">${esc(it.name)}</span>
          <span class="oit-od g">@${cur.toFixed(2)}</span>
          <span class="oit-off">开盘 @${o0.toFixed(2)} <i class="${dev>=0?"cm-up":"cm-dn"}">${dev>=0?"+":""}${dev.toFixed(1)}%</i></span>
          <span class="oit-amt">已收 <b class="num">¥${money(sold)}</b></span>
          <span class="oit-amt">命中需赔 <b class="num">¥${money(need)}</b></span>
          <span class="oit-amt">本笔上限 <b class="num">¥${money(lim.max)}</b></span>
          ${cmSealedIt(c,it)?`<span class="tagx" style="color:#2f7bd8;border-color:#2f7bd8">已封盘</span>`
            :lim.paused?`<span class="tagx" style="color:var(--ink-mute);border-color:var(--ink-mute)">暂停</span>`:""}
        </div>`;
      if(live){
        const ops=el("div","oit-ops");
        const sealed=cmSealedIt(c,it);
        if(!sealed){const adj=el("button","oit-b","调水");adj.onclick=()=>cmAdjust(c,mk,it);ops.appendChild(adj)}
        const sl=el("button","oit-b",sealed?"已封盘":"封盘");
        if(sealed)sl.disabled=true;else sl.onclick=()=>cmSealIt(c,mk,it);
        ops.appendChild(sl);
        $(".oit-h",cell).appendChild(ops);
      }
      const sid=c.id+":"+it.key, open=S.cmSubOpen.has(sid), has=subs.length>0;
      const sh=el("div","oit-subh"+(has?"":" none"),
        has?`<span>子单数据(${subs.length})</span><span class="ar">${open?"收起 ⌃":"展开 ⌄"}</span>`
           :`<span>子单数据(0)：暂无成交</span>`);
      if(has)sh.onclick=()=>{open?S.cmSubOpen.delete(sid):S.cmSubOpen.add(sid);render()};
      cell.appendChild(sh);
      if(has&&open){
        const sb=el("div","oit-subs");
        subs.forEach(f=>sb.appendChild(el("div","sub-i",
          `<div class="sub-r1"><span class="sub-m">${f.mine?"我":"会员"}</span><span>${esc(f.u)}</span>
             <span class="num">¥${money(f.amt)}</span><span class="num">${f.shares.toFixed(2)} 份</span><span class="num">@${f.odds.toFixed(2)}</span></div>
           <div class="sub-r2"><span>${esc(f.time)}</span></div>`)));
        cell.appendChild(sb);
      }
      wrap.appendChild(cell);
    });
    m.appendChild(wrap);
  });

  /* 底部操作区按状态变化 */
  const ops=el("div","om-ops cm-ops-fix");
  if(live){
    const a=el("button","om-op primary","补充押金");a.onclick=()=>cmTopup(c);ops.appendChild(a);
    const d=el("button","om-op danger","赛事下架");d.onclick=()=>cmTakeDown(c);ops.appendChild(d);
  }else if(c.state==="sealed"){
    const s2=el("button","om-op primary","录入赛果");s2.onclick=()=>cmScore(c);ops.appendChild(s2);
  }else if(c.state==="pending"&&c.rejected==="score"){
    const s2=el("button","om-op primary","重新录入赛果");s2.onclick=()=>cmScore(c);ops.appendChild(s2);
  }
  if(ops.children.length)m.appendChild(ops);
}

/* 开盘详情顶部的状态横幅，文案与 H5 一致 */
function cmStateHint(c){
  if(c.state==="settled")return {k:"ok",t:`本场已结算，赛果 ${c.score?c.score[0]+"-"+c.score[1]:"--"}。押金已全额解冻退回，盈亏已入账。`};
  if(c.state==="closed")return {k:"bad",t:"本场已作废，全部成交已撤销、投注金额原路退回，押金全额解冻，本场不计盈亏。"};
  if(c.state==="soldout")return {k:"warn",t:"押金占用已触顶，暂时无法接受新注。补充押金后可恢复收单。"};
  if(c.state==="sealed")return {k:c.autoSealed?"warn":"plain",
    t:c.autoSealed?`已到自动封盘时点（开赛前 ${c.sealMin} 分钟），盘口已停止收单。比赛结束后请录入赛果，提交后由运营审核，审核通过即正式结算。`
                  :"已停止收单。比赛结束后请录入赛果，提交后由运营审核，审核通过即正式结算。"};
  if(c.state==="pending"&&c.rejected==="open")return {k:"plain",t:"开盘申请已提交，等待运营审核。审核通过后自动上架并冻结押金。"};
  if(c.state==="pending")return {k:"plain",t:`赛果 ${c.score?c.score[0]+"-"+c.score[1]:"--"} 已提交，等待运营审核。审核通过后正式结算并兑付。`};
  return null;
}

/* ---- 控盘操作 ---- */
const CM_ADJ_ONE=0.05, CM_ADJ_ALL=0.30;
function cmAdjust(c,mk,it){
  const e=cmEng(c), cfg=c.cfg;
  const cur=EG.showOdds(e,cfg,it), o0=c.open0[it.key]||cur;
  const used=c.adjSum[it.key]||0;
  let pt=0;
  const body=()=>`<div class="cm-adj">
      <div class="ca-r"><span>当前庄单赔率</span><b>${cur.toFixed(2)}</b></div>
      <div class="ca-r"><span>开盘赔率（参考）</span><b>${o0.toFixed(2)}</b></div>

/* 调水等效于庄家替市场推动一次持仓：改的是该投注项命中的全部比分状态，跨玩法同价自动维持 */
function cmDoAdjust(c,mk,it,pt){
  if(!pt)return;
  const e=cmEng(c), cfg=c.cfg;
  const cur=EG.showOdds(e,cfg,it), used=c.adjSum[it.key]||0;
  if(Math.abs(pt)>CM_ADJ_ONE+1e-9)return toast("单次调水不得超过 "+CM_ADJ_ONE.toFixed(2));
  if(used+Math.abs(pt)>CM_ADJ_ALL+1e-9)return toast("累计调水已达上限 "+CM_ADJ_ALL.toFixed(2));
  const target=cur+pt;
  if(target<CM_CFG.minOdds||target>CM_CFG.maxOdds)return toast("新赔率超出平台区间");
  /* 二分求使该项赔率落到目标值的持仓位移 */
  const shift=d=>{const q=e.q.slice();it.sidx.forEach(k=>q[k]+=d);
    const bk=e.q;e.q=q;const v=EG.showOdds(e,cfg,it);e.q=bk;return v};
  let lo=-e.b*4,hi=e.b*4;
  for(let t=0;t<80;t++){const mid=(lo+hi)/2; shift(mid)>target?hi=mid:lo=mid}
  it.sidx.forEach(k=>e.q[k]+=lo);
  const now=EG.showOdds(e,cfg,it);
  c.adjSum[it.key]=used+Math.abs(pt);
  c.adj.unshift({key:it.key,name:mk.name+" · "+it.name,from:cur,to:now,pt,
    cash:+e.cash.toFixed(2),use:(cmRisk(c).use*100).toFixed(1)+"%",
    op:BANKER_NICK,time:nowStamp()});
  render();
  toast(`已调水：${cur.toFixed(2)} → ${now.toFixed(2)}`);
}

/* 封盘以投注项为单位 */
const cmSealedIt=(c,it)=>!!(c.sealedIt&&c.sealedIt[it.key]);
const cmMkAllSealed=(c,mk)=>mk.items.every(it=>cmSealedIt(c,it));
function cmSealIt(c,mk,it){

    onOk:()=>{c.sealedIt=c.sealedIt||{};c.sealedIt[it.key]=1;cmSyncSold(c);render();toast("已封盘："+it.name)}});

/* 整组封盘：对该玩法全部未封盘的投注项逐项封盘 */
function cmSealMk(c,mk){
  const rest=mk.items.filter(it=>!cmSealedIt(c,it));
  cmConfirm({title:"整组封盘",okText:"确认封盘",
    body:`对「${esc(mk.name)}」下尚未封盘的 ${rest.length} 个投注项逐项封盘？等同于逐个点封盘，已成交份额照常结算。此操作不可撤销。`,
    onOk:()=>{c.sealedIt=c.sealedIt||{};rest.forEach(it=>c.sealedIt[it.key]=1);cmSyncSold(c);render();toast("已整组封盘："+mk.name)}});
}
/* 全部开放投注项都封盘或暂停时，整盘转为已售罄 */
function cmSyncSold(c){
  const e=cmEng(c);
  const all=e.mks.every(mk=>mk.items.every(it=>cmSealedIt(c,it)||EG.limits(e,c.cfg,it).paused));
  if(all&&c.state==="open")c.state="soldout";
}
function cmRemoveMk(c,mk){
  const has=c.subs.some(s=>mk.items.some(it=>it.key===s.key));
  if(has)return toast("该玩法已有成交，不可移除");
  cmConfirm({title:"移除盘口",okText:"确认移除",
    body:`移除「${esc(mk.name)}」？移除会改变比分状态的合并方式，其余玩法赔率随之重算；已成交份额按原成交赔率结算不受影响。`,
    onOk:()=>{
      const k=mk.key.replace(/[-\d.]+$/,"");
      if(k==="ou"||k==="ah"||k==="eh"){
        const f=k+"Lines", L=parseFloat(mk.key.slice(k.length));
        c[f]=(c[f]||CM_CFG[f]).filter(x=>x!==L);
        if(!c[f].length){c.mk=Object.assign({},c.mk||CM_CFG.mk,{[k]:0})}
      }else{c.mk=Object.assign({},c.mk||CM_CFG.mk,{[mk.key.startsWith("tg")?"tg":mk.key]:0})}
      const subs=c.subs,adj=c.adj,adjSum=c.adjSum,open0=c.open0;
      delete c.eng;cmEng(c);c.subs=subs;c.adj=adj;c.adjSum=adjSum;c.open0=Object.assign(c.open0,open0);
      render();toast("已移除，其余玩法赔率已重算");
    }});
}
/* 补充押金：亏损上限提高、流动性加深，当前赔率保持不变 */
function cmTopup(c){
  let v="";
  cmConfirm({title:"补充押金",okText:"确认补充",
    body:`<div class="stake"><span class="cur">CNY</span><input id="cm-tp" inputmode="decimal" placeholder="追加金额"></div>
      <div class="cm-note" style="margin-top:8px">追加后本场最大亏损上限提高，盘口流动性同步加深（同样金额对赔率的推动变小），当前赔率保持不变。已售罄的盘补充后自动恢复为卖出中。</div>`,
    onOk:()=>{
      const n=parseFloat(($("#cm-tp")||{}).value||0)||0;
      if(n<=0){toast("请输入追加金额");return true}
      if(n>S.balance){toast("余额不足，不产生任何冻结");return true}
      const e=cmEng(c), ratio=(c.cfg.deposit+n)/c.cfg.deposit;
      /* b 按押金等比放大，同时等比缩放 q 使价格不变 */
      e.q=e.q.map(x=>x*ratio); e.b=e.b*ratio;
      c.topup=(c.topup||0)+n; c.cfg.deposit+=n;
      S.balance-=n;
      if(c.state==="soldout")c.state="open";
      render();toast("已补充押金 ¥"+money(n)+"，赔率不变、流动性加深");
    }});
}

/* ---- 买单：做市注单并入官方注单表 ---- */
/* 做市注单 → 注单表结构：最高可赢 = 获得份额 − 投注额（份额即命中时的兑付额） */
function cmAsBet(b){
  const c=CM.find(x=>x.id===b.cmId);
  const done=b.status==="已结算";
  const r=done?cmBetResult(b,c):null;
  return {no:b.no,time:b.time,type:"单关",stake:b.stake,
    legs:[{sport:"足球",league:"自定义赛事",home:b.home,away:b.away,
      market:b.market,pick:b.pick,odds:b.odds.toFixed(2),oddsType:"欧洲盘",
      final:done&&c&&c.score?c.score[0]+"-"+c.score[1]:null,
      finalNote:done?`获得份额 ${b.shares.toFixed(2)}`:null}],
    win:+(b.shares-b.stake).toFixed(2),
    refund:done?(r.win?+b.shares.toFixed(2):0):0,
    stamp:done?(r.win?"赢":"输"):null,
    settle:done?b.time:null,
    status:done?"已结算":"未结算",cm:true};
}
function cmBetResult(b,c){
  if(!c||!c.score)return {win:false,amt:b.stake,score:"--"};
  const it=cmItem(c,b.itemKey||"");
  const hit=it?it.hit(c.score[0],c.score[1]):false;
  return {win:hit,amt:hit?(b.shares-b.stake):b.stake,score:c.score[0]+":"+c.score[1]};
}

   "投注项价格 = 其命中的全部比分状态价格之和。同一件事从不同玩法买到的价格必然相同，不存在跨玩法套利。",
   "同一玩法各投注项价格之和 = 1 + 溢价（默认 3%，按开盘概率分摊，平台统一配置，庄家不可改）。",
   "显示赔率 =（1 − 抽水率）÷ 价格，再按赔率封顶（默认 99）截取。",
   "买的人越多价格越高、赔率越低；盘口开始浅，成交越多越深。玩家使用钱包余额下注，没有「期初余额」概念。"]},
  {t:"两处抽水，口径不同",d:[
   "玩家侧抽水：默认每万收 300（即 3%），每笔成交当下收取，以压低赔率的方式收 —— 玩家付 100 元，只有 97 元进入做市计算份额，账面看不到单独扣款，体现为份额少拿。",
   "庄家侧抽水：由 APISYS 下发，演示 2%，结算时对庄家盈利部分收取、亏损不收，在结算明细中单列一行。",
   "赛事作废时按投注金额全额退回：玩家侧抽水只是少给了份额、并非单独扣款，全额退回即自动包含该部分，平台在作废场次上不赚不亏；庄家侧抽水因未进入结算阶段，本就不会产生。"]},
  {t:"暂停与售罄",d:[
   "赔率降到平台最低赔率（默认 1.05），或本笔可投额度低于 5 时，该投注项暂停买入，格子置灰并标「暂停」。",
   "全部开放投注项都暂停时，整盘转为已售罄；补充押金后自动恢复为卖出中。暂停只影响买入。"]},
  {t:"本期不做",d:[
   "撤销结算：结算后如发现赛果有误走人工处理，不在 C 端提供撤销入口。",
   "庄家侧赔率下限（被压价到多少就停止收单）不在开盘弹窗配置；玩家卖出份额；自定义赛事参与串关。",
   "账变记录、B 端的开盘审核 / 赛果审核 / 作废处理 / 参数配置 / 操作日志，均另行出需求与原型。",
   "结构性永久不做：亚洲让球整数线与大小球整数线 —— 走盘要退本金，无法用比分状态表达，与按比分做市的底层结构冲突。"]}
 ],
 cmdetail:[
  {t:"赛事详情（纯投注页面）",d:[
   "从赛事大厅或赛果页进入。无论这场盘是谁开的，页面表现完全一致，不展示庄家风险区与控盘操作；庄家管理自己的盘走「我的卖单 › 私盘 › 开盘详情」，两者是两个独立页面。",
   "横幅：球场背景，圆形队徽、队名、比赛状态与开赛时间；已结算 / 待审核时展示比分；配置了直播地址时展示「动画直播」，点击后在横幅内播放、可关闭；底部为庄家昵称。",
   "顶栏右上角分享：只有「分享到金刚」，不含 TG 与复制链接；分享整场赛事，接收方进入本场详情、不预选投注项。",
   "玩法 Tab：全部 / 各玩法分类，左侧带折叠箭头。",
   "赔率区：按主客两列并排，列头为带橙色竖条的队名（大小球为「大球 / 小球」，双方进球为「是 / 否」）；波胆等多项玩法用三列网格。"]},
  {t:"禁止庄家自投",d:[
   "庄家能调水、又由庄家录入赛果，若允许自投则存在「先调水拉高赔率、自投后再压回」以及「按对自己有利的比分录入」的操纵路径。",
   "赔率格点击与下单提交两处都做拦截，提示「不能投注自己开的盘」；自己的盘在列表与详情中赔率照常展示但不可点击，详情页顶部给出说明。"]}
 ],
 slip:[
  {t:"购物车",d:[
   "沿用原有购物车，不另开面板。选中自定义赛事投注项直接进原购物车；卖出页签自动隐藏 —— 做市成交不支持被其他会员卖出；关闭按钮保留。",
   "卡片右上角是本笔实际成交赔率，随输入金额实时变动，后面紧跟「(低 X%)」说明相对所见赔率的差距；输入框上方一行对照展示所见赔率与成交后赔率；盘口类型标注为 [欧洲盘]。",
   "赢时可得不在购物车展示，在投注成功后的注单确认弹窗中以「获得份额」与「可赢金额」呈现。",
   "自定义赛事不参与串关，串关按钮置灰。"]},
  {t:"三个赔率的关系",d:[
   "所见赔率 ＞ 本笔实际赔率 ＞ 成交后赔率。",
   "所见赔率：下单前该投注项的当前赔率（边际赔率）。本笔实际赔率：这笔钱买到的平均赔率，投注额越大越低。成交后赔率：本笔推动价格后该项的新赔率，供玩家判断自己对盘口的影响。",
   "三者必须同口径（同样计入溢价与抽水），否则小额投注会算出「本笔高于所见」的矛盾结果。"]},
  {t:"单笔上限",d:[
   "单笔上限 = 以下三项取最小，直接作为输入框的限额提示（「限额 2.00 ~ X」），不单独列字段：单笔最多收（庄家设定，默认 2000）；滑点上限金额（使本笔滑点恰好等于适用滑点上限的投注额）；最低赔率限额（把价格推到价格上限所需的投注额）。",
   "适用滑点上限：普通项默认 5%；价格低于冷门线（默认 20%）时按价格高低线性放宽，最多到冷门封顶（默认 20%）。输入超过上限时按上限试算并提示，不直接拒绝。"]},
  {t:"最低接受赔率与并发",d:[
   "最低接受赔率（玩家侧）：输入金额后出现，默认填当前成交后赔率。从点击下注到真正成交之间别人可能抢先买入把价格推高、赔率压低，本笔成交赔率低于该值时直接拒绝本笔，相当于限价单的保护价。",
   "并发要求（必须写进研发需求）：每笔成交都移动价格，同一场比赛的成交必须串行处理，价格读取与扣减在同一事务内完成，否则份额算错、押金保护失效，平台亏损可能突破押金。",
   "试算与成交之间价格若被他人推动，应以服务端实时价格重新计算，超出玩家可接受滑点时拒绝。"]}
 ],
 history:[
  {t:"买单列表",d:[
   "买单列表不与官方注单统一展示：官方注单是固定赔率、字段为「投注金额 / 最高可赢」；自定义赛事是做市成交、额外有「获得份额」，两者各按自己的口径展示，不合并成同一种卡片。",
   "未结算卡片右上角与官方注单一致，展示「已确认 / 确认中」，不展示「自定义」标签 —— 盘口类型在下方「足球 | 自定义赛事」已标明。",
   "已结算卡片展示输赢标签、输赢金额、比分，格式与官方注单一致。"]}
 ],
 sell:[
  {t:"我要开盘",d:[
   "赛事信息：主队名与队徽、客队名与队徽、开赛时间、赛事直播地址（选填）、两队场均进球 λ（0.1 ~ 6）。",
   "七类玩法可勾选，大小球与让球可多选盘口线，带「按 λ 自动推荐盘口线」开关；每类玩法开启后，其下方直接展示该类全部投注项的开盘赔率，随 λ 与盘口线实时重算。",
   "押金与收单：押金金额（≥100）、单笔最多收（默认 2000）、自动封盘时长（默认开赛前 10 分钟，快捷项「开赛时 / 5 / 10 / 15 / 30 分钟」，也可自定义输入 0 ~ 180 的整数）。",
   "抽水比例由 APISYS 下发，不在本页配置；溢价与赔率封顶由平台统一控制，不对庄家展示。",
   "必填校验按字段就地提示：刚打开不标红；字段被编辑过或点过提交后，不合法的字段输入框边框变红、下方给一行红色说明，改正后即消失；点提交时滚动定位到第一个出错字段。",
   "提交后需运营审核，通过才上架；押金在审核通过时冻结，未通过则不冻结。"]},
  {t:"完整生命周期",d:[
   "① 庄家开盘：填赛事信息、玩法与盘口线、押金，提交后进入待审核。",
   "② 上架收单：玩家可投注，状态在卖出中与已售罄之间自动切换（押金占用触顶即售罄，补充押金后恢复）。庄家可调水、补充押金、主动赛事下架。",
   "③ 自动封盘：到达开赛前 N 分钟系统自动封盘、停止收单，状态转为已封盘；庄家主动下架也进入该状态。",
   "④ 庄家录入赛果：比赛结束后在开盘详情底部点「录入赛果」，填入常规时间 90 分钟（含补时）比分并提交，状态转为待审核。",
   "⑤ 运营审核：后台核对公开赛果，通过则正式结算；不通过时盘仍为待审核，底部按钮变为「重新录入赛果」。审核通过前不发生任何资金兑付。",
   "⑥ 已结算：按赛果兑付子单，押金解冻退回，盘详情展示结算明细与本场净盈亏。",
   "异常路径：比赛取消、延期超 48 小时、腰斩后 48 小时未恢复，由运营作废，状态转为已关闭，全部成交撤销、投注金额全额原路退回、庄家押金全额解冻、不计盈亏、不抽庄家的水。"]},
  {t:"状态与对外展示",d:[
   "内部有开盘待审核、赛果待审核、开盘被驳回、赛果被驳回四种情形，对庄家统一显示为「待审核」，筛选项里也只有一个「待审核」涵盖这四种。区别只体现在详情页的驳回区块与底部按钮上。",
   "卖出中（正常收单）：补充押金 / 赛事下架。已售罄（押金占用触顶，补充押金后自动恢复）：补充押金 / 赛事下架。",
   "已封盘（到达自动封盘时点或庄家主动下架）：录入赛果。待审核：赛果被驳回时为「重新录入赛果」，其余无按钮。已结算、已关闭：无按钮。"]},
  {t:"开盘详情",d:[
   "仅从「我的卖单 › 私盘」页签进入，只有本人的盘能进。顶栏：返回、标题「开盘详情」、右侧盘状态标签。",
   "赛事信息卡：主客队、联赛与开赛时间、开盘时间、两队场均进球 λ、自动封盘设置；被驳回时在队名下方展示红色驳回区块（标题 + 原因正文，不展示驳回人与时间）。",
   "四列汇总：总押金 / 已收单 / 子单数 / 押金占用；已结算时第四格换为本场净盈亏。",
   "投注项庄单卡片：玩法 · 投注项名；当前赔率、开盘赔率与偏离百分比；已收、命中需赔、本笔上限；子单数据默认收起，可展开查看每笔的买家、金额、份额、成交赔率、时间。"]},
  {t:"控盘操作",d:[
   "调水：弹窗结构为「当前庄单赔率 → 开盘赔率（参考）→ 调整点位 → 新庄单赔率」。调整点位即赔率增减量（两位小数、可为负），带 －/＋ 步进每次 0.01。参考基准用开盘赔率（自定义赛事无官方盘可参照），并展示当前相对开盘的偏离百分比。新赔率需落在平台最低赔率与赔率封顶之间。",
   "调水闸门：单次调水不超过 0.05，单个投注项累计调水（历次绝对值之和）不超过 0.30。弹窗实时显示剩余额度，超限时提示原因并禁用确认按钮。",
   "调水留痕：每次调水记录投注项、调整前后赔率、调整幅度、调水时的已收单金额与押金占用、操作人与时间；开盘详情「投注项庄单」标题右侧有「调水记录」入口可查。",
   "立即封盘：以投注项为单位。封盘后该投注项停止收单、前台赔率格不可投，同玩法内其余投注项不受影响，已成交份额照常结算，不可撤销；玩法标题上另有「整组封盘」，等同于对该玩法下尚未封盘的投注项逐项封盘。",
   "单项封盘的已知影响（需研发与风控知悉）：做市定价下同一玩法内各投注项共享同一条价格曲线，封掉其中一项而保留其余项，会使「同一件事从不同玩法买到的价格必然相同」这条不再处处成立 —— 例如封掉波胆中的某几个比分后，用独赢或大小球仍可买到这些比分对应的敞口。本期按产品决策执行单项封盘，跨玩法同价不再作为封盘后的强约束。",
   "全部开放投注项都被封盘或暂停时，整盘转为已售罄。",
   "移除盘口：仅该玩法无任何成交时可移除。移除会改变比分状态的合并方式，其余玩法赔率随之重算；已成交份额按原成交赔率结算不受影响。",
   "补充押金：追加押金后本场最大亏损上限提高，盘口流动性同步加深（同样金额对赔率的推动变小），当前赔率保持不变；已售罄的盘补充后自动恢复为卖出中。",
   "赛事下架：下架后该赛事不再在赛事列表展示、不可再撮合下注；已成交子单照常等待赛果结算，未消费押金结算后退回。此操作不可撤销。",
   "分享：分享该玩法及其投注项赔率到金刚，接收方进入本场赛事详情并定位到该玩法。"]},
  {t:"调水与算法定价的关系",d:[
   "调水不会架空算法。算法约束的不是赔率数值本身，而是赔率与风险敞口的绑定：赔率由持仓量决定，亏损上限由押金锁死。调水等效于庄家替市场推动了一次持仓，系统后续定价仍从新的持仓出发，不穿仓、跨玩法同价、价格随资金移动三条约束全部继续成立。",
   "跨玩法同价在调水场景下自动维持：调水改的是该投注项命中的全部比分状态，波胆等相关玩法的价格会同步联动，不会出现「主胜调了、波胆没动」的缺口。该性质在单项封盘后不再处处成立，见控盘操作一节。",
   "调水的真实作用是调节吸单速度与敞口。实测：抬高赔率后玩家投入从 1675 增至 2175、押金占用从 16.7% 升到 49.3%；压低赔率则相反。因此赛事列表的赔率跟随调水变化是正确的，那就是当前真实可成交的价格。"]},
  {t:"我的卖出 · 私盘页签",d:[
   "页签：投注项卖单与私盘；私盘页签只展示本人创建的盘。",
   "卡片字段：联赛、状态标签、分享按钮（靠最右）、主客队、盘号、两队 λ、押金、收单进度、开赛时间；已结算盘在状态标签左侧展示本场净盈亏。",
   "状态筛选为七项：全部 / 卖出中 / 已售罄 / 已封盘 / 待审核 / 已结算 / 已关闭。",
   "被驳回的盘状态标签仍为「待审核」，卡片内给一行红色提示说明是赛果被驳回还是开盘被驳回并引导进详情，原因正文不在列表展示。"]},
  {t:"结算",d:[
   "赛果只计常规时间 90 分钟（含补时），不含加时赛与点球大战；赛果比分超出模型球数范围时按比分状态结算，任何非负整数比分都能结算；赛果由庄家录入、运营审核，审核通过前不发生任何资金兑付。",
   "结算明细计算链条：盈亏小计 = 收到投注合计 − 命中兑付合计；平台抽水 = 盈亏小计 × 抽水比例（仅盈利时收取，亏损不收）；本场净盈亏 = 盈亏小计 − 平台抽水。",
   "同源要求：卖单列表卡片上的本场净盈亏、开盘详情四列汇总的净盈亏、结算明细的本场净盈亏，三处必须取同一个计算结果，不得各算各的。"]}
 ],
 report:[
  {t:"汇总报表需包含私盘",d:[
   "总盈亏 = 买单盈亏 + 卖单盈亏 + 私盘盈亏，三者都是已扣除平台抽佣后的净额。",
   "按日明细表新增「私盘盈亏」一列，表头为：日期 / 买单输赢 / 卖单盈亏 / 私盘盈亏 / 合计。",
   "展开某一日时新增一组「私盘（自定义赛事）」，字段为结算场次、收到投注、平台抽水、押金合计、子单笔数、本日盈亏，底部提供「查看私盘」跳转。",
   "归集口径：按结算时间归集，只统计已结算的私盘；进行中的私盘只计入顶部快照，不计入盈亏、不随时间筛选变化。",
   "押金与投注额不可相加，不设「总投入」这类合并指标。"]}

 me:[
  {t:"赛果页",d:[
   "赛果页仅在足球下展示自定义赛事，独立分组置顶、可展开收起，与下方 IM 赛果版式一致；不提供点击进详情。"]},
  {t:"限制与参数",d:[
   "本期不设限制：玩家持有自定义赛事注单的场次数与累计金额不限（只有单笔上限）；庄家同时进行中的自定义赛事场次数不限（押金逐场冻结，资金上自然受约束）。",
   "参数默认值（上线前由运营给出正式取值）：押金下限 100；单笔最多收 2000（庄家可改）；自动封盘 开赛前 10 分钟（0 ~ 180）；玩家侧抽水 每万收 300；庄家侧抽水 2%（APISYS 下发）；溢价 3%；平台最低赔率 1.05；赔率封顶 99；滑点上限 5%（冷门放宽至 20%）；冷门线 价格 20%；暂不可投阈值 单笔上限 < 5；调水单次上限 0.05；调水累计上限 0.30。"]}
 ]
};
/* 右栏只展示本页相关条目；上一期私盘坐庄的说明整体不再出现 */
function renderSpec(r){
  const pg=(()=>{
    if(S.sideMode==="slip")return "slip";
    if(S.page==="cmdetail")return "cmdetail";
    if(S.page==="cmown")return "sell";
    if(S.page==="history")return S.histSide==="卖单"?"sell":"history";
    if(S.page==="report")return "report";
    if(S.page==="results"||S.page==="rules")return "me";
    if(S.page==="detail")return "cmdetail";
    return "live";
  })();
  const items=CM_SPEC[pg]||[];
  if(!items.length){r.appendChild(el("div","sp-none","该页面本期无自定义赛事坐庄相关说明"));return}
  items.forEach(it=>{
    r.appendChild(el("div","sp-h",it.t));
    r.appendChild(el("ul","sp-ul",it.d.map(x=>`<li>${x}</li>`).join("")));
  });
}
function renderRight(){
  const r=$("#rp");r.innerHTML="";
  const narrow=window.innerWidth<=1680;
  const open=narrow?S.specNarrowOpen:S.specOpen;
  r.className="rp"+(open?"":" mini");
  if(!open){
    const b=el("button","rp-mini",`<span class="ar">‹</span><span class="tx">需求说明 · 自定义赛事坐庄</span>`);
    b.title="展开需求说明";
    b.onclick=()=>{narrow?S.specNarrowOpen=true:S.specOpen=true;saveSpecPref();renderRight()};
    r.appendChild(b);return;
  }
  const head=el("div","rp-head",`<b>需求说明</b><i class="rp-sub">自定义赛事坐庄 V1.0</i>`);
  const f=el("button","rp-fold","›");f.title="收起";
  f.onclick=()=>{narrow?S.specNarrowOpen=false:S.specOpen=false;saveSpecPref();renderRight()};
  head.appendChild(f);r.appendChild(head);
  renderSpec(r);
}

document.documentElement.setAttribute("data-theme",S.theme);
render();
/* 原型默认不弹引导，避免每次进来都要跳过；需要演示时走「设置 › 新手引导」
   线上的一次性触发条件见右侧需求说明 */
