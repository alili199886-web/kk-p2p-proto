<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>金刚体育 PC 原型</title>
<style>
:root{
  --grad:linear-gradient(180deg,#FFC838 0%,#FF6D24 100%);
  --grad-h:linear-gradient(270deg,#FFC838 -35.56%,#FF6D24 100%);
  --accent:#ff8c00;
  --accent-ink:#ff6d24;
  --bg:#e6e6e6;
  --surface:#ffffff;
  --surface-2:#f7f7f7;
  --surface-3:#fafafa;
  --head:#ffffff;
  --line:#ececec;
  --line-2:#e3e3e3;
  --ink:#4d4d4d;
  --ink-strong:#303233;
  --ink-mute:#9b9b9b;
  --odds:#111111;
  --control:#ffffff;
  --control-line:#e0e0e0;
  --green:#17a25a;
  --scorebox:#2fae5f;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --lcol:366px;
  --hd:54px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1d1f24; --surface-2:#2b2f3a; --surface-3:#212429;
    --head:#27292e; --line:#2d313a; --line-2:#2d313a;
    --ink:#ffffff; --ink-strong:#ffffff; --ink-mute:#c9c9c9; --odds:#ffffff;
    --control:#474b56; --control-line:#535f72; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1d1f24; --surface-2:#2b2f3a; --surface-3:#212429;
  --head:#27292e; --line:#2d313a; --line-2:#2d313a;
  --ink:#ffffff; --ink-strong:#ffffff; --ink-mute:#c9c9c9; --odds:#ffffff;
  --control:#474b56; --control-line:#535f72; --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.hd{position:fixed;top:0;left:0;right:0;height:calc(var(--hd) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);background:var(--head);z-index:60;
  display:flex;align-items:center;gap:16px;padding-inline:16px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.logo{width:34px;height:34px;border-radius:9px;background:#1b8cf0;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.nav{display:flex;gap:8px;align-items:center;margin-left:100px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:30px;white-space:nowrap;
  font-size:14px;font-weight:500;color:var(--ink);transition:background .15s}
.nav-pill .ic{font-size:13px;opacity:.9}
.nav-pill:hover{background:rgba(255,140,0,.08)}
.nav-pill.on{background:var(--grad);color:#fff}
.hd-right{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.ctrl{height:28px;padding:0 10px;border:1px solid var(--control-line);background:var(--control);border-radius:6px;
  font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.caret{font-size:9px;opacity:.7}

/* ---------- shell ---------- */
.shell{display:flex;gap:8px;padding-top:calc(var(--hd) + 8px);align-items:flex-start;min-height:100vh}
.side{width:240px;flex:none;background:var(--surface);border-radius:0 8px 8px 0;position:sticky;
  top:calc(var(--hd) + 8px);max-height:calc(100vh - var(--hd) - 16px);overflow:auto;box-shadow:var(--shadow)}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.rp{width:368px;flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(var(--hd) + 8px)}
.side::-webkit-scrollbar,.mkt-list::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb,.mkt-list::-webkit-scrollbar-thumb{background:#c9c9c9;border-radius:3px}

/* ---------- sidebar ---------- */
.search{margin:12px;height:36px;border:1px solid var(--line-2);border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:6px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);font-size:14px}
.nick{padding:0 14px;font-weight:700;color:var(--ink-strong);font-size:15px}
.bal-row{display:flex;align-items:center;gap:8px;padding:10px 14px}
.bal{flex:1;height:34px;border-radius:6px;background:var(--grad-h);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.icon-btn{width:22px;height:22px;display:grid;place-items:center;color:var(--accent);flex:none}
.sb-item{width:100%;height:42px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  color:var(--ink-strong);font-size:14px;text-align:left;transition:background .12s}
.sb-item:hover{background:rgba(255,140,0,.06)}
.sb-item.on{background:rgba(255,140,0,.1);color:var(--accent);font-weight:500;box-shadow:inset 3px 0 0 var(--accent)}
.sb-item .lbl{display:flex;align-items:center;gap:8px;min-width:0}
.sb-item .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-cnt{font-size:12px;color:var(--ink-mute)}
.sb-item.on .sb-cnt{border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:1px 9px;font-size:11px}
.sb-sep{height:1px;background:var(--line);margin:6px 0}
.period{display:flex;background:var(--surface-3);border-top:1px solid var(--line)}
.period button{flex:1;height:42px;font-size:14px;font-weight:500;color:var(--ink);position:relative}
.period button.on{color:var(--accent)}
.period button.on::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:26px;height:2px;background:var(--accent);border-radius:2px}

/* ---------- page bar ---------- */
.bar{background:var(--surface);border-radius:8px;height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow)}
.bar.sticky{position:sticky;top:calc(var(--hd) + 8px);z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bar-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-strong);white-space:nowrap}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:2px}
.seg button{height:26px;padding:0 14px;border-radius:14px;font-size:13px;color:var(--ink)}
.seg button.on{background:var(--grad-h);color:#fff;font-weight:500}
.mini{font-size:12px;color:var(--ink-mute)}
.crumb{color:var(--ink-mute)}
.crumb b{color:var(--ink-strong);font-weight:500}

/* ---------- chips ---------- */
.chips{background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;gap:8px;overflow-x:auto;box-shadow:var(--shadow);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:28px;padding:0 12px;border-radius:15px;background:var(--surface-2);font-size:12px;white-space:nowrap;
  display:flex;align-items:center;gap:5px;color:var(--ink);flex:none}
.chip.on{background:var(--grad-h);color:#fff;font-weight:500}
.chip .n{opacity:.75;font-size:11px}
.chips .spacer{margin-left:auto}

/* ---------- group / card ---------- */
.grp{background:var(--surface);border-radius:8px;height:40px;display:flex;align-items:center;padding:0 14px;box-shadow:var(--shadow)}
.grp .gt{font-size:14px;color:var(--ink-strong);font-weight:500}
.grp .gt.acc{color:var(--accent)}
.fold{margin-left:auto;height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--control-line);background:var(--control);
  font-size:12px;display:flex;align-items:center;gap:4px;color:var(--ink)}
.card{background:var(--surface);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.lg{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface-3);
  border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.lg-name{font-size:13px;color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{width:18px;height:14px;border-radius:2px;background:var(--surface-2);display:grid;place-items:center;font-size:9px;flex:none;overflow:hidden}
.p2p{background:var(--grad);color:#fff;font-size:10px;font-weight:500;border-radius:4px;padding:3px 7px;margin-left:auto;flex:none}
.chev{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-mute);font-size:11px;flex:none}

/* ---------- match table ---------- */
.tbl{position:relative}
.scroller{overflow-x:auto;scrollbar-width:thin}
.scroller::-webkit-scrollbar{height:6px}
.scroller::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:3px}
.thead{display:flex;height:26px;align-items:flex-end}
.t-left{width:var(--lcol);flex:none;position:sticky;left:0;background:var(--surface);z-index:2}
.t-cols{display:flex}
.th{width:176px;flex:none;padding:0 6px;font-size:12px;color:var(--ink-mute);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow{display:flex;padding:8px 0;position:relative}
.trow.sel{box-shadow:inset 0 0 0 1px var(--accent)}
.t-left{display:flex;align-items:stretch;padding-left:8px}
.m-time{width:64px;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
  font-size:12px;color:var(--ink-strong);line-height:1.35;text-align:center}
.m-time .clk{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.m-teams{flex:1;min-width:0;border-left:1px solid var(--line);padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:9px}
.team{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-strong)}
.team .av{width:15px;height:15px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:8px;flex:none}
.team .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .sc{font-size:12px;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.team .sc.g{background:var(--scorebox);color:#fff;border-radius:2px;padding:0 5px;font-size:11px}
.m-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-mute);padding-left:2px}
.m-foot{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink-mute);
  padding:6px 0 0;border-top:1px solid var(--line);margin-top:8px}
.star{color:var(--ink-mute);font-size:13px}
.star.on{color:var(--accent)}
/* 「全部 +N ›」与「P2P n ›」同一套胶囊样式，只有配色不同 */
.row-go{position:sticky;right:0;flex:none;align-self:center;margin-left:auto;width:24px;height:46px;
  display:grid;place-items:center;font-size:15px;color:var(--ink-mute);background:var(--surface);
  border-left:1px solid var(--line);z-index:3}
.row-go:hover{color:var(--accent);background:var(--surface-2)}
.mchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;
  border:1px solid var(--line-2);color:var(--ink);font-size:11.5px;background:var(--surface)}
.mchip b{font-weight:600;font-variant-numeric:tabular-nums}
.mchip .ar{color:var(--ink-mute);font-size:11px}
.mchip:hover{border-color:var(--accent);color:var(--accent)}
.mchip:hover .ar{color:var(--accent)}
.mchip.is-p2p{border-color:var(--accent);color:var(--accent)}
.mchip.is-p2p .ar{color:var(--accent)}
.mchip.is-p2p:hover{background:rgba(255,140,0,.08)}
.tc{width:176px;flex:none;padding:0 4px;display:flex;flex-direction:column;gap:6px}
.bet{height:30px;border-radius:3px;background:var(--surface-2);display:flex;align-items:center;gap:6px;padding:0 8px;
  font-size:12px;color:var(--ink);transition:background .12s,color .12s;width:100%}
.bet:hover{background:rgba(255,140,0,.12)}
.bet .bl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.bet .bo{font-weight:700;color:var(--odds);font-variant-numeric:tabular-nums}
.bet.on{background:var(--grad-h)}
.bet.on .bl,.bet.on .bo{color:#fff}
.bet.dead{color:var(--ink-mute);justify-content:center;cursor:default}
.bet.dead:hover{background:var(--surface-2)}
.bet.lock{justify-content:center;color:var(--ink-mute);cursor:not-allowed}
.bet.up .bo{color:#17a25a}
.bet.down .bo{color:#e5484d}
.nextbtn{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:20px;height:44px;border-radius:4px;
  background:var(--grad);color:#fff;display:grid;place-items:center;font-size:11px;z-index:3;box-shadow:-1px 0 4px rgba(0,0,0,.12)}
.loaded{text-align:center;font-size:12px;color:var(--ink-mute);padding:14px 0}

/* ---------- empty ---------- */
.empty{background:var(--surface);border-radius:8px;min-height:340px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--ink-mute);font-size:13px;box-shadow:var(--shadow)}
.empty .box{width:96px;height:78px;border-radius:10px;background:var(--surface-2);position:relative}
.empty .box::before{content:"";position:absolute;inset:14px 10px auto;height:10px;border-radius:3px;background:var(--line-2)}
.empty .box::after{content:"";position:absolute;left:10px;right:10px;bottom:14px;height:26px;border-radius:4px;background:var(--line-2)}

/* ---------- right panel ---------- */
.rp-card{background:var(--surface);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.rp-top{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line)}
.tv{border:1px solid var(--accent);color:var(--accent);border-radius:3px;font-size:10px;padding:1px 5px}
.sb-score{background:var(--grad);color:#fff;border-radius:3px;font-size:12px;font-weight:700;padding:2px 8px;letter-spacing:1px}
.rp-strip{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--ink-strong)}
.rp-strip .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--scorebox);color:#fff;border-radius:2px;padding:0 6px;font-size:11px;font-variant-numeric:tabular-nums}
.board{height:180px;background:linear-gradient(135deg,#232a1d 0%,#4a3b26 45%,#2a2118 100%);position:relative;
  display:flex;align-items:center;justify-content:center;padding:14px}
.board::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 24px)}
.board-inner{position:relative;z-index:1;width:100%;max-width:300px;background:rgba(18,18,18,.78);border-radius:6px;padding:10px 12px;color:#fff}
.board-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.board-row+.board-row{border-top:1px solid rgba(255,255,255,.08)}
.board-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-row .v{width:34px;text-align:center;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.board-head{font-size:12px;color:#ff9a3c}
.board-head .t{flex:1;color:#fff;font-weight:600}
.board-pre{position:relative;z-index:1;color:#fff;text-align:center;font-size:14px;line-height:1.9}
.rp-tabs{display:flex;gap:18px;padding:0 14px;border-bottom:1px solid var(--line)}
.rp-tabs button{height:40px;font-size:14px;color:var(--ink);position:relative}
.rp-tabs button.on{color:var(--accent);font-weight:500}
.rp-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.mkt-list{max-height:calc(100vh - var(--hd) - 400px);min-height:220px;overflow:auto;padding:0 12px 12px}
.mkt-h{display:flex;align-items:center;gap:8px;padding:12px 2px 8px;font-size:13px;color:var(--ink-strong);
  border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.mkt-h .chev{margin-left:auto}
.mkt-sub{display:flex;gap:8px;font-size:11px;color:var(--ink-mute);padding:8px 2px 0}
.mkt-sub div{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair{display:flex;gap:8px;padding:8px 0}
.pair .bet{flex:1}

/* ---------- betslip ---------- */
.slip-top{background:var(--grad-h);color:#fff;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px}
.slip-tabs{display:flex;border-bottom:1px solid var(--line)}
.slip-tabs button{flex:1;height:44px;font-size:14px;color:var(--ink);position:relative}
.slip-tabs button.on{color:var(--accent);font-weight:500}
.slip-tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:26px;height:2px;background:var(--accent)}
.slip-tabs .dot{position:absolute;top:8px;margin-left:4px;background:var(--accent);color:#fff;font-size:10px;
  border-radius:9px;min-width:16px;height:16px;display:inline-grid;place-items:center;padding:0 4px}
.slip-body{padding:10px;display:flex;flex-direction:column;gap:10px}
.slip-item{background:var(--surface-3);border-radius:6px;position:relative}
.slip-item .hd2{padding:10px 26px 8px 10px;font-size:13px;color:var(--ink-strong);line-height:1.45}
.slip-item .lgn{font-size:12px;color:var(--ink-mute);margin-top:2px}
.slip-item .x{position:absolute;top:6px;right:6px;width:18px;height:18px;background:var(--grad);color:#fff;
  border-radius:3px;display:grid;place-items:center;font-size:11px}
.slip-sel{background:var(--surface);padding:10px;border-radius:0 0 6px 6px}
.mk-line{font-size:12px;color:var(--ink-mute);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-line b{color:var(--ink-strong);font-weight:600;font-size:13px}
.od-line{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.slip-sel .od{font-size:16px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.od-line i{font-size:11px;font-style:normal;color:var(--ink-mute);font-weight:400}
.parlay-note{font-size:11px;color:var(--accent);background:rgba(255,140,0,.08);border-radius:5px;padding:7px 10px;line-height:1.5}
.stake{display:flex;border:1px solid var(--accent);border-radius:5px;overflow:hidden;margin-top:8px;height:34px}
.stake .cur{width:52px;display:grid;place-items:center;font-size:12px;color:var(--ink-mute);border-right:1px solid var(--line-2);background:var(--surface-3)}
.stake input{flex:1;min-width:0;border:0;outline:0;padding:0 10px;background:var(--surface);color:var(--ink-strong);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.quick button{height:28px;border:1px solid var(--line-2);border-radius:4px;font-size:12px;color:var(--ink);background:var(--surface)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.combo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);padding:0 2px}
.combo select{flex:1;height:30px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);padding:0 8px}
.slip-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sum{display:flex;justify-content:space-between;font-size:12px;color:var(--ink)}
.sum b{font-weight:500;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px}
.acts .del{width:64px;height:36px;border:1px solid var(--line-2);border-radius:5px;font-size:13px}
.acts .parlay{width:64px;height:36px;border:1px solid var(--line-2);border-radius:5px;font-size:13px;flex:none}
.acts .parlay.on{border-color:var(--accent);color:var(--accent);background:rgba(255,140,0,.1);font-weight:500}
.acts .parlay[disabled]{opacity:.4;cursor:not-allowed}
.acts .go{flex:1;height:36px;border-radius:5px;background:var(--grad-h);color:#fff;font-size:14px;font-weight:500}
.acts .go[disabled]{opacity:.45;cursor:not-allowed}
.autox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.autox input{accent-color:var(--accent)}

/* ---------- dropdown / modal / toast ---------- */
.pop{position:absolute;top:34px;right:0;background:var(--surface);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  min-width:250px;padding:10px 0;z-index:70;border:1px solid var(--line)}
.pop h4{margin:0;padding:6px 14px 10px;font-size:13px;color:var(--ink-strong);font-weight:500;display:flex;align-items:center;gap:6px}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.pop-row.opt{cursor:pointer}
.pop-row.opt:hover{background:rgba(255,140,0,.06)}
.sw{width:38px;height:20px;border-radius:12px;background:#d4d4d4;position:relative;transition:background .18s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--grad-h)}
.sw.on::after{left:20px}
.themeseg{display:flex;gap:4px}
.themeseg button{height:26px;padding:0 14px;border-radius:14px;font-size:12px;color:var(--ink)}
.themeseg button.on{background:var(--grad-h);color:#fff}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:10px;width:min(1080px,100%);max-height:80vh;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;font-size:15px;color:var(--ink-strong)}
.modal header .tools{margin-left:auto;display:flex;gap:8px}
.modal header .tools button{height:28px;padding:0 16px;border-radius:14px;font-size:12px;border:1px solid var(--line-2)}
.modal .find{margin:0 20px;height:38px;border:1px solid var(--line-2);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px}
.modal .find input{flex:1;border:0;outline:0;background:none;color:var(--ink)}
.lglist{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:16px 20px}
.lgitem{display:flex;align-items:center;gap:10px;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:13px;cursor:pointer}
.lgitem input{accent-color:var(--accent)}
.lgitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal footer{display:flex;justify-content:flex-end;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.modal footer button{height:36px;padding:0 34px;border-radius:5px;border:1px solid var(--line-2);font-size:14px}
.modal footer .ok{background:var(--grad-h);color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;
  padding:11px 20px;border-radius:6px;font-size:13px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- generic table pages ---------- */
.simple{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.simple .filters{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fbox{height:32px;border:1px solid var(--line-2);border-radius:5px;display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--ink);gap:8px}
.fbox.grow{flex:1;min-width:180px}
.btn-q{height:32px;padding:0 22px;border-radius:16px;border:1px solid var(--line-2);font-size:13px}
.rtab{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.rtab button{height:44px;font-size:14px;position:relative;color:var(--ink)}
.rtab button.on{color:var(--accent)}
.rtab button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
table.res{width:100%;border-collapse:collapse;font-size:12px}
table.res th{color:var(--ink-mute);font-weight:400;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
table.res td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;color:var(--ink-strong);font-variant-numeric:tabular-nums}
table.res td.l{text-align:left}
.vs{color:var(--ink-mute);margin:0 6px}

/* ---------- 历史注单 买单/卖单 分栏 ---------- */
.side-seg{display:flex;gap:8px;background:var(--surface);border-radius:8px;padding:6px;box-shadow:var(--shadow)}
.side-seg button{flex:1;max-width:220px;height:38px;border-radius:6px;font-size:14px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:6px}
.side-seg button.on{background:var(--grad-h);color:#fff;font-weight:600}
.dot2{background:#e5484d;color:#fff;font-size:10px;font-style:normal;border-radius:9px;min-width:16px;height:16px;
  display:inline-grid;place-items:center;padding:0 4px}
.side-seg button.on .dot2{background:#fff;color:var(--accent-ink)}

/* ---------- 注单表格（历史注单） ---------- */
table.res.betlist{min-width:1120px}
table.res.betlist th{background:var(--surface-3);font-size:13px;color:var(--ink-strong);padding:14px 8px}
table.res.betlist td{padding:16px 10px;vertical-align:middle}
.bt-time{font-size:13px;color:var(--ink-strong)}
.bt-no{font-size:11px;color:var(--ink-mute);margin-top:4px}
.bt-type{font-size:13px;color:var(--ink-strong)}
.bt-total{font-size:11px;color:var(--accent);margin-top:4px;font-weight:600}
.bt-rn{font-size:11px;color:#e5484d;margin-top:4px}
.bt-status{font-size:13px;font-weight:500}
.bt-live{font-style:normal;color:var(--ink-strong);margin-right:8px}
.bt-lg{color:var(--ink-strong)}
/* 结算印章 */
.stamp{width:34px;height:34px;margin:8px auto 0;border-radius:50%;border:2px solid var(--green);color:var(--green);
  display:grid;place-items:center;font-size:15px;font-weight:700;transform:rotate(-10deg);opacity:.85;
  font-family:"STKaiti","KaiTi","PingFang SC",serif}
.stamp.lose{border-color:#e5484d;color:#e5484d}
.stamp.push{border-color:#1b8cf0;color:#1b8cf0}
.stamp.inline{margin:0 0 0 auto;width:30px;height:30px;font-size:13px}
.copy{color:var(--accent);cursor:pointer;margin-left:4px}
.bt-leg+.bt-leg{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.bt-leg{width:100%;max-width:470px;display:flex;flex-direction:column;gap:5px}
.bt-l1,.bt-l2,.bt-l4{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.5;min-width:0}
.bt-sport{flex:none;color:var(--accent);font-weight:500}
.bt-lg{flex:1;min-width:0;color:var(--ink-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-live{flex:none;background:rgba(255,140,0,.12);color:var(--accent);border-radius:3px;padding:0 6px;font-size:11px;line-height:1.55}
.bt-mk{flex:none;color:var(--ink-strong)}
.bt-sel{flex:1;min-width:0;color:var(--ink-strong);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-od{flex:none;color:var(--green);font-weight:700;margin-left:auto}
.bt-ot{flex:none;width:52px;text-align:right;color:var(--ink-mute);font-size:11px}
.bt-l3{font-size:12px;line-height:1.5;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-l3 .vs{margin:0 4px}
.bt-l4{gap:6px;white-space:nowrap}
.sc-chip{flex:none;font-size:11px;border-radius:3px;padding:1px 7px;background:var(--surface-2);color:var(--ink-mute);font-variant-numeric:tabular-nums}
.sc-chip.fin{font-weight:600}
.sc-chip.fin.win{background:rgba(23,162,90,.13);color:var(--green)}
.sc-chip.fin.lose{background:rgba(229,72,77,.13);color:#e5484d}
.sc-chip.fin.void{background:var(--surface-2);color:var(--ink-mute)}
.sc-half{flex:none;font-size:11px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.bt-why{flex:1;min-width:0;font-size:11px;color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 已结算：投注详情 / 结算详情 两列 */
.bd-leg,.st-leg{display:flex;flex-direction:column;gap:5px;max-width:380px}
.bd-leg+.bd-leg,.st-leg+.st-leg{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.bd-mt{font-size:12px;line-height:1.5;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-mt .vs{color:var(--ink-mute);margin:0 4px}
.bd-pick{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.5;min-width:0}
.bd-foot{max-width:380px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-mute);line-height:1.8}
.st-sc{display:flex;gap:6px;flex-wrap:wrap}
.st-why{font-size:11px;line-height:1.55;color:var(--ink-mute)}
/* 字段名:值 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11px;line-height:1.7;align-items:baseline}
.kv-k{color:var(--ink-mute);white-space:nowrap}
.kv-v{color:var(--ink-strong);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-v{color:var(--green);font-weight:700;font-size:12px}
.ot-v{color:var(--ink-mute)}
/* 比分盒 */
.sbox{display:inline-flex;align-items:baseline;gap:5px;border-radius:4px;padding:2px 8px;background:var(--surface-2)}
.sbox i{font-style:normal;font-size:10px;color:var(--ink-mute)}
.sbox b{font-size:12px;font-weight:700;color:var(--ink-strong)}
.sbox.win{background:rgba(23,162,90,.13)}
.sbox.win b,.sbox.win i{color:var(--green)}
.sbox.lose{background:rgba(229,72,77,.13)}
.sbox.lose b,.sbox.lose i{color:#e5484d}
.sbox.void b{color:var(--ink-mute)}
.bt-ok{color:var(--green);font-size:13px}
.bt-sum{display:flex;justify-content:flex-end;gap:24px;padding:14px 18px;font-size:12px;color:var(--ink-mute)}
.bt-sum b{color:var(--ink-strong);font-weight:600;margin-left:6px}

/* ---------- 侧栏未结算注单面板 ---------- */
.up-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;
  color:var(--ink-strong);box-shadow:inset 3px 0 0 var(--accent);border-bottom:1px solid var(--line)}
.up-rf{color:var(--accent);font-size:12px;cursor:pointer}
.up-sum{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface-3);font-size:12px;color:var(--ink-mute)}
.up-sum b{display:block;color:var(--ink-strong);font-size:14px;font-weight:600;margin-top:2px}
.up-sum .r{text-align:right}
.up-card{padding:12px 14px;border-top:8px solid var(--bg)}
.up-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.up-type{font-size:14px;font-weight:600;color:var(--ink-strong);box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.up-ok{color:var(--green);font-size:12px}
.up-lg{font-size:12px;color:var(--ink-mute)}
.up-mt{font-size:13px;color:var(--ink-strong);line-height:1.5;margin-top:2px}
.up-time{font-size:12px;color:var(--ink-mute);margin-top:2px}
.up-box{background:rgba(255,140,0,.07);border-radius:5px;padding:10px;margin:10px 0}
.up-mk{font-size:12px;color:var(--ink-strong)}
.up-mk i{color:var(--accent);font-style:normal}
.up-pick{font-size:13px;color:var(--ink-strong);margin:6px 0 4px}
.up-od{font-size:15px;font-weight:700;color:var(--green)}
.up-kv{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-mute);padding:3px 0}
.up-kv b{color:var(--ink-strong);font-weight:500}
.up-end{text-align:center;font-size:12px;color:var(--ink-mute);padding:18px 0}

/* ---------- P2P 叠加 ---------- */
.g{color:var(--green)!important}
.r{color:#e5484d!important}
.p2pdot{width:6px;height:6px;border-radius:50%;background:#e5484d;display:inline-block;flex:none}
.bet{position:relative}
.bet .p2pdot{position:absolute;top:3px;right:3px}
.bet.on .p2pdot{background:#fff}
.p2pn{margin-left:8px;border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:1px 7px;font-size:10px}
.p2pn b{font-weight:700}
.ctrl.p2pbtn{gap:4px}
.ctrl.p2pbtn.on{background:var(--grad-h);color:#fff;border-color:transparent}
.ctrl.p2pbtn.on .p2pdot{background:#fff}
.newtag{background:var(--grad);color:#fff;font-size:10px;border-radius:4px;padding:2px 7px;margin-left:6px;font-weight:500}
.sb-new{background:var(--grad);color:#fff;font-size:10px;border-radius:4px;padding:1px 6px}
.chip.sm{height:24px;font-size:11px;background:transparent;border:1px solid var(--line-2)}
.chip.sm.on{background:var(--grad-h);color:#fff;border-color:transparent}

/* 统计卡 */
.kpi{display:flex;gap:8px;background:var(--surface);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.kpi-i{flex:1;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.kpi-i:last-child{border-right:0}
.kpi-i span{font-size:12px;color:var(--ink-mute)}
.kpi-i b{font-size:17px;color:var(--ink-strong);font-variant-numeric:tabular-nums}

/* 卖单薄 */
.book{margin-top:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.book-h{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11px;
  color:var(--ink-strong);background:var(--surface-3);cursor:pointer}
.book-h .ar{color:var(--accent)}
.book-h:hover{background:rgba(255,140,0,.08)}
.book-t{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.book-sc{max-height:132px;overflow-y:auto}
.book-t th{color:var(--ink-mute);font-weight:400;padding:5px 4px;text-align:right;background:var(--surface-3);line-height:1.35}
.book-t th:first-child{text-align:left}
.bk-me{font-style:normal;font-size:9px;color:#fff;background:var(--accent);border-radius:6px;padding:0 4px;margin-left:4px}
.book-t td{padding:6px 4px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.book-t td:first-child{text-align:left}
.book-t th:nth-child(1),.book-t td:nth-child(1){width:36px}
.book-t th:nth-child(2),.book-t td:nth-child(2){width:46px}
.book-t th:nth-child(4),.book-t td:nth-child(4){width:40px}
.book-t .t1{color:var(--ink-strong)}
.book-t .t2,.book-t .o{color:var(--accent)}
.book-t .g{color:var(--green)}
.book-n{padding:8px 10px;font-size:10.5px;line-height:1.6;color:var(--ink-mute);border-top:1px dashed var(--line)}

/* 卖出表单 */
.sell-entry{display:flex;align-items:center;justify-content:space-between;background:rgba(255,140,0,.08);
  border-radius:6px;padding:9px 10px;font-size:12px;color:var(--ink-strong);cursor:pointer}
.sell-entry i{color:var(--accent);font-style:normal;font-weight:700}
.sell-entry .go{color:var(--accent)}
.sf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:12px;
  color:var(--ink-mute);border-top:1px solid var(--line)}
.sf-row b{color:var(--ink-strong);font-size:13px}
.sf-in{display:flex;align-items:center;border:1px solid var(--accent);border-radius:5px;height:30px;overflow:hidden}
.sf-in input{width:96px;border:0;outline:0;padding:0 8px;background:var(--surface);color:var(--ink-strong);font-size:13px;text-align:right}
.sf-in i{font-style:normal;font-size:11px;color:var(--ink-mute);padding:0 8px;background:var(--surface-3);line-height:30px}
.sf-step{display:flex;align-items:center;gap:2px}
.sf-step button{width:26px;height:26px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink);font-size:14px}
.sf-step b{min-width:34px;text-align:center}
.sf-note{font-size:11px;color:var(--ink-mute);padding-top:8px;border-top:1px solid var(--line)}
.slip-foot .rule{color:var(--accent);cursor:pointer}

/* 我的卖单 */
.sell-wrap{display:flex;flex-direction:column;gap:8px}
.so{background:var(--surface);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.so-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-strong)}
.so-h b{font-weight:600}
.so-share{color:var(--accent);cursor:pointer;font-size:13px}
.so-st{margin-left:auto;font-size:11px;border:1px solid;border-radius:10px;padding:1px 10px}
.so-m{font-size:12px;color:var(--ink-mute);margin-top:6px}
.so-p{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--ink-strong);margin-top:6px}
.so-od{color:var(--ink-strong)}
.so-tag{background:rgba(255,140,0,.15);color:var(--accent);border-radius:3px;padding:1px 5px;font-size:11px}
.so-up{color:var(--green);font-weight:600}
.so-t{color:var(--ink-mute);font-size:11px}
.so-f{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-mute)}
.det{margin-top:8px;height:24px;padding:0 12px;border-radius:12px;border:1px solid var(--accent);
  color:var(--accent);font-size:11px;background:var(--surface)}
.det:hover{background:rgba(255,140,0,.1)}
.so-bar{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;min-width:60px}
.so-bar i{display:block;height:100%;background:var(--grad-h)}
.so-q{color:var(--ink-mute)}
.so-more{color:var(--ink);cursor:pointer}
.so-more:hover{color:var(--accent)}

/* 卖单详情 */
.sd-row{display:flex;gap:8px;align-items:stretch}
.sd-row>.sd-card{flex:1 1 0;min-width:0}
.sd-row>.sd-card:first-child{flex:1.35 1 0}
@media (max-width:1100px){.sd-row{flex-direction:column}}
.sd-card{background:var(--surface);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column}
.sd-card h4{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink-strong);
  box-shadow:inset 3px 0 0 var(--accent);padding-left:9px;display:flex;align-items:center;gap:8px}
.sd-n{font-size:11px;color:var(--ink-mute);font-weight:400}
.sd-note{margin-left:auto;font-size:11px;color:var(--ink-mute);font-weight:400}
.fl-mirror{font-size:11px;color:var(--ink-mute);font-weight:400;margin-top:2px}
.sd-hd{display:flex;align-items:center;gap:8px;font-size:13px}
.sd-hd .p2p{margin-left:0}
.sd-mt{font-size:15px;font-weight:600;color:var(--ink-strong);margin:8px 0 12px}
.sd-mt .vs{color:var(--ink-mute);font-weight:400;margin:0 6px;font-size:12px}
.sd-card .kv{font-size:12px;grid-template-columns:78px 1fr;gap:6px 12px}
.sd-kpi{display:flex;gap:8px}
.sd-kpi>div{flex:1;background:var(--surface-3);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.sd-kpi span{font-size:11px;color:var(--ink-mute)}
.sd-kpi b{font-size:16px;color:var(--ink-strong)}
.sd-bar{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11px;color:var(--ink-mute)}
.sd-bar .so-bar{height:6px}
.sd-kpi b.sm{font-size:12px;font-weight:600;line-height:1.5}
.sd-foot-note{margin-top:12px;font-size:11px;color:var(--ink-mute);line-height:1.7}
.sd-empty{font-size:12px;color:var(--ink-mute);padding:16px 0;text-align:center;background:var(--surface-3);border-radius:6px}
table.res.fills th{background:var(--surface-3);font-size:12px;color:var(--ink-mute);padding:9px 8px}
table.res.fills td{padding:11px 8px;font-size:12px}
table.res.fills .sumrow td{background:var(--surface-3);font-weight:600;color:var(--ink-strong)}
table.res.fills .dim{color:var(--ink-mute)}
.fr{font-size:11px;border-radius:10px;padding:2px 10px;border:1px solid}
.fr.win{color:var(--green);border-color:var(--green);background:rgba(23,162,90,.08)}
.fr.lose{color:#e5484d;border-color:#e5484d;background:rgba(229,72,77,.08)}
.fr.wait{color:var(--accent);border-color:var(--accent);background:rgba(255,140,0,.08)}
.sd-act{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

}
.modal footer .ok.danger{background:linear-gradient(270deg,#ff8a8a -35%,#e5484d 100%)}

.rx-a{display:flex;align-items:baseline;gap:10px;font-size:11px;color:var(--ink-mute);flex-wrap:wrap}

.rx-fee{color:var(--ink-mute)}

/* ---------- 右栏需求说明 ---------- */
.rp.mini{width:38px}

/* ---------- 视频区（体育赛事页右侧） ---------- */
.vp{width:334px;flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(var(--hd) + 8px);

.player.full{height:420px}

.player::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 26px,transparent 26px 52px)}
.player .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.7);color:#fff;font-size:16px;display:grid;place-items:center;z-index:3}

  background:linear-gradient(180deg,rgba(0,0,0,.62),transparent)}
.pv-top .t{color:#ffb066;font-variant-numeric:tabular-nums}
.pv-top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}

.pv-bot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:8px;padding:7px 9px;
  background:linear-gradient(0deg,rgba(0,0,0,.62),transparent)}
.pv-bot .bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);position:relative}

.pv-ball{position:absolute;z-index:1;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);
  left:20%;top:58%;animation:pvb 5.5s ease-in-out infinite alternate}
@keyframes pvb{0%{left:18%;top:62%}35%{left:52%;top:34%}70%{left:70%;top:66%}100%{left:82%;top:44%}}
.player.paused .pv-ball{animation-play-state:paused}

.sbd{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line)}

  background:var(--surface-3);border:1px solid var(--line)}

.vp-chips{display:flex;gap:6px;padding:9px 10px 2px;flex-wrap:wrap}
.vp-mkt{padding:0 10px 12px}
.mk{border-bottom:1px solid var(--line);padding:10px 0 8px}
.mk-h{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-strong);padding-left:7px;
  box-shadow:inset 3px 0 0 var(--accent);line-height:1.2}

/* ---------- 开盘坐庄 / 私盘 ---------- */
.om-btn{margin-top:4px;font-size:11px;color:#fff;background:var(--grad);border-radius:10px;padding:2px 10px;line-height:1.6}

/* ---------- 我的卖出 · 私盘页签与开盘详情 ---------- */
.sell-seg{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sell-seg button{height:44px;font-size:14px;position:relative;color:var(--ink);background:none;border:none}
.sell-seg button.on{color:var(--accent);font-weight:500}
.sell-seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.pk-pnl.g{color:var(--green)}.tagx{flex:none;font-size:10.5px;border:1px solid;border-radius:9px;padding:1px 8px;white-space:nowrap}

.om-banner{background:rgba(255,140,0,.1);border:1px solid rgba(255,140,0,.3);border-radius:8px;
  padding:10px 14px;font-size:12px;color:var(--ink);margin-bottom:8px}
.om-info{padding:14px}
.oi-mt{font-size:15px;color:var(--ink-strong);font-weight:600}
.oi-mt .vs{font-size:12px;color:var(--ink-mute);margin:0 8px;font-weight:400}
.oi-sub{font-size:12px;color:var(--ink-mute);margin-top:5px}
.om-sec{font-size:13px;font-weight:600;color:var(--ink-strong);margin:14px 0 8px;
  box-shadow:inset 3px 0 0 var(--accent);padding-left:9px}
.om-items{padding:2px 14px}
.oit{padding:11px 0}
.oit.sep{border-top:1px solid var(--line)}
.oit-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.oit-nm{width:190px;flex:none;font-size:13px;color:var(--ink-strong);font-weight:500}
.oit-od{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.oit-od.g{color:var(--green)}
.oit-off,.oit-amt{font-size:11.5px;color:var(--ink-mute)}
.oit-amt b{color:var(--ink-strong);font-weight:600;font-variant-numeric:tabular-nums}
.oit-low{font-style:normal;font-size:10.5px;color:#e8402a;margin-left:6px}
.oit-ops{display:flex;gap:6px;margin-left:auto}
.oit-b{font-size:12px;color:var(--ink-mute);border:1px solid transparent;border-radius:13px;
  padding:3px 11px;background:var(--surface-2)}
.oit-b:hover{background:rgba(255,140,0,.1);color:var(--accent)}
.oit-subh{display:flex;align-items:center;justify-content:space-between;margin-top:9px;
  font-size:11.5px;color:var(--ink-mute);cursor:pointer}
.oit-subh:hover{color:var(--accent)}
.oit-subh .ar{color:var(--ink-mute);font-size:11px}
.oit-subs{margin-top:6px}
.sub-i{padding:7px 0;border-top:1px dashed var(--line)}
.sub-r1{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-strong)}
.sub-m{font-size:10px;color:#fff;background:var(--accent);border-radius:3px;padding:0 5px}
.sub-r1 .num{margin-left:auto;font-variant-numeric:tabular-nums}
.sub-r1 .num+.num{margin-left:12px;color:var(--ink-mute)}
.sub-r2{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-mute);margin-top:3px}
.sub-r2 b{font-variant-numeric:tabular-nums}
.sub-r2 b.g{color:var(--green)}.sub-r2 b.r{color:#e8402a}
.om-ops{display:flex;align-items:center;gap:10px;margin-top:14px}
.om-sp{flex:1}
.om-op{height:36px;padding:0 20px;border-radius:8px;border:1px solid var(--line-2);font-size:13px;
  color:var(--ink);background:var(--surface)}
.om-op:hover{border-color:var(--accent);color:var(--accent)}
.om-op.primary{background:var(--grad-h);color:#fff;border-color:transparent;font-weight:500}
.om-op.primary:hover{filter:brightness(1.06)}
.om-op.danger{border-color:#e8402a;color:#e8402a;background:none}
.om-op.danger:hover{background:rgba(232,64,42,.08)}

/* ---------- 日期区间筛选控件 ---------- */
.fbox.dr{cursor:pointer;gap:6px}
.fbox.dr:hover{border-color:var(--accent);color:var(--accent)}
.fbox.dr.on{border-color:var(--accent);color:var(--accent);background:rgba(255,140,0,.06)}
.fbox.dr .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;
  background:var(--line-2);color:var(--surface)}
.fbox.dr .x:hover{background:var(--accent)}
.dr-body{padding:16px 18px}
.dr-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dr-row label{width:46px;font-size:13px;color:var(--ink-mute);flex:none}
.dr-row input{flex:1;height:34px;border:1px solid var(--line-2);border-radius:6px;padding:0 10px;
  font:inherit;font-size:13px;color:var(--ink);background:var(--surface)}
.dr-row input:focus{outline:0;border-color:var(--accent)}

/* ---------- 视频区：未开赛 / 赛事分析 ---------- */
.pre-stage{position:relative;height:186px;overflow:hidden;color:#fff;
  background:radial-gradient(130% 110% at 50% 120%,#2f6a2a 0%,#1d431c 52%,#0d1f0e 100%)}
.pre-stage::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 34px,transparent 34px 68px)}
.pre-stage::after{content:"";position:absolute;left:50%;top:-54px;width:150px;height:150px;margin-left:-75px;
  border:2px solid rgba(255,255,255,.18);border-radius:50%}
.pre-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:calc(100% - 36px);background:rgba(10,14,11,.72);border-radius:7px;padding:15px 12px;
  display:flex;align-items:center;gap:10px;text-align:center}
.pre-box .cr{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26)}
.pre-box .mid{flex:1;min-width:0;line-height:1.9}
.pre-box .t1{font-size:12.5px;font-weight:600}
.pre-box .t2{font-size:11.5px;color:rgba(255,255,255,.72)}

.an-chips{display:flex;gap:7px;padding:10px 12px 4px}
.an-empty{padding:40px 12px 46px;text-align:center}
.an-ill{width:120px;height:78px;margin:0 auto 14px;position:relative;opacity:.9}
.an-ill i{position:absolute;bottom:14px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#dfe6ef,#c3cdda)}
.an-ill i:nth-child(1){left:14px;width:20px;height:30px}
.an-ill i:nth-child(2){left:40px;width:22px;height:48px}
.an-ill i:nth-child(3){left:68px;width:18px;height:22px}
.an-ill i:nth-child(4){left:90px;width:16px;height:38px}
.an-ill b{position:absolute;left:8px;right:8px;bottom:6px;height:8px;border-radius:50%;
  background:radial-gradient(60% 100% at 50% 50%,rgba(140,155,175,.35),transparent 70%)}
:root[data-theme="dark"] .an-ill i{background:linear-gradient(180deg,#3a4452,#2a323d)}
.an-empty .tx{font-size:12.5px;color:var(--ink-mute)}

.vmk{border-bottom:1px solid var(--line)}
.vmk-h{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 9px;box-shadow:inset 3px 0 0 var(--accent)}
.vmk-h .nm{font-size:12.5px;color:var(--ink-strong);font-weight:500}
.vmk-h .sp{flex:1}
.vmk-h .ic{width:20px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--ink-mute);font-size:11px}
.vmk-h .ic:hover{background:var(--surface-2);color:var(--accent)}
.vmk-h .ic.on{color:var(--accent)}
.vmk-b{padding:4px 10px 9px}
.vmk-row{display:flex;gap:7px;padding:3px 0}
.vmk-row .bet{flex:1}

/* ---------- 盘口详情页 ---------- */
.hero{position:relative;height:186px;overflow:hidden;background:
  radial-gradient(130% 100% at 50% 115%,#2b5f27 0%,#1d431c 55%,#0f2510 100%)}
.hero::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 46px,transparent 46px 92px)}
.hero-goal{position:absolute;top:26px;width:132px;height:112px;border:3px solid rgba(255,255,255,.72);border-bottom:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px 11px),
             repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 1px,transparent 1px 11px)}
.hero-goal.l{left:26px;border-right:none;border-radius:4px 0 0 0}
.hero-goal.r{right:26px;border-left:none;border-radius:0 4px 0 0}
.hero-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:min(620px,calc(100% - 64px));background:rgba(12,16,14,.72);border-radius:8px;padding:16px 22px;
  display:flex;align-items:center;gap:18px;color:#fff;backdrop-filter:blur(2px)}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero-crest{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
.hero-t .nm{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-mid{width:150px;text-align:center;line-height:1.7;flex:none}
.hero-mid .d{font-size:14px;font-weight:600}
.hero-mid .z{font-size:11px;color:rgba(255,255,255,.65)}
.hero-mid .sc{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px}
.hero-mid .sc i{font-size:12px;color:rgba(255,255,255,.6);margin:0 8px;font-style:normal;font-weight:400}
.hero-mid .ph{font-size:11px;color:#ffb066}
.hero-hide{position:absolute;right:12px;top:12px;z-index:3;font-size:11px;color:#fff;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:3px 9px}
.hero-hide:hover{background:rgba(0,0,0,.62)}
.hero-show{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;font-size:12px;
  color:var(--ink-mute);border-bottom:1px solid var(--line);cursor:pointer}
.hero-show:hover{color:var(--accent)}

.mtabs{display:flex;align-items:center;gap:2px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);overflow:hidden}
.mtabs .sc{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.mtabs .sc::-webkit-scrollbar{display:none}
.mtabs button.mt{height:42px;padding:0 11px;font-size:13.5px;color:var(--ink);white-space:nowrap;position:relative}
.mtabs button.mt.on{color:var(--accent);font-weight:600}
.mtabs button.mt.on::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;background:var(--accent)}
.mtabs .srt{flex:none;width:30px;height:30px;border-radius:6px;color:var(--ink-mute);font-size:14px}
.mtabs .srt:hover{background:var(--surface-2);color:var(--accent)}
.mtabs .srt.on{color:var(--accent)}

.mk2{border-bottom:1px solid var(--line)}
.mk2-h{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 9px;background:var(--surface-2);
  box-shadow:inset 3px 0 0 var(--accent)}
.mk2-h .nm{font-size:13px;color:var(--ink-strong);font-weight:500}
.mk2-pre{font-size:11px;color:var(--ink-mute);background:var(--surface-3);border-radius:3px;padding:1px 6px}
.mk2-h .sp{flex:1}
.mk2-p2p{font-size:10px;font-weight:700;color:#fff;background:var(--grad);border-radius:3px;padding:1px 6px}
.mk2-ic{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--ink-mute);font-size:12px}
.mk2-ic:hover{background:var(--surface);color:var(--accent)}
.mk2-ic.on{color:var(--accent)}
.mk2-b{padding:2px 12px 10px}
.mk2-sub{display:flex;gap:8px;padding:8px 2px 2px;font-size:11.5px;color:var(--ink-mute)}
.mk2-sub div{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk2-row{display:flex;gap:8px;padding:4px 0}
.mk2-row .bet{flex:1}
.mk2-empty{padding:26px 0;text-align:center;font-size:12.5px;color:var(--ink-mute)}

/* ---------- 新手引导（按 H5 引导页还原） ---------- */
#guide{position:fixed;inset:0;z-index:200;display:none}
#guide.show{display:block}
#g-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.74);border:2px solid #FF8C00;transition:all .25s ease;pointer-events:none}
#g-ring{position:fixed;border:2px dashed rgba(255,255,255,.55);border-radius:14px;pointer-events:none;transition:all .25s ease}
#g-arrow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.g-tip{position:fixed;border:1px dashed rgba(255,255,255,.9);border-radius:8px;padding:11px 13px;color:#fff;
  font-size:13px;line-height:1.6;width:300px}
.g-tip .g-t{font-weight:700;margin-bottom:4px;display:flex;align-items:center}
.g-tip .g-d{color:rgba(255,255,255,.9)}
.g-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#FF8C00;color:#fff;font-size:11px;
  font-weight:700;align-items:center;justify-content:center;margin-right:6px;flex:none}
.g-bar{position:fixed;left:0;right:0;bottom:0;padding:30px 28px 20px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55) 40%)}
.g-bar .grow{flex:1}
.g-step{color:rgba(255,255,255,.75);font-size:12px;font-variant-numeric:tabular-nums}
.g-skip{color:rgba(255,255,255,.75);font-size:13px;cursor:pointer;padding:6px 8px}
.g-skip:hover{color:#fff}
.g-next{background:#fff;color:#222;font-size:14px;font-weight:600;border-radius:20px;padding:9px 24px;cursor:pointer}
.g-next:hover{background:#f2f2f2}

@media (max-width:1680px){ .rp{width:320px} }
@media (max-width:1500px){ .vp{width:300px} }
@media (max-width:1360px){ .vp{display:none} }
/* 窄屏：需求说明不整条消失，收成右侧竖排标签，点开浮在内容上 */
@media (max-width:1180px){
  .rp{position:fixed;right:0;top:calc(var(--hd) + 8px);z-index:40}
  .rp:not(.mini){width:340px;padding:0 0 10px;background:var(--surface);
    box-shadow:-4px 0 18px rgba(0,0,0,.14);border-radius:8px 0 0 8px;
    max-height:calc(100vh - var(--hd) - 16px);overflow:auto}
}
@media (max-width:900px){
  .side{display:none}
  .nav{margin-left:8px}
  :root{--lcol:220px}
  .shell{padding-inline:0}
  .main{padding-inline:8px}
}
@media (max-width:520px){
  :root{--lcol:170px}
  .th,.tc{width:140px}
  .hd{gap:8px;padding-inline:10px}
  .hd-right .ctrl.lang{display:none}
}

/* 串关类型由所选「场次数」K 推导，不写死清单：
   m串N —— 从 K 场里任取 m 场组成一注，共 N = C(K,m) 注；
   混合过关 —— K 场的全部 2 场及以上组合，共 2^K − K − 1 注。 */
const nCr=(n,r)=>{let v=1;for(let i=1;i<=r;i++)v=v*(n-i+1)/i;return Math.round(v)};
function comboTypes(k){
  if(k<2)return[];
  const out=[];
  for(let m=2;m<=k;m++)out.push({v:`${m}串${nCr(k,m)}`,m,bets:nCr(k,m),mix:false});
  if(k>=3)out.push({v:`${k}串${Math.pow(2,k)-k-1}`,m:k,bets:Math.pow(2,k)-k-1,mix:true});
  return out;
}
/* 枚举 m 元组合 */
function subsetsOf(arr,m){
  const out=[];
  (function rec(start,cur){
    if(cur.length===m){out.push(cur.slice());return}
    for(let i=start;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}
  })(0,[]);
  return out;
}

/* ===== 来自 H5「P2P 开盘坐庄」原型的数据与规则 ===== */
/* 卖单按卖出时间归集；原始数据的 time 形如 "09-18 02:00"，统一补成 2026 年 */
const sellDate=o=>"2026-"+String(o.time||"").slice(0,5).replace(" ","");
/* 与 H5 一致：预置时间项按 bucket 归集，自定义区间按日期过滤 */
const BUCKET={"今天":"today","昨天":"yesterday","近7天":"7d","近30天":"30d"};
const BUCKET_IN={today:["today"],yesterday:["today","yesterday"],
  "7d":["today","yesterday","7d"],"30d":["today","yesterday","7d","30d"]};
function inBucket(bk,sel){
  if(S.dr.sell)return null;                 /* 有自定义区间时交给日期过滤 */
  const b=BUCKET[sel];if(!b)return true;
  return (BUCKET_IN[b]||[]).includes(bk||"today");
}
/* 状态 + 时间两层筛选后的列表，统计卡与表尾合计都用它 */
function sellList(){
  return legacySells
    .filter(o=>S.sellStatus==="全部"||o.state===S.sellStatus)
    .filter(o=>{const b=inBucket(o.bucket,S.sellTime);return b===null?inActive(sellDate(o),"sell",S.sellTime):b});
}
function sellStats(){
  const list=sellList();
  const settled=list.filter(o=>o.state==="已结算");
  return{total:list.length,
    running:list.filter(o=>o.state==="卖出中").length,
    used:list.reduce((a,o)=>a+o.sold,0),
    pnl:settled.reduce((a,o)=>a+(o.net||0),0)};
}

   "串关类型按当前已选的「场次数 K」实时生成，不提供与所选赛事不匹配的组合。",
   "规则一（固定过关）：m串N —— 从 K 场里任取 m 场组成一注，共 N = C(K,m) 注，m 取 2 到 K。",
   "规则二（混合过关）：K串N —— K 场里 2 场及以上的全部组合各一注，共 N = 2^K − K − 1 注，K ≥ 3 时才有。",
   "由此 2 场只有 2串1；3 场是 2串3 / 3串1 / 3串4；4 场是 2串6 / 3串4 / 4串1 / 4串11；5 场是 2串10 / 3串10 / 4串5 / 5串1 / 5串26；6 场是 2串15 / 3串20 / 4串15 / 5串6 / 6串1 / 6串57。",
   "下拉框下方给一行说明：已选 K 场 · 共 N 注，并注明这 N 注是怎么组出来的。",
   "增减投注项导致 K 变化时，若当前类型在新的 K 下不成立，自动回落到第一个合法类型，不会停留在非法组合上。",
   "同一场比赛的多个投注项互斥，不能进同一张串关单 —— 它们是相关盘口，同时成立的概率不独立。此时串关按钮置灰，面板提示「同一场比赛的多个投注项不能串关，请每场只保留一个投注项」。",
   "金额口径：输入框填的是每注金额，总投注额 = 每注金额 × 注数，底部「总投注额」旁标注「每注 × N」。最高可赢 = 各注全中时的回报之和 − 总投注额，多注类型逐注按其自身的赔率连乘计算。",
   "注单生成：固定过关里只有一注的类型（m串1）记录总赔率；多注类型不记总赔率，列表里改显示「共 N 注」。"]},

  {t:"买入页展开卖单薄",tag:"新增",d:[
   "买入 · 单关下，投注项赔率区间的下方展示卖单薄表格。",
   "四列：档位 / 卖出赔率 / 可购额度 / 购买计划。会员卖单按赔率由优到劣排列，显示为卖一、卖二…；官方档位固定排在最后一行，可购额度显示为「无限」。",
   "「购买计划」列是系统按用户填入的投注额自动分配到各档的金额，用户填多少，就从最优档位往下逐档吃满，剩余部分落到官方档位。",
   "吃单规则：开启「自动接受任何赔率」后，按簿序自最优赔率档位向下依次吃单，多档成交时以加权平均赔率作为该注单的显示赔率与结算赔率。",
   "可购额度实时变化，若用户填写金额时某档被他人吃掉，按最新簿重新分配并提示赔率变化。",
   "表格不额外加说明性文案（如「官方赔率@x.xx」「已开启自动接受任何赔率」），表格本身已表达这些信息，说明文字放帮助入口。"]},
  {t:"卖单薄可展开收起",tag:"新增",d:[
   "卖单薄带标题栏「卖单薄　收起 ︿ / 展开 ﹀」，点击折叠或展开表格。",
   "默认展开时机：买入 · 单关下，每次新选中一个投注项时默认展开；从串关切回单关时也重新展开。",
   "用户手动收起的状态只在这一注的查看过程中保持，下一次选中投注项不继承。",
   "四列表头在 240px 侧栏里固定列宽，并在两字处换行（卖出/赔率、可购/额度、购买/计划），避免在不该断的地方断行。"]},
  {t:"选项与赔率的两行排版",tag:"调整",d:[
   "购物车内每个投注项占两行。",
   "第一行：[市场类型] 玩法 + 投注项，过长时省略号截断，hover 显示全文。",
   "第二行：赔率与盘口类型单独一行。240px 的侧栏放不下一行，挤在一起会把赔率这个最需要一眼看到的数字压小。",
   "有 P2P 卖单时第一行不变，第二行显示区间 @0.75~0.80，其下接卖单薄。"]},
  {t:"串关不吃 P2P 卖单",tag:"新增",d:[
   "规则：会员卖单是单场逐笔撮合的，庄家按单场风险定价并冻结押金；串关是一张注单跨多场联合结算，无法拆到各场去吃卖单额度。因此串关一律不消耗 P2P 额度。",
   "切到串关后，所选投注项全部回落到官方赔率 —— 界面赔率由区间变为单一官方值，卖单薄隐藏，注单按官方赔率记录、计算与结算。",
   "串关面板顶部给一行提示「串关不吃 P2P 卖单，已按官方赔率计算」，说明赔率为什么变了。",
   "切回单关时恢复 P2P 区间与卖单薄。"]},
  {t:"卖出（开盘坐庄）表单",tag:"新增",d:[
   "购物车「卖出」页签下是开盘坐庄表单。",
   "字段：押金金额（限额 10~5000，受账户余额约束）、上浮点位（−/＋ 步进）、卖出赔率 @x.xx(港盘)、预计可卖额度。",
   "卖出赔率 = 官方赔率按上浮点位上调后的值，上浮越多对买家越有吸引力，庄家单笔风险也越大。",
   "预计可卖额度 = 押金 ÷ 卖出赔率(港盘)，押金或上浮点位变化时实时重算。",
   "底部：卖出结算规则 ⓘ、合计 x.xx CNY、返回 / 确认卖出。确认后冻结押金，生成一张状态为「卖出中」的卖单。"]},
  {t:"卖出结算规则弹窗",tag:"新增",d:[
   "卖出面板底部「卖出结算规则 ⓘ」点开为 900px 宽的弹窗，分四段。",
   "1 基本原理：买家赢 ↔ 庄家输、买家输 ↔ 庄家赢，两组镜像卡片左右并排，下方给公式「庄单净盈亏 ＝ 子单结算之和 × (−1)」。",
   "2 押金模式：卖出 → 赛事中 → 结算 三步横向流程；结算下分庄家赢与庄家输两种押金走向 —— 庄家赢则解冻押金并收取买家本金，庄家输则按子单赔付后退回剩余押金。",
   "3 抽水规则：庄家赢与买家赢各自的抽水公式并排；庄家输、买家输均不抽水。",
   "4 特殊结算场景：走盘 / 赛事中断 / 赛事取消 / 腰斩 / 退款单 五行表格，处理方式与资金流向分列，资金流向用彩色标签标出「子单 → 全额退款」「押金 → 全额解冻」这类去向。",
   "PC 宽度够，镜像关系与三步流程横向并排，前三段一屏可看完。"]},
  {t:"金额输入方式",tag:"保留",d:[
   "PC 使用系统输入框 + 快捷金额按钮 + MAX，不做自绘数字键盘。",
   "MAX 取账户可用余额与该投注项可购额度的较小值。"]}

 sell:[
  {t:"「我的卖单」页面",tag:"新增",d:[

   "左栏「我的卖单」入口带数字角标，数字为进行中（卖出中）的卖单笔数。"]},
  {t:"卖单列表用表格，与买单同构",tag:"调整",d:[
   "卖单列表采用与买单一致的表头 + 数据区表格。",

   "盘口列：卖出赔率 @1.05 (香港盘) / 上浮点位 / 开赛时间。",

   "卖单不做分享功能：分享盘口是移动端的社交分发场景，PC 不做。"]},
  {t:"卖单状态收敛为四种",tag:"调整",d:[
   "卖单状态为 卖出中 / 已售罄 / 已关闭 / 已结算 四种，不设「部分成交」；成交进度由成交进度列的进度条与「5/101」表达。",
   "状态流转：卖出中 →（额度售完）已售罄 →（赛事结算）已结算；卖出中 / 已售罄 →（庄家停止收单或赛事封盘）已关闭 →（赛事结算）已结算。"]},
  {t:"卖单详情页",tag:"新增",d:[
   "入口：列表点「查看详情 ›」。",
   "顶部「卖单详情 + 状态 + 返回」这一条吸顶固定在页面头之下，长页滚动时返回按钮与当前状态始终可见。",
   "首行左右并排放 盘口信息 与 单据信息 —— 两块内容都窄，各占满一行会留大片空白；下面再依次是 额度与资金 / 结算信息或关闭信息 / 成交明细。窄屏时首行自动堆叠成上下两块。",
   "盘口信息：[运动] 联赛 + P2P、对阵、开赛时间、玩法与选项、卖出赔率(香港盘)、上浮点位。",
   "单据信息：卖单号（可复制）与卖出时间。",
   "额度与资金：押金金额 / 可卖额度 / 已售出 / 剩余额度 四块数字，下面一条成交进度条与 已售/总额度 百分比。",
   "结算信息（已结算）：标题行右侧盖输赢印章（赢绿 / 输红，与注单列表同一枚），下面四个并排数据块 结算时间 · 盈亏 · 平台抽佣 · 实际入账，与「额度与资金」同一套块状排布。",
   "结算信息里不放结算比分与判定依据 —— 庄单的输赢由成交明细逐笔子单和上方的盈亏数字说明，比分属于赛事侧信息，放在买单的已结算列表里即可。",
   "关闭信息（已关闭）同样用四个并排数据块：关闭时间 · 关闭方式（庄家主动停止收单 / 赛事临近自动封盘）· 退回押金 · 已售出部分，下方一行小字说明未售出原路退回、已售出照常结算。",
   "成交明细按子单展开：子单号 / 成交时间 / 买家（脱敏）/ 成交额度 / 成交赔率，进行中的再加一列「待结算」；未成交时显示「暂无成交，额度仍在挂出中」。",
   "已结算的卖单，成交明细多两列「子单结果」与「子单盈亏」。这两列是买方视角：子单只写 赢 / 输，盈亏与本庄单方向相反 —— 子单输，庄家才赢。"]},
  {t:"补充押金与停止收单",tag:"新增",d:[
   "进行中的卖单（卖出中 / 已售罄）在详情页有这两个操作，已关闭与已结算的没有。",
   "补充押金：弹窗先列当前押金 / 当前可卖额度 / 剩余未售，输入补充金额（限额 10~5000，受账户余额约束），实时算出补充后的可卖额度；确认后押金与额度同步增加，公式仍是 可卖额度 = 押金 ÷ 卖出赔率(港盘)。已售罄的单补充押金后回到卖出中。",
   "补充押金是加仓、可继续操作，不需要二次确认。",
   "停止收单：不再接受新的买入，未售出部分押金原路退回，已售出部分仍按正常结算，单据转为已关闭并记录关闭方式为「庄家主动停止收单」。",
   "停止收单是不可逆的资金操作，必须走二次确认弹窗：弹窗里先把「未售出押金（原路退回）」与「已售出额度（照常结算）」两个金额摆出来，再说明后果，确认按钮用红色。"]},
  {t:"押金与盈亏规则",tag:"新增",d:[
   "已关闭庄单：未售出部分的押金原路退回，该部分不计算盈亏；已售出部分仍按正常结算计入盈亏。",
   "完全未售出即关闭的庄单，押金全额退回，盈亏为 0，计入卖单笔数但不影响盈亏。",
   "赛事结算后，庄单状态由「已关闭」转为「已结算」。",

   "投注详情列只有投注时间与注单号（带复制），不放结算时间。",
   "页面不放统计卡：未结算与已结算两页都是 页签 → 筛选条 → 表格 → 右下角「总单数 / 总投注额」。"]},
  {t:"两个页签统一为「投注详情 + 选项」双栏",tag:"调整",d:[
   "未结算与已结算共用一套列结构，前五列完全一致，只有第六、七列随页签换名（最高可赢 / 返还金额，投注状态 / 结算状态）。",
   "投注详情（下注侧）：[运动] 联赛 / 主队 vs 客队 / 玩法 + 投注项；分隔线以下用「字段名 : 值」列出投注时间与注单号（带复制）。字段名显式写出来，不靠位置猜。",
   "选项（结果侧）—— 未结算：下注时比分（仅滚球单）+ 投注赔率与盘口，footer 写结算说明；已结算：上半场比分 + 全场比分两枚比分盒 + 判定依据 + 结算赔率与盘口，footer 写结算时间。",
   "比分盒统一为「小字段名 + 比分」的形式（上半场 1-0 / 全场 2-1），全场那枚按整单结果着色：赢绿 / 输红 / 取消灰，与右侧印章呼应；取消的注单全场显示「—」。",
   "结算赔率单独列出而不是沿用下注赔率 —— 开启「自动接受任何赔率」时两者可能不同，结算以这个值为准。",
   "串关的多条 leg 在两栏里一一对应、虚线分隔；投注时间、注单号、结算时间按整单只出现一次。"]},
  {t:"串关在已结算列表里的形态",tag:"新增",d:[
   "投注类型列显示串关类型（如 3串1）并在下方加「总赔率 @39.67」；选项列各条 leg 用虚线分隔逐条展开。",
   "印章按整单结果盖一次，盖在「3串1 / 总赔率」下方，与单关位置一致；每条 leg 不单独标记结果。",
   "单条 leg 走水或取消时，只体现在整单的返还金额上，列表页不逐条展示；需要看逐条结果走注单详情页。"]},
  {t:"列表用表格不用卡片",tag:"保留",d:[
   "PC 宽度足够，两类单据都用表头 + 数据区的表格，不用卡片流，避免每张卡重复展示玩法、对阵、金额、注单号。"]},
  {t:"时间筛选项两侧统一",tag:"调整",d:[
   "买单页与卖单页的时间筛选统一为 全部 / 今天 / 昨天 / 近7天 / 近30天，五项的措辞与顺序一致。",
   "口径：今天 = 当天 00:00 起；昨天 = 昨日全天；近7天 / 近30天 = 含今天在内往前推 N 个自然日。买单按投注时间归集，卖单按卖出时间归集，汇总报表按结算时间归集。"]},
  {t:"自定义时间段筛选",tag:"新增",d:[
   "买单 / 卖单 / 汇总报表三处共用同一个日期区间控件，可点预置项，也可自定义起止日期。",
   "控件形态：筛选条右侧一个「📅 选择时间段 ▼」按钮，点击弹出区间弹窗；已选区间后按钮直接显示「2026/09/10 至 2026/09/16」并带一个 ✕，点 ✕ 就地清除。",
   "弹窗内容只有开始、结束两个日期输入，加底部的清除与确定两个按钮；校验规则不写在弹窗里，违规时 toast 提示。",
   "校验（不通过时 toast 拦截，不关闭弹窗）：开始与结束都必须填；开始不得晚于结束；结束不得晚于今天；跨度不得超过 1 年。",
   "互斥关系：选中自定义区间后，预置时间项全部取消高亮，筛选以自定义区间为准；反过来点任一预置项，自定义区间自动清空。",
   "三处的过滤都真实作用于数据：买单过滤注单列表，卖单过滤卖单列表且统计卡四项与表尾「总单数 / 总押金」跟随筛选结果重算，汇总报表过滤按日表格、总盈亏与买卖单分项。",
   "汇总报表顶部「待结算注单 / 进行中庄单」那行是当前时点快照，不随时间筛选变化，这一点保持不变。"]},
 ],
 detail:[
  {t:"盘口详情页整体结构",tag:"调整",d:[
   "入口：赛事行最右侧的 › 箭头，或卡片底部的「全部 +N ›」「P2P n ›」，三者进同一页。",
   "自上而下：顶部条（返回 ↩ / 联赛名 ⌄ / 刷新 ⟳ / 赛事分析 📊）→ 赛事横幅 → 玩法分类页签 → 盘口块列表。右侧视频区与需求说明栏照常常驻。",
   "赛事横幅：球场背景 + 居中的半透明信息面板 —— 左右两侧是球队队徽与队名，中间未开赛时显示 开赛日期 / 时间 /（GMT+8），滚球中改显示实时比分与当前半场走时。",
   "横幅右上角有「隐藏」按钮，点击折叠横幅，原位留一条「展开赛事信息 ﹀」的细条可再次展开。默认展开，进入新的赛事时重置为展开。",
   "玩法分类页签横向排布，超出宽度时横向滚动不换行，右端固定一个排序按钮 ⇅ —— 点亮后把有会员卖单的盘口排到前面，再点恢复默认顺序。置顶的盘口始终排在最前，不受排序影响。"]},
  {t:"盘口块的块头与操作",tag:"调整",d:[
   "块头结构：左侧橙色竖条 + 半场类盘口的前缀标签（如「上半场」）+ 盘口名称；右侧依次是 P2P 橙标、置顶 📌、收起 ︿。",
   "P2P 橙标：该盘口下存在会员卖单时显示，点进具体投注项后在购物车里展开卖单薄。",
   "置顶：把该盘口固定到列表最前，可多个，再点取消；收起：只折叠该块的盘口内容，块头保留。",
   "两个状态都只在当前赛事的浏览过程中保持，切换赛事后复位。"]},
  {t:"盘口块的内容排版",tag:"调整",d:[
   "块头下先是一行列名：大 / 小、主 / 和 / 客，或让球类的主客队名，列名与下方的投注格逐列对齐。",
   "每一条盘线占一行，同一行内左右（或三列）并排该盘线的各个选项。",
   "投注格统一为「选项 + 盘线在左，赔率加粗在右」，与列表页、购物车、卖单薄保持同一种读法：先看买什么，再看赔率。",
   "有会员卖单的投注格右上角打红点，与列表页同一套标识。",
   "波胆这类多选项盘口按三列网格铺开，行内不做盘线列。",
   "某分类下没有盘口时显示空态「该分类下暂无盘口」。"]},
  {t:"盘口分类固定六项",tag:"调整",d:[
   "玩法分类固定为 全部 / 让球 / 大小 / 进球 / 半场 / 特殊 六项，与 H5 保持一致，不按运动动态出。",
   "修掉线上未翻译的 i18n key（{单节} / {特殊}）。",
   "切换后仅展示对应分组；某分类下该场没有盘口时该页签不展示，避免空页签。",
   "进入新的赛事详情页时分类复位到「全部」，不沿用上一场的选中项。"]},
  {t:"让球类盘口的双列队名表头",tag:"保留",d:[
   "让球、让分类盘口上方用两列分别标主客队名，PC 现有处理不变。"]}
 ],
 om:[
  {t:"私盘模式",pg:"live",tag:"新增",d:[
   "庄家选一场比赛开盘，即复制该比赛生成一个私盘（名称 = 原比赛名 + 庄家昵称），私盘紧随原比赛下方展示，仅展示庄家开放的盘口。",
   "庄家获得完整控盘能力：动态增减盘口、调水、单项封盘与恢复、补充额度、整盘停止收单。",
   "买家有两条路径：在原比赛卖单簿依序吃单，或在私盘赔率格直购该庄家档位。",
   "赛事、投注项、赛果全部来自 IM，回避结果判定问题；原比赛的官方盘口与官方投注不受影响。",
   "球类范围：P2P 投注项卖出与开盘坐庄本期仅对足球开放，其他球类不展示 P2P 标识、不出开盘入口、购物车也不出卖出表单。",
   "同一会员互斥：同一个人对同一场比赛，开盘坐庄与投注项卖出二选一 —— 本人在该场有进行中的投注项卖出时不出开盘入口，本人在该场有进行中的私盘时购物车不出卖出表单。目的是防止一个人把敞口拆到两套机制上绕过「同一比赛限 1 个进行中的盘」，并压住对敲的操作面。",
   "不同会员互不影响：A 在某场开盘坐庄，不妨碍 B 在同一场挂投注项卖出，两套机制在同一场比赛上并存，各自独立成交与结算。",
   "滚球不可开盘：已开赛的赛事不出开盘入口，理由是赛果已在变动，与互斥规则无关。",
   "提交二次校验：确认开盘时只再查一次「本人在弹窗打开期间是否挂出了该场的投注项卖出」，命中则关闭弹窗并拦截。",
   "庄家开放的盘口若不在列表展示的几列里（波胆、角球、半场等），私盘行下方出「全部 N ›」入口，点击进入该庄家的私盘盘口详情，可对其余盘口下注；全部盘口都能在列表列位展示时不出该入口。"]},
  {t:"开盘入口与门槛",pg:"live",tag:"新增",d:[
   "入口：首页 P2P 已生效联赛下，每场比赛行的时间 / 场次信息旁展示「开盘」按钮，按钮所在行正下方是队伍名称区，不与赔率列重叠。",
   "开盘范围 = IM 在售且未开赛的赛事，含今日盘与早盘；已开赛（滚球）不展示开盘入口，切换到滚球页签时该页全部赛事均无开盘入口。判断依据是赛事是否已开赛，与今日 / 早盘的展示分类无关。",
   "确认开盘时逐条校验，任一不满足即拦截、整体不提交：开放盘口数 ≥ 3；盘押金 ≥ 1,000（整盘一笔，全部盘口共享）；开赛前 10 分钟内禁止新开盘。三项均为可配置参数。",
   "前置与临界：IM 交集内可开盘口不足 min_items 时不展示开盘入口；账户余额需 ≥ 盘押金，等于时允许；封盘前置时间以服务端收到开盘请求的时间为准，不以客户端点击时间为准。",
   "赛事所属联赛需在「可坐庄联赛白名单」内，不在白名单的不展示开盘入口；庄家的坐庄权限被运营关闭时同样不展示，已有存量盘不受影响。",
   "同一庄家对同一比赛仅允许 1 个进行中的盘，重复开盘拦截并提示去开盘详情管理；不同庄家互不影响，可各自对同一场比赛开盘。",
   "整场互斥：该场官方盘已有任何会员的投注项卖出挂单时，对所有会员隐藏开盘入口 —— 一场比赛要么走投注项卖出，要么走开盘坐庄，不并存；反之该场已有私盘时，该场不再接受新的投注项卖出。",
   "同一会员对同一场比赛，开盘坐庄与投注项卖出二选一：已有进行中的盘时，该场全部投注项的「卖出」入口置灰并提示「该场已开盘，不可再单独卖出」；已有该场进行中的投注项卖出时，该场「开盘」入口置灰并提示「该场已有投注项卖出，不可再开盘」。",
   "两者的「进行中」判定一致：卖出中、已封盘计入；已售罄 / 已关闭 / 已结算不计入。",
   "提交时二次校验：开盘弹窗打开后至点击「确认开盘」期间，若该场出现了投注项卖出挂单，提交时拦截并提示「该场已有投注项卖出，不可再开盘」，弹窗关闭。",
   "「进行中」的判定：卖出中、已封盘计入；已售罄、已关闭、已结算不计入，庄家可对同一比赛再开新盘 —— 售罄盘已从列表消失，不会在列表里重复出现。"]},
  {t:"开盘设置弹窗",pg:"live",tag:"新增",d:[
   "投注项列表与 IM 实时取交集：IM 无数据的玩法展示「IM 无数据，不可开」，锁盘玩法展示「IM 锁盘中，不可开」，两者均置灰不可勾选。",
   "勾选某投注项后卡片内联展开该项设置：上浮点位居左，用紧凑的上下步进控件（▲/▼，步进 0.01，可为负，也可直接输入）；庄单赔率靠右只读展示 = 开盘时官方港盘赔率 + 上浮点位。",
   "允许定价低于官方，低于时行内红字提示「低于官方」但不拦截。投注项不再单独配置押金。",
   "押金为盘级：开盘时一次性输入一笔盘押金，快捷金额 +1000 / +2000 / +5000 / MAX（MAX 填入风控上限），全部开放盘口共享这一个押金池。",
   "顶部是自动封盘与庄家昵称：自动封盘设置「开赛前 N 分钟」，到点整盘自动封盘；庄家昵称最长 12 字符，默认取上次设置值，用于拼接私盘名称。",
   "自动封盘触发后该设置即失效，庄家恢复开盘后不会被再次自动封盘；如需重新生效，要在开盘详情中重设。",
   "押金输入区下方常驻一行灰字「押金自开盘起冻结，至赛事结算后解冻退回」，早盘赛事额外追加预计冻结时长。",
   "底部实时汇总已选项数、盘押金与预计可卖额度，并行内标注公式「= 押金 ÷ 最高卖出赔率」。",
   "弹窗内不陈述规则文案：独占、门槛、押金冻结、额度公式等细则只在文档约定，由确认开盘时的校验拦截与 toast 传达。",
   "庄单赔率确认后固定，不随官方赔率联动，仅可通过调水修改。"]},
  {t:"私盘规则",pg:"live",tag:"新增",d:[
   "开盘 = 复制该比赛生成私盘。私盘名称 = 原比赛名 + 庄家昵称，展示位置紧随原比赛下方，右侧展示「私盘」标识，样式与 P2P 标识一致并替代其位置。",
   "私盘仅展示庄家开放的盘口：开放盘口的赔率格展示庄单赔率（独赢展示欧洲盘 = 港盘 + 1，让球 / 大小展示港盘），未开放的盘口展示 -- 置灰，单项封盘的展示锁定态。",
   "可见性：盘处于卖出中时展示；整盘售罄、已关闭（停止收单 / 强制下架 / IM 全部关盘）、已结算后，私盘从比赛列表消失。",
   "多位庄家可各自对同一场比赛开盘，各自生成独立私盘，按开盘时间依次排列。",
   "单场比赛的私盘展示上限为 N 个（可配置，默认 5）：按开盘时间升序展示前 N 个，超出折叠为「查看全部私盘(M)」；折叠不影响原比赛卖单簿中各庄家档位的正常展示与成交。",
   "原比赛的官方盘口与官方投注完全不受影响，私盘只是另挂一行，不改变原比赛的任何赔率与玩法。",
   "「私盘」与「P2P」两个标识互斥：私盘标识只标注在私盘行；P2P 标识表示该场玩法项有会员坐庄，只标注在官方盘（原比赛行与联赛头）。官方盘不展示私盘标识，两者不同时出现在同一对象上。",
   "首页筛选行新增「私盘」筛选，开启后列表仅展示私盘。"]},
  {t:"卖单簿：按来源隔离",pg:"live",tag:"调整",d:[
   "卖单簿按来源隔离，三类档位不会同时出现在同一个卖单簿中：私盘的卖单簿只有「该开盘庄家的档位 + 官方无限档位」；官方盘的卖单簿只有「投注项卖出档位 + 官方无限档位」。",
   "各自内部排序：赔率降序 → 同赔率按卖出时间升序（先挂先排）→ 官方档位固定排最后。",
   "买家严格按簿序自最高赔率档位起依次成交，不可跳档；官方档位额度无限，始终兜底。同一次投注命中多个档位时，各档位分别按其簿面赔率成交并生成对应子单。",
   "展示范围：赔率低于官方赔率的档位不展示，视为已下架、不可成交；赔率不低于官方的档位全部展示，不做数量截断。",
   "可见高度：卖家档位最多可见 5 档，超过 5 档时区域内出现滚动条滚动查看其余档位；官方档位固定在最后一行，不参与滚动。",
   "开盘庄家档位的卖家展示其昵称；庄家自己的档位标注「我」。",
   "私盘为庄家专属：买家点私盘赔率格直购该庄家档位，额度以庄家该盘口剩余可卖为限，售罄后由官方档位承接，超出庄家额度的部分按官方赔率成交。",
   "调水同步：庄家调水后私盘赔率格与该庄家档位同步更新，卖单簿实时重排。",
   "卖单簿内嵌在买入 / 卖出 Tab 的投注卡片内直接平铺展示，没有二级入口。",
   "单项封盘期间庄家档位从卖单簿下架、私盘该格锁定，官方档位不受影响；盘口被移除则回到未开放，仅私盘不展示，原比赛不受影响。",
   "赔率格：原比赛有庄家档位的盘口展示红点，红点常驻、不因点击消失，仅当无高于官方的档位时自动消失；私盘赔率格样式与官方盘一致，不做颜色区分。"]},
  {t:"盘口详情页的私盘相关",pg:"detail",tag:"调整",d:[
   "入口：比赛卡片底部的「全部」或「P2P」，两个入口进入同一页面，内容完全一致，不做筛选差异。",
   "「全部 N」的 N 为该场投注项数量，与本页赔率格总数一致；「P2P N」的 N 为该场存在 P2P 庄单的投注项数量。",
   "赔率格规则与赛事大厅一致：有更优 P2P 档位时展示最高 P2P 赔率并带红点；红点常驻、不因点击消失，仅当无高于官方的档位时自动消失。",
   "私盘不单独进入盘口详情页：私盘只在赛事列表中以一行展示，点私盘赔率格直接加入购物车。"]},
  {t:"买入与串关",pg:"slip",tag:"调整",d:[
   "买入：输入金额后底部实时试算合计与最高可赢，按依序吃单逐档位赔率累计；投注成功后各档位额度、庄单已收 / 子单、账户余额同步更新。",
   "私盘投注项不参与串关：私盘项仍在串关页展示，置灰并标注「私盘投注项不支持串关，仅官方盘投注项可参与」，不计入组合、也不计入串关资格判定。",
   "同场不可互串：同一场比赛的多个投注项不允许串关，包括「一个官方盘 + 一个私盘」这种组合 —— 私盘复制自原比赛，视为同一场。",
   "串关组合按原比赛去重：每场只取先选中的一项参与，其余置灰并标注「与已选投注项属同一场比赛，同场不可互串」。",
   "串关按钮激活条件：可参与串关的投注项需来自 ≥2 场不同比赛。购物车内只有同一场赛事时（无论官方盘或私盘），串关按钮置灰。",
   "已进入串关页但可串项不足 2 场时不生成组合行，提示「可串关的投注项不足 2 场，无法生成串关组合」。",
   "串关不支持庄家单赔率，全部按官方欧洲盘计算，沿用既有约束。"]},
  {t:"开盘详情与控盘",pg:"sell",tag:"新增",d:[
   "入口：我的卖出 → 私盘页签 → 点击盘卡片「查看详情」。庄家对自己私盘的全部控盘操作都在本页完成。",
   "顶栏：返回（回我的卖出）、标题「开盘详情」、右侧盘状态标签（卖出中 / 已售罄 / 已结算 / 已关闭）。本页不提供分享入口。",
   "状态横幅仅在已关闭时展示：「已停止收单，卖出单已从卖单簿下架，等待赛事结算，未消费押金结算后退回」。已结算不展示顶部横幅，盈亏在汇总与各投注项庄单的输赢标签上体现。",
   "赛事信息卡：主队 vs 客队、联赛 · 开赛时间、开盘时间、自动封盘设置（开赛前 N 分钟）。下接四列汇总：总押金 / 已收单 / 子单数 / 状态。",
   "投注项庄单列表标题「投注项庄单(N)」，逐项展示卡片。",
   "庄单卡片：投注项名 + 单项状态标签 —— 进行中为 收单中 / 部分成交 / 已封盘 / 已售罄；盘已结算时标签改为该投注项的输赢结果（赢绿 / 输红 / 走水灰），不再显示「已结算」。",
   "庄单赔率绿色显示，确认开盘后固定、不随官方赔率联动；官方当前赔率仅作参考不参与计算，当庄单赔率低于官方赔率时追加红字「低于官方」，此时该档位已从卖单簿下架、不可成交。",
   "卡片还展示已收金额与剩余可卖额度，额度旁标注「共享盘押金」说明来自整盘共享池。",
   "子单列表标题「子单数据(N)」，默认收起、点击标题行展开 / 收起（右侧显示 展开 ⌄ / 收起 ⌃），每次进入详情页默认全部收起；无成交时显示「子单数据(0)：暂无成交」且不可展开。",
   "每笔子单两行：第一行「会员」标签 + 买家 ID + 成交金额 + 成交赔率；第二行成交时间 + 结算金额（已结算赢绿输红，未结算显示「未结算」）。",
   "底部操作区按盘状态变化：卖出中 / 已售罄展示「新增盘口」「补充额度」「停止收单」；已结算 / 已关闭无任何控盘操作，底部操作区整条隐藏，返回统一走左上角返回按钮。",
   "单项操作：调水、封盘 / 恢复。",
   "调水：新庄单赔率 = 当前庄单赔率 + 调整点位，可为负、最多两位小数，新赔率必须大于 0；已成交子单按原成交赔率结算，调水只影响后续新成交。",
   "调水实时生效、卖单簿实时重排；单项 10 秒内限调 1 次，限频为单投注项维度，同一盘内不同盘口各自独立。单次调整点位绝对值上限与调整后赔率的绝对上限由配置控制，超出即拦截。",
   "调水不影响已占用押金：已成交子单的押金占用按成交时的庄单赔率锁定，不随后续调水重算；剩余押金仅因新成交、补充额度、结算三类事件变化。",
   "封盘 / 恢复（单投注项级）：封盘后该项档位从卖单簿下架、暂停收单，卖出单保留，官方档位不受影响；开赛前可随时恢复，二次确认后执行。整盘自动封盘（到点或开赛）等价于全部投注项同时封盘。",
   "自动封盘触发后该设置即失效，恢复开盘后不会被再次自动封盘，需重设才再次生效。",
   "新增盘口：盘进行中可从 IM 交集内未开放的盘口勾选新增，按新增时官方港盘赔率 + 上浮点位定价，共享押金池、无需追加押金（剩余押金为 0 时提示先补充额度）。",
   "移除盘口：仅该盘口无任何成交时可移除；盘押金为共享池，不因移除变动、不退款。移除后开放盘口数仍需 ≥ min_items，低于门槛拦截并提示「如需清空请使用停止收单」。",
   "IM 侧被动下架：某盘口被 IM 下架时该投注项自动置为已封盘并从卖单簿移除，已成交子单按 IM 返回结果处理；若开放项因此低于 min_items，盘不自动关闭、可继续收单（门槛只约束开盘与主动移除，不回溯被动变化），但该盘口不可再新增。",
   "补充额度：输入一笔追加金额，实时预览追加后押金与新增预计可卖额度；追加进入共享池，全部盘口剩余可卖同步扩大，赔率与状态不变；已售罄追加后回到卖出中。",
   "停止收单：二次确认（明示不可逆）后全部档位立即下架、私盘从列表消失、盘置为已关闭；已成交子单正常结算，未消费押金结算后退回。"]},
  {t:"开盘详情与投注项卖出详情的区别",pg:"sell",tag:"新增",d:[
   "投注项卖出详情是单个投注项的卖出挂单：押金独立、只对应一个盘口，入口为 我的卖出 → 投注项卖单页签 → 点击卖单卡片。",
   "开盘详情是整盘：押金共享、含多个投注项庄单，入口为 我的卖出 → 私盘页签 → 查看详情。两者是两个独立页面。",
   "投注项卖出详情支持分享挂单；私盘暂不支持分享，开盘详情无分享入口。",
   "投注项卖出详情无调水与新增 / 移除盘口能力，只能补充押金或停止收单；开盘详情具备完整控盘能力。"]},
  {t:"我的卖出改造",pg:"sell",tag:"调整",d:[
   "顶部两个页签（样式同买单列表）：投注项卖单（默认选中，展示官方盘的投注项坐庄数据）、私盘（展示开盘坐庄的盘卡片）。",
   "页签下方筛选区一排两个下拉，对两个页签同时生效：时间筛选默认「今天」，选项为 今天 / 昨天 / 近7天 / 近30天 / 自定义，选「自定义」弹出与买单已结算一致的时间弹窗，应用后下拉文案显示所选区间；状态筛选默认「全部」，选项为 全部 / 卖出中 / 已售罄 / 已结算 / 已关闭。",
   "筛选区下方四列汇总：总卖出 / 进行中 / 已消费 / 总结算盈亏，盈利绿、亏损红、不输不赢黑，符号与数值同行不换行。",
   "私盘卡片字段：联赛、状态标签、私盘名称、盘号、开放项数、总押金、收单进度条、已收 / 押金、查看详情。",
   "私盘名称与赛事列表中该私盘的名称一致，即「原比赛名 · 庄家昵称」，不使用原比赛名。",
   "卡片不展示「私盘」标识（私盘列表本身已表明来源）；已结算盘在联赛名右侧、状态标签左侧展示盘净盈亏，赢绿输红、不输不赢黑，带正负号且同行不换行。",
   "私盘不展示分享按钮，暂不支持分享；投注项卖单的分享入口不受影响。",
   "上线前既有的投注项卖出庄单不受影响，自动归入「投注项卖单」页签。"]},
  {t:"异常与并发场景",pg:"live",tag:"新增",d:[
   "IM 盘口关闭：对应开盘庄单强制关闭、私盘该盘口下架、已成交子单进入结算；盘内其余项不受影响；全部项关闭则盘置为已关闭、私盘从列表消失。",
   "IM 跳水：开盘庄单赔率不联动、维持固定；仅卖单簿因官方档位赔率变化而实时重排。",
   "赛事取消 / 腰斩：沿用现有特殊结算规则，子单退款、押金全额退回、净盈亏 ¥0、无抽佣，私盘从列表消失。",
   "赛事改期：以 IM 返回为准 —— 仅变更开赛时间时盘顺延继续收单、自动封盘按新开赛时间重算；IM 取消赛事时按赛事取消处理。",
   "开赛时刻：未封盘的盘自动封盘，整盘停止收单，等待结算。",
   "余额不足：确认开盘 / 新增盘口 / 补充额度时余额小于冻结金额即拦截，不产生任何冻结。押金冻结部分失败时整体回滚、已冻结项解冻并提示重试。",
   "开盘提交与 IM 关盘并发：逐项校验 IM 状态，已关闭项自动剔除并提示；剔除后不足 3 项则整体拦截。",
   "私盘购买与售罄并发：拦截并提示剩余可卖金额，不产生部分成交。调水与吃单并发、私盘购买与调水并发，按买家「赔率变更接受类型」既有规则处理。",
   "动态移除与买家下单并发：买家提交时盘口已被移除，按盘口不可投拦截退单。",
   "自动封盘与手动操作竞争：以先到达服务端的操作为准，后到操作按当前盘状态校验拦截。恢复开盘仅限开赛前，开赛时刻后按钮隐藏。",
   "重复提交：按钮置灰防重，服务端幂等。开关关闭为软关闭：存量盘继续执行至结算，禁止新开盘、开盘入口隐藏。"]},
  {t:"配置项与开关",pg:"live",tag:"新增",d:[
   "本期新增四个全局配置：p2p_open_market_enabled（开盘坐庄独立开关，默认 0，用于灰度）、p2p_open_min_deposit（押金下限，默认 1000）、p2p_open_min_items（最少开放盘口数，默认 3）、p2p_open_freeze_minutes（开赛前禁开分钟数，默认 10）。",
   "三级开关关系：p2p_enabled > 商户开关 > 开盘开关，任一关闭则开盘不可用，均为软关闭。",
   "三项门槛参数修改后对新开盘即时生效，不影响存量盘。",
   "另新增两项运营配置：p2p_market_league_whitelist（可坐庄联赛白名单）、p2p_market_display_limit（单场私盘展示上限，默认 5）。",
   "调水频控默认 10 秒；押金限额沿用既有卖出押金限额配置；抽佣费率由 APISYS 下发，本系统不配置。"]},
  {t:"输入框约束",pg:"live",tag:"新增",d:[
   "统一规则：数字输入与展示靠右对齐，文本靠左对齐；超限自动更正并 toast 提示。",
   "自动封盘（开赛前 N 分钟）：非负整数，0 ~ 1440，0 = 不预设，默认 10。",
   "庄家昵称：中英文 + 数字，1 ~ 12 字符，默认取上次设置值。",
   "上浮点位（开盘 / 新增盘口）：数字、最多两位小数、可为负，−9.99 ~ 9.99，结果赔率须 > 0，默认 0.01。",
   "盘押金（开盘）：正数、最多两位小数，≥ p2p_open_min_deposit，上限按风控配置（1,000 ~ 100,000），默认空。",
   "调整点位（调水）：数字、最多两位小数、可为负，结果赔率须 > 0，默认 0.00。",
   "追加金额（补充额度）：正数、最多两位小数，单次 > 0 且在余额内，默认空。"]},
  {t:"本期范围之外",pg:"live",tag:"待确认",d:[
   "自定义赛事 / 玩法 / 投注项（二期）；收单审核（二期，预定稿规则见 PRD 附录 A）。",
   "订单抵押模式开盘（仅支持押金模式）；投注项级独立押金模式（本期为盘级共享押金池）。",
   "滚球（已开赛赛事）开盘；串关购买庄家单（沿用既有约束）。",

   "关联账号图谱识别与自动拦截 —— 本期仅做同 IP / 同设备的运营提示；私盘曝光位运营；抽佣费率在本系统可配。",
   "自买自卖：业务上允许买家买中自己挂出的庄单，本期不做系统拦截，改以运营可见性兜底。"]}

 omfund:[
  {t:"四个阶段与主体",pg:"sell",tag:"新增",d:[
   "全流程分冻结、占用、结算、返还四个阶段，均以「盘」为押金主体、以「投注项庄单」为结算主体。",
   "盘维度不产生独立结算，仅作展示聚合；押金相关账变按盘产生，结算与子单退款逐投注项庄单产生。"]},
  {t:"基础公式",pg:"sell",tag:"新增",d:[
   "庄单赔率 = 开盘（或新增盘口）时官方港盘赔率 + 上浮点位，加法模型、可为负；确认后固定，仅可通过调水修改。调水公式：新庄单赔率 = 当前庄单赔率 + 调整点位。",
   "预计可卖额度（开盘预估） = 盘押金 ÷ 最高卖出赔率（所选盘口中庄单赔率最高者），向下取整到分，是最保守口径的整体预估。",
   "剩余押金 = 盘押金 + 补仓 − Σ(各子单成交金额 × 对应庄单赔率)。",
   "各盘口实时剩余可卖额度 = 剩余押金 ÷ 该盘口庄单赔率，向下取整到分。任一盘口成交都会同步收缩其他盘口的剩余可卖额度。"]},
  {t:"冻结与占用",pg:"sell",tag:"新增",d:[
   "确认开盘时冻结盘押金一笔，账变「庄单押金扣款」，关联盘 ID；补充额度追加冻结一笔，账变「追加押金扣款」；新增 / 移除盘口不产生押金账变，因为共享同一个押金池。",
   "每笔子单成交占用押金 = 成交金额 × 庄单赔率，即庄家对该子单的最大赔付责任。这条规则保证即使庄家全输，总赔付 Σ(金额 × 赔率) 也不超过押金，不存在穿仓。",
   "剩余押金归零时整盘已售罄，私盘从列表消失；盘级补充额度后恢复收单。",
   "额度死区：某盘口实时可卖额度低于该玩法最小投注额时，该项置为不可买（展示为额度不足的锁定态），避免「显示有额度但买不了」；全部开放项均不可买时整盘转为已售罄。",
   "并发控制：可卖额度以服务端为准，同一盘的成交请求串行处理，额度校验与扣减在同一事务内完成，杜绝多盘口并发成交导致的超卖穿仓；校验失败提示「额度已被其他买家占用，请重新输入金额」。"]},
  {t:"结算与抽佣",pg:"sell",tag:"新增",d:[
   "子单按买家视角结算：买家赢 = +金额 × 赔率，买家输 = −金额。",
   "各投注项庄单盈亏 = 该项子单结算总和 × (−1)，反向结算；盘净盈亏 = Σ 各投注项庄单盈亏。",
   "抽佣费率由 APISYS 下发，不在本系统配置，结算时按下发费率扣除；庄家侧按单净盈利抽佣。",
   "买家侧抽佣基数 = 购买 P2P 订单的盈利 − 购买官方订单的盈利，乘以该费率，由结算系统扣除后入账，本系统不重复计算。",
   "费率异常兜底：APISYS 未返回费率或返回非法值（小于 0 或大于 100%）时不采用，按平台兜底费率结算，并记录异常日志告警，不阻断结算。",
   "资金返还：结算时押金全额解冻，账变「庄单押金退回」一笔；各投注项庄单盈亏逐项入账，账变「庄单结算」，正入负扣。"]},
  {t:"分段结算",pg:"sell",tag:"新增",d:[
   "按投注项所属时段分别结算：上半场玩法在上半场结束并由 IM 返回结果后即结算，对应子单的押金占用同步释放、剩余押金回升、其余盘口可卖额度随之扩大。",
   "全场玩法待全场结束结算；盘在全部开放项结算完成后整体转为已结算。"]},

/* 卖单薄：档位 / 卖出赔率 / 可购额度 / 购买计划 */
/* 卖单簿按来源隔离：私盘 = 该庄家档位 + 官方无限档位；官方盘 = 投注项卖出档位 + 官方无限档位。
   排序 = 赔率降序 → 同赔率卖出时间升序 → 官方固定最后；低于官方的档位视为已下架不展示 */
function bookTiers(it,off,best){
  const offv=parseFloat(off);
  let tiers=[];
  if(it&&it.priv){
    /* 私盘：只有该开盘庄家的档位 + 官方无限档位 */
    const m=it.pm, k=it.pitem;
    if(m&&k&&k.status==="on")tiers.push({who:m.nick,odds:k.odds,quota:omItemQuota(m,k),t:m.created,mine:true});
  }else{
    /* 官方盘：只有投注项卖出档位 + 官方无限档位 */
    tiers.push({who:"会员卖出",odds:best,quota:520.00,t:"09-18 02:00"});
  }
  /* 低于官方赔率的档位视为已下架，不展示 */
  tiers=tiers.filter(x=>parseFloat(x.odds)>=offv)
             .sort((a,b)=>parseFloat(b.odds)-parseFloat(a.odds)||(a.t<b.t?-1:1));
  tiers.push({who:"官方",odds:off,quota:Infinity,t:"",kind:"官"});
  return tiers;
}
/* 依簿序分配购买计划 */
function bookPlan(tiers,amt){
  let left=amt;
  return tiers.map(x=>{
    if(left<=0)return 0;
    const take=x.quota===Infinity?left:Math.min(left,x.quota);
    left-=take;return take;
  });
}
function book(off,best,it){
  const tiers=bookTiers(it||{},off,best);
  const amt=parseFloat(S.stakes[(it&&it.key)||""]||0)||0;
  const plan=bookPlan(tiers,amt);
  const lbl=["卖一","卖二","卖三","卖四","卖五"];
  let n=0;
  return `<div class="book">
    <div class="book-h"><span>卖单薄</span><span class="ar">${S.bookOpen?"收起 ︿":"展开 ﹀"}</span></div>
    ${S.bookOpen?`<table class="book-t">
      <tr><th>档位</th><th>卖出<br>赔率</th><th>可购<br>额度</th><th>购买<br>计划</th></tr>
      ${tiers.map((x,i)=>{
        const isOff=x.kind==="官";
        const tag=isOff?"官方":(lbl[n++]||"卖"+(n));
        return `<tr>
          <td class="${isOff?"t2":"t1"}" title="${esc(x.who)}">${tag}${x.mine?'<i class="bk-me">我</i>':""}</td>
          <td class="${isOff?"o":"g"}">${x.odds}</td>
          <td class="${isOff?"o":""}">${x.quota===Infinity?"无限":money(x.quota)}</td>
          <td>${plan[i]?money(plan[i]):0}</td></tr>`;
      }).join("")}
    </table>`:""}
  </div>`;
}

/* 串关以「场次」为单位：同一场比赛的多个投注项互斥，不能进同一张串关单 */
function slipMatches(){
  const m=new Map();
  S.slip.forEach(x=>{const k=x.mid||x.key;if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
  return m;
}
const parlayLegCount=()=>slipMatches().size;
const parlayDupMatch=()=>[...slipMatches().values()].some(a=>a.length>1);
/* 当前选中的串关类型；所选场次变化后自动回落到第一个合法类型 */
function currentCombo(){
  const list=comboTypes(parlayLegCount());
  return list.find(t=>t.v===S.combo)||list[0]||null;
}
/* 该类型会生成的每一注（每注是若干条腿的组合） */
function comboBets(t){
  const legs=[...slipMatches().values()].map(a=>a[0]);
  if(!t)return[];
  if(t.mix){let out=[];for(let m=2;m<=legs.length;m++)out=out.concat(subsetsOf(legs,m));return out}
  return subsetsOf(legs,t.m);
}
function sums(){
  if(S.buyMode==="串关"&&parlayLegCount()>=2&&!parlayDupMatch()){
    const per=parseFloat(S.comboStake||0)||0;
    const bets=comboBets(currentCombo());
    const total=per*bets.length;
    const ret=bets.reduce((a,c)=>a+per*c.reduce((q,x)=>q*parseFloat(effOdds(x)),1),0);
    return{total,win:ret-total};
  }
  let total=0,win=0;
  S.slip.forEach(x=>{const st=parseFloat(S.stakes[x.key]||0)||0;total+=st;win+=st*(parseFloat(x.odds)-1)});
  return{total,win};
}
function updateSum(){
  const a=$("#sumA"),b=$("#sumB"),g=$("#go");if(!a)return;
  const {total,win}=sums();
  a.textContent=money(total)+" CNY";b.textContent=money(win)+" CNY";
  if(g)g.disabled=total<=0;
}
