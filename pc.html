/* 把每场比赛的私盘插到原比赛分组下方；开启「私盘」筛选时只留私盘 */
function withPrivate(groups){
  const out=[];
  groups.forEach(g=>{
    const ms=g.matches||[];
    if(!ms.some(mt=>privGroupsFor(mt.id,g).length)){ if(!S.privOnly)out.push(g); return }
    /* 原联赛保持一张卡，只在出现私盘的场次处断开，私盘紧跟该场之后 */
    let buf=[];
    const flush=()=>{ if(buf.length&&!S.privOnly)out.push({...g,matches:buf}); buf=[] };
    ms.forEach(mt=>{
      buf.push(mt);
      const privs=privGroupsFor(mt.id,g);
      if(privs.length){ flush(); privs.forEach(pg=>out.push(pg)) }
    });
    flush();
  });
  return out;
}
function bySport(list){
  const map=new Map();
  list.forEach(g=>{if(!map.has(g.sport))map.set(g.sport,[]);map.get(g.sport).push(g)});
  return [...map.entries()];
}
function emptyBox(txt){
  const e=el("div","empty",`<div class="box"></div><div>${txt}</div>`);return e;
}
function groupHead(text,key){
  const open=!S.collapsed.has("G:"+key);
  const g=el("div","grp",`<span class="gt">${text}</span>`);
  const f=el("button","fold",(open?"收起 ︽":"展开 ︾"));
  f.onclick=()=>{open?S.collapsed.add("G:"+key):S.collapsed.delete("G:"+key);render()};
  g.appendChild(f);g.dataset.gk=key;return g;
}
/* 私盘分组：开盘后复制原比赛生成，紧随原比赛下方展示，仅展示开放盘口 */
/* 该场是否已有进行中的投注项卖出挂单（卖出中 / 已封盘计入） */
const hasItemSell=mid=>legacySells.some(o=>o.mid===mid&&["卖出中","部分成交"].includes(o.state));
/* 该场是否已有进行中的私盘 */
const hasOpenMarket=mid=>markets.some(m=>m.mid===mid&&["open","soldout"].includes(m.status));
/* P2P 与私盘本期仅对足球开放 */
const P2P_SPORT="足球";
/* 该场是否展示 P2P：足球 + 该场官方盘有会员投注项卖出。
   不同会员互不影响，别人开了私盘不影响这场的 P2P 展示 */
const matchP2P=(g,mt)=>!!(!g.priv&&g.sport===P2P_SPORT&&(mt.p2p!==undefined?mt.p2p:g.p2p));
/* 开盘入口：未开赛（滚球不可开）+ 足球 + 本人在该场没有进行中的投注项卖出 */
const canOpenMarket=(g,mt)=>!!(mt.date&&!g.priv&&g.sport===P2P_SPORT&&!hasItemSell(mt.id));
/* 当前筛选范围内是否可能出现 P2P / 私盘 */
function p2pScope(){
  const sp=S.page==="live"?S.chip:(S.page==="hot"?"全部":S.sport);
  return sp==="全部"||sp===P2P_SPORT;
}
function privGroupsFor(mid,g){
  if(g.sport!==P2P_SPORT||g.priv)return[];      /* 私盘本期仅足球 */
  const ms=markets.filter(m=>m.mid===mid&&m.status==="open"&&m.sport===P2P_SPORT
    &&m.items.filter(it=>it.status==="on").length>=OM_CFG.minItems);
  if(!ms.length)return[];
  const shown=ms.slice(0,OM_CFG.displayLimit);
  return shown.map(m=>({
    league:g.league,sport:g.sport,flag:g.flag,p2p:false,priv:true,market:m,
    parent:g,parentMatch:g.matches.find(x=>x.id===mid),
    markets:g.markets,
    matches:[{...g.matches.find(x=>x.id===mid),id:mid+"#"+m.id,privOf:m}]
  }));
}
/* 私盘赔率格：把列表的盘口列 + 选项文案映射到庄家开放的投注项；
   未开放的盘口显示 -- 置灰，单项封盘显示锁定态 */
function privCell(m,mkName,label){
  const half=/上半场|半场/.test(mkName);
  const isO=/^大|大\s/.test(label), isU=/^小|小\s/.test(label);
  const isA=/客/.test(label), isH=/主/.test(label), isD=/和|平/.test(label);
  let k=null;
  if(half)k=null;                                   /* 本期示例盘只开全场项 */
  else if(/独赢|1\*2/.test(mkName))k=isH?"1x2-h":isA?"1x2-a":null;
  else if(/让球|让分/.test(mkName))k=(isA||/^\+/.test(label))?"ah-a":"ah-h";
  else if(/大小|总分/.test(mkName))k=isO?"ou-o":isU?"ou-u":null;
  if(!k)return null;
  return m.items.find(x=>x.status!=="removed"&&itemSlot(x.name)===k)||null;
}
/* 庄单投注项名（"全场 大/小 · 大 3"）→ 列表盘口槽位，用于把庄单映射到赔率格 */
function itemSlot(name){
  const parts=String(name).split("·");
  const mk=parts[0]||"", label=(parts[1]||"").trim();
  if(/半场/.test(mk))return null;
  const isO=/^大/.test(label), isU=/^小/.test(label);
  const isA=/客/.test(label), isH=/主/.test(label);
  if(/独赢|1\*2/.test(mk))return isH?"1x2-h":isA?"1x2-a":null;
  if(/让球|让分/.test(mk))return (isA||/^\+/.test(label))?"ah-a":"ah-h";
  if(/大小|大\/小|总分/.test(mk))return isO?"ou-o":isU?"ou-u":null;
  return null;
}

function betBtn([label,odds],ctx){

  b.dataset.odds=odds;

    render();

/* ============ 日期区间筛选（买单 / 卖单 / 汇总报表共用） ============ */
const DR_TODAY="2026-09-22";
const dAdd=(ds,n)=>{const t=new Date(ds+"T00:00:00");t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
/* 预置项 → 日期区间；返回 null 表示不限 */
function presetRange(v){
  if(v==="全部"||!v)return null;
  if(v==="今天")return[DR_TODAY,DR_TODAY];
  if(v==="昨天"){const y=dAdd(DR_TODAY,-1);return[y,y]}
  if(v==="近7天")return[dAdd(DR_TODAY,-6),DR_TODAY];
  if(v==="近30天")return[dAdd(DR_TODAY,-29),DR_TODAY];
  if(v==="本周")return["2026-09-21",DR_TODAY];
  if(v==="本月")return[DR_TODAY.slice(0,7)+"-01",DR_TODAY];
  return null;
}
/* 自定义区间优先于预置项 */
function activeRange(key,preset){
  const c=S.dr[key];
  return c?[c.from,c.to]:presetRange(preset);
}
const inActive=(d,key,preset)=>{const r=activeRange(key,preset);return !r||(d>=r[0]&&d<=r[1])};

function dateRangeBox(key,onChange){
  const c=S.dr[key];
  const b=el("div","fbox dr"+(c?" on":""));
  b.innerHTML=c
    ? `📅 <span>${c.from.replace(/-/g,"/")}</span><span style="color:var(--ink-mute)">至</span><span>${c.to.replace(/-/g,"/")}</span><button class="x" title="清除">✕</button>`
    : `📅 <span>选择时间段</span><span class="caret">▼</span>`;
  b.onclick=e=>{
    if(e.target.classList.contains("x")){e.stopPropagation();S.dr[key]=null;onChange&&onChange();render();return}
    openDateRange(key,onChange);
  };
  return b;
}
function openDateRange(key,onChange){
  const layer=$("#layer");
  const mask=el("div","mask");
  const mo=el("div","modal sm");
  const c=S.dr[key]||{from:"",to:""};
  mo.innerHTML=`<header>选择时间段<span class="tools"><button id="cls">✕</button></span></header>
    <div class="dr-body">
      <div class="dr-row"><label>开始</label><input type="date" id="drF" value="${c.from}" max="${DR_TODAY}"></div>
      <div class="dr-row" style="margin-bottom:0"><label>结束</label><input type="date" id="drT" value="${c.to}" max="${DR_TODAY}"></div>
    </div>
    <footer><button id="clr">清除</button><button class="ok" id="ok">确定</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#clr",mo).onclick=()=>{S.dr[key]=null;close();onChange&&onChange();render()};
  $("#ok",mo).onclick=()=>{
    const f=$("#drF",mo).value, t=$("#drT",mo).value;
    if(!f||!t)return toast("请选择完整的开始与结束日期");
    if(f>t)return toast("开始日期不得晚于结束日期");
    if(t>DR_TODAY)return toast("结束日期不得晚于今天");
    if(dAdd(f,365)<t)return toast("时间跨度不得超过 1 年");
    S.dr[key]={from:f,to:t};close();onChange&&onChange();render();
    toast(`已筛选 ${f} 至 ${t}`);
  };
}

      <div class="ad-tip">余额 CNY <b class="num">${money(S.balance)}</b>　补充部分即时进入挂出额度，已成交部分不受影响。</div>
    </div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok" disabled>确认补充</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const inp=$("#addAmt",mo);
  const sync=()=>{
    const v=parseFloat(inp.value||0)||0;
    $("#adQuota",mo).textContent="¥"+money(o.cap+v/rate);
    $("#ok",mo).disabled=!(v>=10&&v<=S.balance);
  };
  inp.oninput=e=>{e.target.value=e.target.value.replace(/[^\d.]/g,"");sync()};
  mo.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    inp.value=b.dataset.v==="max"?String(Math.floor(S.balance)):String((parseFloat(inp.value||0)+parseFloat(b.dataset.v)).toFixed(2));
    sync();
  });
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#ok",mo).onclick=()=>{
    const v=parseFloat(inp.value||0)||0;
    if(v<10){toast("补充金额不得低于 10 CNY");return}
    if(v>S.balance){toast("余额不足");return}
    o.dep=+(o.dep+v).toFixed(2);
    o.cap=Math.round(o.cap+v/rate);
    if(o.state==="已售罄")o.state="卖出中";
    S.balance-=v;close();render();
    toast(`已补充押金 ¥${money(v)}，可卖额度增至 ¥${money(o.cap)}`);
  };
}

const RP_TODAY="2026-09-22", RP_WEEK_START="2026-09-21", RP_MONTH="2026-09";
function reportDays(){
  const map=new Map();
  const row=d=>{if(!map.has(d))map.set(d,{date:d,buy:0,sell:0,buys:[],sells:[]});return map.get(d)};
  S.bets.filter(b=>b.status!=="未结算"&&b.settle).forEach(b=>{
    const r=row(b.settle.slice(0,10));
    const pnl=b.status==="取消"?0:(b.stamp==="赢"?(b.refund||0):-b.stake);
    r.buy+=pnl;r.buys.push({bet:b,pnl});
  });
  legacySells.filter(o=>o.state==="已结算"&&o.settleTime).forEach(o=>{
    const r=row(o.settleTime.slice(0,10));
    r.sell+=(o.net||0);r.sells.push(o);
  });
  /* 自定义区间优先，其次预置项；报表按结算时间归集 */
  return [...map.values()].filter(r=>inActive(r.date,"report",S.reportRange)).sort((a,b)=>a.date<b.date?1:-1);
}

/* 选项列：四行定高排版 —— 联赛 / 玩法·选项·赔率 / 对阵 / 比分条 */
function legCell(l,b,settled){
  const tone=b.status==="取消"?"void":b.stamp==="赢"?"win":b.stamp==="输"?"lose":"";
  const chips=[];
  if(l.live)chips.push(`<span class="sc-chip">下注 ${esc(l.score||"0-0")}</span>`);
  if(settled)chips.push(l.final
    ? `<span class="sc-chip fin ${tone}">结算 ${esc(l.final)}</span>`
    : `<span class="sc-chip fin void">结算 —</span>`);
  if(settled&&l.half)chips.push(`<span class="sc-half">${esc(l.half)}</span>`);
  const why=settled&&l.finalNote
    ? `<span class="bt-why" title="${esc(l.finalNote)}">${esc(l.finalNote)}</span>`:"";
  return `<div class="bt-leg">
    <div class="bt-l1"><span class="bt-sport">[${esc(l.sport||"篮球")}]</span><span class="bt-lg">${esc(l.league)}</span></div>
    <div class="bt-l2">
      ${l.live?'<span class="bt-live">滚球</span>':""}
      <span class="bt-mk">${esc(l.market)}</span>
      ${l.pick?`<span class="bt-sel">${esc(l.pick)}</span>`:""}
      <span class="bt-od num">@${l.odds}</span><span class="bt-ot">[${esc(l.oddsType||"欧洲盘")}]</span>
    </div>
    <div class="bt-l3">${esc(l.home)} <span class="vs">vs</span> ${esc(l.away)}</div>
    ${chips.length||why?`<div class="bt-l4">${chips.join("")}${why}</div>`:""}
  </div>`;
}
/* 字段名 : 值 的定义行 */
function kv(rows){
  return `<div class="kv">${rows.map(([k,v])=>`<span class="kv-k">${k}</span><span class="kv-v">${v}</span>`).join("")}</div>`;
}
/* 比分盒：小字段名 + 比分 */
function sbox(label,score,tone){
  return `<span class="sbox ${tone||""}"><i>${label}</i><b class="num">${esc(score)}</b></span>`;
}
/* 投注详情：联赛 / 队名 / 投注项 + 投注时间 + 注单号（两栏通用） */
function betDetailCell(b){
  return `${b.legs.map(l=>`<div class="bd-leg">
      <div class="bt-l1"><span class="bt-sport">[${esc(l.sport||"篮球")}]</span><span class="bt-lg">${esc(l.league)}</span></div>
      <div class="bd-mt">${esc(l.home)} <span class="vs">vs</span> ${esc(l.away)}</div>
      <div class="bd-pick">${l.live?'<span class="bt-live">滚球</span>':""}<span class="bt-mk">${esc(l.market)}</span>${l.pick?`<span class="bt-sel">${esc(l.pick)}</span>`:""}</div>
    </div>`).join("")}
    <div class="bd-foot">${kv([
      ["投注时间",`<span class="num">${esc(b.time)}</span>`],
      ["注单号",`<span class="num">${esc(b.no)}</span> <span class="copy" title="复制单号">⧉</span>`]
    ])}</div>`;
}
/* 选项：未结算 = 下注时比分 + 投注赔率；已结算 = 结算比分 + 判定依据 + 结算赔率 + 结算时间 */
function optionCell(b,settled){
  const tone=b.status==="取消"?"void":b.stamp==="赢"?"win":b.stamp==="输"?"lose":"";
  if(!settled){
    return `${b.legs.map(l=>`<div class="st-leg">
        ${l.live?`<div class="st-sc">${sbox("下注时",l.score||"0-0","")}</div>`:""}
        ${kv([["投注赔率",`<b class="od-v num">@${l.odds}</b> <span class="ot-v">[${esc(l.oddsType||"欧洲盘")}]</span>`]])}
      </div>`).join("")}
      <div class="bd-foot">${kv([["结算说明",`赛事结束后按官方赛果自动结算`]])}</div>`;
  }
  return `${b.legs.map(l=>`<div class="st-leg">
      <div class="st-sc">
        ${l.half?sbox("上半场",l.half,""):""}
        ${l.final?sbox("全场",l.final,tone):sbox("全场","—","void")}
      </div>
      ${l.finalNote?`<div class="st-why">${esc(l.finalNote)}</div>`:""}
      ${kv([["结算赔率",`<b class="od-v num">@${l.odds}</b> <span class="ot-v">[${esc(l.oddsType||"欧洲盘")}]</span>`]])}
    </div>`).join("")}
    <div class="bd-foot">${kv([["结算时间",`<span class="num">${esc(b.settle||"—")}</span>`]])}</div>`;
}
function statusCell(b){
  if(b.status==="未结算")return `<div class="bt-ok">已确认</div>`;
  return `<div class="bt-status ${b.status==="取消"?"r":"g"}">${esc(b.status)}</div>`;
}
/* 结算逻辑：线上由 IM 赛果驱动，原型内部保留以便生成样本 */
function settle(b){
  const r=Math.random();
  const win=r<.5;
  b.status=r<.92?"已结算":"取消";
  if(b.status==="取消"){
    b.stamp=null;b.refund=b.stake;b.stakeNote="本金已归还";
    b.legs.forEach(l=>{l.final=null;l.finalNote="赛事取消，该盘口不结算"});
  }else{
    b.stamp=win?"赢":"输";
    b.refund=win?+(b.stake*(parseFloat(b.legs[0].odds)||1)).toFixed(2):0;
    b.legs.forEach(l=>{
      const h=Math.floor(Math.random()*4),a=Math.floor(Math.random()*4);
      l.final=`${h}-${a}`;
      l.finalNote=win?"结算比分满足所选盘口":"结算比分不满足所选盘口";
    });
  }
  S.balance+=b.refund+(b.status==="取消"?0:(win?b.stake:0));
  S.histTab="已结算注单";render();
  toast(b.status==="取消"?"赛事取消，本金已归还":`注单结算为「${b.stamp}」，返还 ${money(b.refund)} CNY`);
}

    const tag=k.status==="settled"?(it.res||"走水"):(it.status==="sealed"?"已封盘"
      :(q<=0?"已售罄":(it.subs.length?"部分成交":"收单中")));
    const tagc=k.status==="settled"
      ? (it.res==="赢"?"var(--green)":it.res==="输"?"#e8402a":"var(--ink-mute)")

        <span class="oit-od g">@${it.odds}</span>
        <span class="oit-off">官方 @${it.off}${low?`<i class="oit-low">低于官方</i>`:""}</span>
        <span class="oit-amt">已收 <b class="num">¥${money(it.sold)}</b></span>
        <span class="oit-amt">剩余可卖 <b class="num">¥${money(q)}</b></span>
        <span class="tagx" style="color:${tagc};border-color:${tagc}">${tag}</span>
      </div>`;
    if(live){
      const ops=el("div","oit-ops");

      const sl=el("button","oit-b",it.status==="sealed"?"恢复开盘":"封盘");

        const rm=el("button","oit-b",'移除');rm.onclick=()=>removeItem(k,it);ops.appendChild(rm);
      }
      $(".oit-h",c).appendChild(ops);

    /* 有成交才出子单行，无成交不占位 */
    if(it.subs.length){
      const sid=k.id+":"+it.key, open=S.omSubOpen.has(sid);
      const sh=el("div","oit-subh",
        `<span>子单数据(${it.subs.length})</span><span class="ar">${open?"收起 ⌃":"展开 ⌄"}</span>`);
      sh.onclick=()=>{open?S.omSubOpen.delete(sid):S.omSubOpen.add(sid);render()};

           <div class="sub-r2"><span>${esc(f.time)}</span><span>${f.settle!=null

    const b2=el("button","om-op primary","补充额度");b2.onclick=()=>openTopup(k);

    m.appendChild(ops);
  }
}

/* ============ 控盘操作 ============ */
/* 调水：新庄单赔率 = 当前庄单赔率 + 调整点位；10 秒内单项限调 1 次 */
function openAdjust(k,it){
  const now=Date.now();
  if(it.lastAdj&&now-it.lastAdj<OM_CFG.adjustThrottle*1000)
    return toast(`调水过于频繁，${OM_CFG.adjustThrottle} 秒内限 1 次`);
  const layer=$("#layer");const mask=el("div","mask");const mo=el("div","modal sm");
  mo.innerHTML=`<header>调水 · ${esc(it.name)}<span class="tools"><button id="cls">✕</button></span></header>
    <div class="dr-body">
      <div class="ad-cur">${kv([["当前庄单赔率","@"+it.odds],["官方当前赔率","@"+it.off]])}</div>
      <div class="dr-row" style="margin-top:12px"><label>调整点位</label>
        <input id="adjPt" inputmode="decimal" placeholder="可为负，最多两位小数" value=""></div>
      <div class="dr-row" style="margin-bottom:0"><label>调整后</label>
        <input id="adjNew" value="@${it.odds}" readonly></div>
    </div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确认调水</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  const pt=$("#adjPt",mo),nw=$("#adjNew",mo);
  pt.oninput=()=>{const v=parseFloat(pt.value);
    nw.value=isNaN(v)?"@"+it.odds:"@"+(parseFloat(it.odds)+v).toFixed(2)};
  $("#ok",mo).onclick=()=>{
    const v=parseFloat(pt.value);
    if(isNaN(v))return toast("点位格式：数字，最多两位小数");
    const nv=+(parseFloat(it.odds)+v).toFixed(2);
    if(nv<=0)return toast("新赔率必须大于 0");
    it.odds=nv.toFixed(2);it.lastAdj=Date.now();
    close();render();toast(`调水成功，新赔率 @${it.odds}，卖单簿已重排`);
  };
}
/* 单项封盘 / 恢复开盘，二次确认 */
function toggleSeal(k,it){
  if(it.status==="sealed"){
    it.status="on";render();return toast("已恢复开盘，重新进入卖单簿");
  }
  confirmDialog({title:"封盘",okText:"确认封盘",
    body:`确认封盘「${it.name}」？该项从卖单簿下架，暂停收单，卖出单保留。开赛前可随时恢复开盘。`,
    onOk:()=>{it.status="sealed";render();toast("该投注项已封盘，已从卖单簿下架")}});
}
/* 移除盘口：仅无成交时可移除，且移除后开放项不得低于门槛 */
function removeItem(k,it){
  if(it.subs.length)return toast("该盘口已有成交，不可移除");
  if(omOpenItems(k)-1<OM_CFG.minItems)
    return toast(`开放盘口数不得低于 ${OM_CFG.minItems} 个，如需清空请使用停止收单`);
  confirmDialog({title:"移除盘口",okText:"确认移除",
    body:`确认移除「${it.name}」？该盘口回到未开放状态，全平台不可投。盘押金为共享押金，不因移除变动、不产生退款。`,
    onOk:()=>{k.items=k.items.filter(x=>x!==it);render();toast("已移除，盘押金不变")}});
}
/* 新增盘口：从 IM 交集内未开放的盘口里选 */
function openAddItem(k){
  if(omRemain(k)<=0)return toast("剩余押金为 0，请先补充额度");
  const used=new Set(k.items.map(x=>x.key));
  const cand=OM_ITEMS.filter(x=>x.st==="ok"&&!used.has(x.k));
  if(!cand.length)return toast("IM 交集内已无可新增的盘口");
  const layer=$("#layer");const mask=el("div","mask");const mo=el("div","modal sm");
  const pick={};
  mo.innerHTML=`<header>新增盘口<span class="tools"><button id="cls">✕</button></span></header>
    <div class="om-body" id="addL"></div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确认新增</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  const L=$("#addL",mo);
  const draw=()=>{L.innerHTML="";cand.forEach(x=>{
    const on=pick[x.k]!=null, pt=pick[x.k]||"0.01";
    const row=el("div","om-i"+(on?" on":""));
    row.innerHTML=`<div class="om-ih"><span class="om-ck">${on?"☑":"☐"}</span>
        <span class="om-nm">${esc(x.name)}</span><span class="om-off">官方 @${x.off}</span></div>
      ${on?`<div class="om-set"><span class="om-pt"><label>上浮点位</label>
          <input class="ptv" value="${pt}"></span>
        <span class="om-od">庄单赔率 <b>@${omOdds(x.off,pt)}</b></span></div>`:""}`;
    $(".om-ih",row).onclick=()=>{on?delete pick[x.k]:pick[x.k]="0.01";draw()};
    if(on){const i2=$(".ptv",row);
      i2.oninput=e=>pick[x.k]=e.target.value.replace(/[^\d.\-]/g,"");
      i2.onblur=()=>{let v=parseFloat(i2.value);if(isNaN(v))v=0;
        if(parseFloat(x.off)+v<=0){toast("结果赔率须大于 0");v=0.01}
        pick[x.k]=v.toFixed(2);draw()};}
    L.appendChild(row);
  })};
  draw();
  $("#ok",mo).onclick=()=>{
    const ps=cand.filter(x=>pick[x.k]!=null);
    if(!ps.length)return toast("请至少选择 1 个盘口");
    ps.forEach(x=>{const pt=parseFloat(pick[x.k])||0;
      k.items.push({key:x.k,name:x.name,off:x.off,pt,odds:omOdds(x.off,pt),
        status:"on",sold:0,lastAdj:0,subs:[]})});
    close();render();toast("新增成功，盘口已对买家开放");
  };
}
/* 补充额度：追加进共享池 */
function openTopup(k){
  const layer=$("#layer");const mask=el("div","mask");const mo=el("div","modal sm");
  let v="";
  const mx=Math.max(...k.items.map(x=>parseFloat(x.odds)));
  mo.innerHTML=`<header>补充额度<span class="tools"><button id="cls">✕</button></span></header>
    <div class="dr-body">
      <div class="ad-cur">${kv([["当前盘押金","¥"+money(k.dep+k.topup)],
        ["剩余押金","¥"+money(Math.max(omRemain(k),0))],["最高卖出赔率","@"+mx.toFixed(2)]])}</div>
      <div class="dr-row" style="margin-top:12px"><label>追加</label>
        <input id="tpv" inputmode="decimal" placeholder="正数，最多两位小数"></div>
      <div class="om-quick" style="margin-left:56px">${[500,1000,2000].map(x=>`<button data-t="${x}">+${money(x)}</button>`).join("")}</div>
      <div class="dr-row" style="margin:12px 0 0"><label>追加后</label>
        <input id="tpr" value="新增预计可卖额度 0.00" readonly></div>
    </div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确认追加</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  const inp=$("#tpv",mo),res=$("#tpr",mo);
  const sync=()=>{const n=parseFloat(v)||0;
    res.value=`盘押金 ¥${money(k.dep+k.topup+n)}　新增预计可卖 ¥${money(Math.floor(n/mx*100)/100)}`};
  inp.oninput=e=>{v=e.target.value.replace(/[^\d.]/g,"");sync()};
  mo.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    v=String(((parseFloat(v)||0)+parseFloat(b.dataset.t)).toFixed(2));inp.value=v;sync()});
  $("#ok",mo).onclick=()=>{
    const n=parseFloat(v)||0;
    if(n<=0)return toast("请输入追加金额");
    if(n>S.balance)return toast("账户余额不足");
    k.topup+=n;S.balance-=n;
    if(k.status==="soldout")k.status="open";
    close();render();toast(`追加成功，押金已冻结 ¥${money(n)}`);
  };
}
/* 停止收单：不可逆，二次确认 */

    onOk:()=>{k.status="closed";render();toast("已停止收单，盘已关闭，私盘已从列表下架")}});
}

    <footer class="om-foot">
      <div class="om-sum">已选 <b id="omN">0</b> 项　押金 <b id="omD">0.00</b> CNY　预计可卖额度 <b id="omQ">0.00</b> CNY
        <i>= 押金 ÷ 最高卖出赔率</i></div>
      <div><button id="cancel">返回</button><button class="ok" id="ok">确认开盘</button></div>
    </footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  $("#omEarly",mo).textContent=S.period==="早盘"
    ?"；该场为早盘，预计冻结至 "+(mt.date||"")+" "+(mt.clock2||"")+" 赛后":"";

  const picked=()=>OM_ITEMS.filter(x=>st.picks[x.k]!=null)
    .map(x=>({...x,pt:parseFloat(st.picks[x.k])||0}));

  function sum(){
    const ps=picked(), dep=parseFloat(st.dep)||0;
    $("#omN",mo).textContent=ps.length;
    $("#omD",mo).textContent=money(dep);
    $("#omQ",mo).textContent=money(omEst(dep,ps));
  }
  function drawList(){
    const L=$("#omList",mo);L.innerHTML="";
    OM_ITEMS.forEach(x=>{
      const on=st.picks[x.k]!=null, dis=x.st!=="ok";
      const row=el("div","om-i"+(on?" on":"")+(dis?" dis":""));
      const pt=st.picks[x.k]||"0.01";
      row.innerHTML=`<div class="om-ih">
          <span class="om-ck">${on?"☑":"☐"}</span>
          <span class="om-nm">${esc(x.name)}</span>
          ${dis?`<span class="om-dis">${x.st==="lock"?"IM 锁盘中，不可开":"IM 无数据，不可开"}</span>`
               :`<span class="om-off">官方 @${x.off}</span>`}
        </div>
        ${on?`<div class="om-set">
          <span class="om-pt"><label>上浮点位</label>
            <button class="stp" data-m="-1">▼</button>
            <input class="ptv" data-k="${x.k}" value="${pt}">
            <button class="stp" data-m="1">▲</button></span>
          <span class="om-od">庄单赔率 <b>@${omOdds(x.off,pt)}</b>
            ${parseFloat(omOdds(x.off,pt))<parseFloat(x.off)?`<i class="om-low">低于官方</i>`:""}</span>
        </div>`:""}`;
      if(!dis)$(".om-ih",row).onclick=()=>{
        if(on)delete st.picks[x.k]; else st.picks[x.k]="0.01";
        drawList();sum();
      };
      if(on){
        const inp=$(".ptv",row);
        const setPt=v=>{st.picks[x.k]=v;drawList();sum()};
        inp.oninput=e=>{st.picks[x.k]=e.target.value.replace(/[^\d.\-]/g,"")};
        inp.onblur=()=>{
          let v=parseFloat(inp.value);
          if(isNaN(v))v=0;
          v=Math.max(-9.99,Math.min(9.99,v));
          if(parseFloat(x.off)+v<=0){toast("结果赔率须大于 0");v=parseFloat(st.picks[x.k])||0.01}
          setPt(v.toFixed(2));
        };
        row.querySelectorAll(".stp").forEach(b=>b.onclick=()=>{
          let v=(parseFloat(st.picks[x.k])||0)+(+b.dataset.m)*0.01;
          v=Math.max(-9.99,Math.min(9.99,v));
          if(parseFloat(x.off)+v<=0)return toast("结果赔率须大于 0");
          setPt(v.toFixed(2));
        });
      }
      L.appendChild(row);
    });
  }
  drawList();sum();

  $("#omDep",mo).oninput=e=>{st.dep=e.target.value.replace(/[^\d.]/g,"");sum()};
  mo.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    st.dep=b.dataset.d==="max"?String(OM_CFG.depositMax.toFixed(2))
      :String(((parseFloat(st.dep)||0)+parseFloat(b.dataset.d)).toFixed(2));
    $("#omDep",mo).value=st.dep;sum();
  });
  $("#omSeal",mo).oninput=e=>{st.seal=Math.max(0,Math.min(1440,parseInt(e.target.value||0)))};
  $("#omNick",mo).oninput=e=>{st.nick=e.target.value.slice(0,12)};

  /* 确认开盘：逐条校验门槛，任一不过整体不提交 */
  $("#ok",mo).onclick=()=>{
    const ps=picked(), dep=parseFloat(st.dep)||0;
    /* 提交时二次校验：弹窗打开期间该场若出现投注项卖出，拦截并关闭弹窗 */
    if(hasItemSell(mt.id)){close();return toast("你在该场已有进行中的投注项卖出，同一场比赛二选一")}
    if(ps.length<OM_CFG.minItems) return toast(`开盘门槛：至少开放 ${OM_CFG.minItems} 个盘口`);
    if(dep<OM_CFG.minDeposit)     return toast(`开盘门槛：押金须 ≥ ${money(OM_CFG.minDeposit)}`);
    if(dep>OM_CFG.depositMax)     return toast(`押金超出风控上限 ${money(OM_CFG.depositMax)}`);
    if(dep>S.balance)             return toast("账户余额不足，不产生任何冻结");
    if(!st.nick.trim())           return toast("请填写庄家昵称");
    const m=makeMarket(mt,g.league,g.sport,st.nick.trim(),dep,st.seal,ps);
    markets.unshift(m);
    S.omNick=st.nick.trim();
    S.balance-=dep;
    close();render();
    toast(`开盘成功，押金已冻结 ¥${money(dep)}`);
  };
}

function openLeagueModal(){
  const layer=$("#layer");
  const mask=el("div","mask");
  const mo=el("div","modal");
  const sel=new Set(S.leagueFilter);
  mo.innerHTML=`<header>🔻 筛选 <span style="color:var(--accent)" id="cnt">${sel.size}</span>
    <span class="tools"><button id="all">全选</button><button id="inv">反选</button><button id="cls">✕</button></span></header>
    <div class="find">🔍 <input placeholder="请输入联赛名或球队名" id="kw"></div>
    <div class="lglist" id="lst"></div>
    <footer><button id="cancel">取消</button><button class="ok" id="ok">确定</button></footer>`;
  mask.appendChild(mo);layer.appendChild(mask);
  const lst=$("#lst",mo);
  function draw(kw){
    lst.innerHTML="";
    LEAGUE_POOL.filter(n=>!kw||n.toLowerCase().includes(kw.toLowerCase())).forEach(n=>{
      const it=el("label","lgitem",`<input type="checkbox" ${sel.has(n)?"checked":""}><span>${esc(n)}</span>`);
      $("input",it).onchange=e=>{e.target.checked?sel.add(n):sel.delete(n);$("#cnt",mo).textContent=sel.size};
      lst.appendChild(it);
    });
  }
  draw("");
  $("#kw",mo).oninput=e=>draw(e.target.value);
  $("#all",mo).onclick=()=>{LEAGUE_POOL.forEach(n=>sel.add(n));$("#cnt",mo).textContent=sel.size;draw($("#kw",mo).value)};
  $("#inv",mo).onclick=()=>{LEAGUE_POOL.forEach(n=>sel.has(n)?sel.delete(n):sel.add(n));$("#cnt",mo).textContent=sel.size;draw($("#kw",mo).value)};
  const close=()=>layer.innerHTML="";
  $("#cls",mo).onclick=close;$("#cancel",mo).onclick=close;
  $("#ok",mo).onclick=()=>{S.leagueFilter=sel;close();render();toast(sel.size?`已筛选 ${sel.size} 个联赛`:"已显示全部联赛")};
  mask.onclick=e=>{if(e.target===mask)close()};
}

/* ============ 提示 ============ */
let tt;
function toast(msg){
  clearTimeout(tt);
  let t=$(".toast");
  if(!t){t=el("div","toast");document.body.appendChild(t)}
  t.textContent=msg;
  tt=setTimeout(()=>t.remove(),1900);
}

/* ============ 滚球时钟 & 赔率跳动 ============ */
const clocks={m1:210,c1:4086,c2:1206};
setInterval(()=>{
  Object.keys(clocks).forEach(k=>{
    clocks[k]++;
    const mm=String(Math.floor(clocks[k]/60)).padStart(2,"0"),ss=String(clocks[k]%60).padStart(2,"0");
    document.querySelectorAll(`[data-clock="${k}"]`).forEach(e=>e.textContent=`${mm}:${ss}`);
  });
},1000);
function flashOdds(force){
  const list=[...document.querySelectorAll(".bet:not(.dead):not(.lock):not(.on)")];
  if(!list.length)return;
  const n=force?4:1;
  for(let i=0;i<n;i++){
    const b=list[Math.floor(Math.random()*list.length)];
    const o=$(".bo",b);if(!o)return;
    const v=parseFloat(o.textContent);if(isNaN(v))return;
    const up=Math.random()>.5;
    const nv=Math.max(1.01,v+(up?1:-1)*(Math.round(Math.random()*4+1)/100));
    o.textContent=nv.toFixed(2);
    b.classList.remove("up","down");void b.offsetWidth;b.classList.add(up?"up":"down");
    setTimeout(()=>b.classList.remove("up","down"),1400);
  }
}
setInterval(()=>flashOdds(false),3200);

  {sel:()=>document.querySelector(".more"),

  {sel:()=>[document.querySelector('.sb-item[data-k="mybuy"]'),document.querySelector('.sb-item[data-k="sell"]')].filter(Boolean),
   title:"买单与卖单",
   text:"「我的买单」查看你已投注的注单与结算结果；「我的卖单」管理你挂出的 P2P 卖单，可补充押金或停止收单。"}
];
let guideIdx=0;
/* 原型里每次进入都展示，方便随时查看；线上的触发条件见右侧需求说明 */
function guideStart(){
  guideIdx=0;
  S.topnav="体育赛事";S.page="live";S.p2pOnly=false;S.sideMode="menu";render();
  $("#guide").classList.add("show");guideRender();
}
function guideNext(){ guideIdx>=GUIDE.length-1?guideEnd():(guideIdx++,guideRender()) }
function guideEnd(){
  $("#guide").classList.remove("show");
  window.removeEventListener("resize",guideRender);
}
/* 多个目标时取并集外框 */
function guideRect(t){
  const list=Array.isArray(t)?t:[t];
  const rs=list.map(e=>e.getBoundingClientRect());
  return {left:Math.min(...rs.map(r=>r.left)),top:Math.min(...rs.map(r=>r.top)),
          right:Math.max(...rs.map(r=>r.right)),bottom:Math.max(...rs.map(r=>r.bottom))};
}
function guideRender(){
  const g=GUIDE[guideIdx],t=g.sel();
  if(!t||(Array.isArray(t)&&!t.length))return guideNext();
  (Array.isArray(t)?t[0]:t).scrollIntoView({block:"center"});
  setTimeout(()=>{
    const b=guideRect(t);
    const x=Math.max(b.left,6),y=b.top,w=b.right-Math.max(b.left,6),h=b.bottom-b.top;
    const hole=$("#g-hole");
    hole.style.cssText=`position:fixed;left:${x-4}px;top:${y-4}px;width:${w+8}px;height:${h+8}px;`+
      `border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.74);border:2px solid #FF8C00`;
    const ring=$("#g-ring");
    ring.style.cssText=`position:fixed;left:${x-11}px;top:${y-11}px;width:${w+22}px;height:${h+22}px;`+
      `border:2px dashed rgba(255,255,255,.5);border-radius:14px`;
    /* 气泡：上方空间够放上方，否则放下方；水平贴目标中线并夹在视口内 */
    const tip=$("#g-tip");
    tip.innerHTML=`<div class="g-t"><span class="g-num">${guideIdx+1}</span>${g.title}</div><div class="g-d">${g.text}</div>`;
    const tw=300,above=y>250;
    const tx=Math.max(16,Math.min(x+w/2-tw/2,window.innerWidth-tw-16));
    tip.style.left=tx+"px";tip.style.width=tw+"px";
    tip.style.top="0px";
    const th=tip.offsetHeight||110;
    tip.style.top=(above?y-24-th:y+h+30)+"px";
    /* 曲线箭头：气泡指向目标 */
    setTimeout(()=>{
      const tr=tip.getBoundingClientRect();
      const sx=tx+tw/2, sy=above?tr.bottom+2:tr.top-2;
      const ex=x+w/2,  ey=above?y-8:y+h+8;
      const cx=sx+(ex-sx)*0.2, cy=(sy+ey)/2;
      $("#g-path").setAttribute("d",`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`);
      const dir=above?1:-1;
      $("#g-head").setAttribute("points",`${ex},${ey+dir*6} ${ex-5},${ey-dir*3} ${ex+5},${ey-dir*3}`);
    },60);
    $("#g-step").textContent=(guideIdx+1)+"/"+GUIDE.length;
    $("#g-next").textContent=guideIdx>=GUIDE.length-1?"知道了":"下一步";
  },200);
}
$("#g-skip").onclick=guideEnd;
$("#g-next").onclick=guideNext;
window.addEventListener("resize",()=>{if($("#guide").classList.contains("show"))guideRender();renderRight()});
