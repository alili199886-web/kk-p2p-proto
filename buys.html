<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>金刚体育 · 买单投注记录（独立页）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#e9ebef;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.phone{width:400px;height:880px;background:#F2F3F5;border-radius:26px;position:relative;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.16)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;height:calc(100% - 118px)}
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap;flex-shrink:0}
.muted{font-size:12px;color:#9aa0a6}
.win{color:#1D9E75}.lose{color:#E24B4A}
.card{background:#fff;border-radius:12px;padding:13px}
.pill{border:1px solid #eee;border-radius:16px;background:#fff;color:#666;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pill.on{background:#FF8C00;color:#fff;border-color:#FF8C00}
.ptab{flex:1;text-align:center;padding:13px 0;font-size:15px;color:#8a8f96;cursor:pointer;border-bottom:2px solid transparent}
.ptab.on{color:#222;font-weight:700;border-bottom-color:#FF8C00}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m3 .c{background:#fff;border-radius:10px;padding:11px 8px;text-align:center}
.m3 .c .l{font-size:11px;color:#9aa0a6}
.m3 .c .v{font-size:15px;font-weight:800;margin-top:4px}
.kklogo{display:flex;align-items:center;gap:7px}
.kklogo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#FFA33A,#FF7A00);display:flex;align-items:center;justify-content:center}
.kklogo .mk i{width:11px;height:11px;background:#fff;transform:rotate(45deg);border-radius:2px;display:block}
.kklogo .tx{font-size:17px;font-weight:800;letter-spacing:-.2px}
.kklogo .tx b{color:#FF8C00}.kklogo .tx s{color:#2B2F36;text-decoration:none}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(20,20,20,.9);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:78%;text-align:center;line-height:1.6}
.toast.show{opacity:1}
*::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div class="phone">
  <div style="background:#fff;padding:12px 14px" class="row">
    <div class="kklogo"><span class="mk"><i></i></span><span class="tx"><b>King</b><s>Kong</s></span></div>
  </div>
  <div class="scroll" style="height:calc(100% - 50px)">
    <div style="background:#fff;border-radius:12px;margin:10px 12px 0;display:flex">
      <div class="ptab on" id="bt-0" onclick="buyTabSel(0)">未结算</div>
      <div class="ptab" id="bt-1" onclick="buyTabSel(1)">已结算</div>
    </div>
    <div style="display:flex;gap:8px;padding:10px 12px 0;overflow-x:auto" id="buys-filters"></div>
    <div style="padding:10px 12px 0" id="buys-stats"></div>
    <div style="padding:10px 12px 20px" id="buys-list"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const f2=n=>(Math.round(n*100)/100).toFixed(2);
const money=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let tt;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}

/* ══════════ 买单数据 ══════════ */
let buyTab=0,btFilter='today';
let buyOrders=[
  /* ── 未结算 ── */
  {type:'single',status:'unsettled',tag:'待开赛',bucket:'today',
   item:'皇家马德里 -0.5',period:'赛前',scope:'全场',play:'全场让球',odds:1.95,mk:'亚洲盘',
   match:'皇家马德里 vs 巴塞罗那',sport:'足球',league:'西甲 · 第36轮',
   amt:12,win:23.40,betAt:'赛前',oid:'5339328801234567',time:'2026-05-26 15:22:10'},
  {type:'single',status:'unsettled',tag:'投注成功',bucket:'today',
   item:'黑龙江龙跃冰城 +1',period:'滚球',scope:'全场',play:'全场让球胜负',odds:7.00,mk:'欧洲盘',
   match:'黑龙江龙跃冰城 vs 北京通州鹏瑞',sport:'足球',league:'中国足协冠军联赛',
   amt:2,win:12.00,oid:'5339323922940716',time:'2026-05-26 13:50:40'},
  {type:'single',status:'unsettled',tag:'投注成功',bucket:'today',
   item:'因邦代罗竞技 胜',period:'滚球',scope:'全场',play:'全场独赢',odds:2.42,mk:'欧洲盘',
   match:'因邦代罗竞技 vs 圣萨玛的勇士',sport:'足球',league:'安哥拉班图图联赛',
   amt:20,win:28.40,oid:'5339322194865416',time:'2026-05-26 13:41:04'},
  {type:'single',status:'unsettled',tag:'待开赛',bucket:'today',isScore:true,
   item:'0 - 1',period:'赛前',scope:'下半场',play:'下半场波胆',odds:144,mk:'欧洲盘',
   match:'菲尔特 vs 埃森',sport:'足球',league:'德国乙级联赛 · 附加赛',
   amt:2,win:14.00,betAt:'赛前',oid:'5339324167947764',time:'2026-05-26 13:52:02'},
  {type:'parlay',status:'unsettled',tag:'投注成功',bucket:'today',
   title:'串关3串1',totalOdds:39.67,
   legs:[{item:'伯恩利 胜',odds:3.20,period:'滚球',scope:'全场',play:'全场独赢',mk:'欧洲盘',
          match:'布莱顿 vs 伯恩利',sport:'足球',league:'英格兰超级联赛'},
         {item:'西汉姆联 胜上半',odds:4.75,period:'赛前',scope:'上半场',play:'上半场独赢',mk:'欧洲盘',
          match:'富勒姆 vs 西汉姆联',sport:'足球',league:'英格兰超级联赛'},
         {item:'大 1.5',odds:2.61,period:'赛前',scope:'上半场',play:'上半场大小',mk:'欧洲盘',
          match:'浙江队 vs 河南队',sport:'足球',league:'中国超级联赛'}],
   amt:10,win:396.70,oid:'5339327402595231',time:'2026-05-26 14:10:00'},
  /* ── 已结算 ── */
  {type:'single',status:'settled',result:'赢',bucket:'today',
   item:'皇家马德里 -0.5',period:'赛前',scope:'全场',play:'全场让球',odds:1.95,mk:'亚洲盘',
   match:'皇家马德里 vs 巴塞罗那',sport:'足球',league:'西甲 · 第36轮',
   amt:12,profit:11.40,score:'全场 3-1　半场 2-0',betAt:'赛前',
   oid:'5339328801234567',time:'2026-05-26 15:22:10'},
  {type:'parlay',status:'settled',result:'输',bucket:'today',
   title:'串关3串1',totalOdds:39.67,
   legs:[{item:'伯恩利 胜',odds:3.20,period:'滚球',scope:'全场',play:'全场独赢',mk:'欧洲盘',
          match:'布莱顿 vs 伯恩利',sport:'足球',league:'英格兰超级联赛 PANDA独家EAFC24',
          betScore:'0-0',endScore:'0-1',legResult:'赢'},
         {item:'西汉姆联 胜上半',odds:4.75,period:'滚球',scope:'上半场',play:'上半场独赢',mk:'欧洲盘',
          match:'富勒姆 vs 西汉姆联',sport:'足球',league:'英格兰超级联赛 PANDA独家EAFC24',
          betScore:'0-0',endScore:'1-1',legScoreLabel:'上半场比分',legResult:'输'},
         {item:'大 1.5',odds:2.61,period:'滚球',scope:'上半场',play:'上半场大小',mk:'欧洲盘',
          match:'浙江队 vs 河南队',sport:'足球',league:'中国超级联赛 PANDA独家EAFC24',
          betScore:'0-1',endScore:'0-1',legScoreLabel:'上半场比分',legResult:'输'}],
   amt:10,profit:-10,oid:'5339327402595231',time:'2026-05-26 14:10:00'},
  {type:'single',status:'settled',result:'赢',bucket:'yesterday',
   item:'汉坎 -0/0.5',period:'滚球',scope:'全场',play:'全场让球',odds:2.58,mk:'欧洲盘',
   match:'汉坎 vs 利勒斯特罗姆',sport:'足球',league:'挪威足球超级联赛',
   amt:200,profit:316.00,score:'全场 2-0　半场 1-0',betAt:'赛前',
   oid:'0110000126052556603251-1',time:'2026-05-25 17:15:49'},
  {type:'single',status:'settled',result:'赢半',bucket:'today',
   item:'河南队 +0/0.5',period:'滚球',scope:'上半场',play:'上半场让球',odds:-218,mk:'美国盘',
   match:'浙江队 vs 河南队',sport:'足球',league:'中国超级联赛',
   amt:4.36,profit:1.00,score:'上半场 0-1　全场 1-1',betAt:'0-1（滚球中）',
   oid:'5339327171709206',time:'2026-05-26 14:08:43'},
  {type:'single',status:'settled',result:'输半',bucket:'today',
   item:'浙江队 -0/0.5',period:'滚球',scope:'上半场',play:'上半场让球',odds:128,mk:'美国盘',
   match:'浙江队 vs 河南队',sport:'足球',league:'中国超级联赛',
   amt:2,profit:-1.00,score:'上半场 0-1　全场 1-1',betAt:'0-1（滚球中）',
   oid:'5339327171709207',time:'2026-05-26 14:08:43'},
  {type:'single',status:'settled',result:'输',bucket:'today',isScore:true,
   item:'1 - 3',period:'滚球',scope:'全场',play:'全场波胆',odds:9.00,mk:'欧洲盘',
   match:'黑龙江龙跃冰城 vs 北京通州鹏瑞',sport:'足球',league:'中国足协冠军联赛',
   amt:20,profit:-20,score:'全场 1-4（未命中）',betScore:'1 - 3',betAt:'0-2（滚球中）',
   oid:'5339323746618690',time:'2026-05-26 13:49:42'},
  {type:'single',status:'settled',result:'走水',bucket:'today',
   item:'黑龙江龙跃冰城 0',period:'滚球',scope:'上半场',play:'上半场让球',odds:2.58,mk:'欧洲盘',
   match:'黑龙江龙跃冰城 vs 北京通州鹏瑞',sport:'足球',league:'中国足协冠军联赛',
   amt:2,profit:0,score:'上半场 0-2　全场 1-4',betAt:'0-2（滚球中）',
   oid:'5339322090651388',time:'2026-05-26 13:40:30'}
];

function buyBucketOk(b){
  if(btFilter==='all')return true;
  if(btFilter==='today')return b==='today';
  if(btFilter==='yesterday')return b==='yesterday';
  if(btFilter==='7d')return ['today','yesterday','7d'].includes(b);
  return ['today','yesterday','7d','30d'].includes(b);
}
function buyTabSel(i){buyTab=i;renderBuys()}

/* ══════════ 买单渲染 ══════════ */
function renderBuys(){
  $('bt-0').classList.toggle('on',buyTab===0);
  $('bt-1').classList.toggle('on',buyTab===1);
  const list=buyOrders.filter(o=>buyTab===0?o.status==='unsettled':(o.status==='settled'&&buyBucketOk(o.bucket)));
  /* 时间筛选:未结算 3 项,已结算 4 项 */
  const ts=buyTab===0?[['today','今天'],['yesterday','昨天'],['7d','近7天']]
                     :[['today','今天'],['yesterday','昨天'],['7d','近7天'],['30d','近30天']];
  $('buys-filters').innerHTML=ts.map(([v,t])=>`<span class="pill ${btFilter===v?'on':''}" style="font-size:13px;padding:7px 18px" onclick="btFilter='${v}';renderBuys()">${t}</span>`).join('');
  /* 统计 */
  const tot=list.reduce((s,o)=>s+o.amt,0);
  if(buyTab===0){
    const win=list.reduce((s,o)=>s+(o.win||0),0);
    $('buys-stats').innerHTML=`<div class="m3">
      <div class="c"><div class="l">总笔数</div><div class="v">${list.length}</div></div>
      <div class="c"><div class="l">总投注</div><div class="v nowrap" style="font-size:14px">${money(tot)} CNY</div></div>
      <div class="c"><div class="l">总可赢</div><div class="v nowrap win" style="font-size:14px">${money(win)} CNY</div></div></div>`;
  }else{
    const pf=list.reduce((s,o)=>s+(o.profit||0),0);
    $('buys-stats').innerHTML=`<div class="m3">
      <div class="c"><div class="l">总笔数</div><div class="v">${list.length}</div></div>
      <div class="c"><div class="l">总投注</div><div class="v nowrap" style="font-size:14px">${money(tot)} CNY</div></div>
      <div class="c"><div class="l">总输赢</div><div class="v nowrap ${pf>=0?'win':'lose'}" style="font-size:14px">${pf>=0?'+':'-'}${money(Math.abs(pf))} CNY</div></div></div>`;
  }
  /* 结算结果标签配色 */
  const RES={'赢':['#1D9E75','#E8F7EF'],'赢半':['#1D9E75','#E8F7EF'],
             '输':['#E24B4A','#FDECEC'],'输半':['#E24B4A','#FDECEC'],'走水':['#8a8f96','#F0F1F3']};
  const resTag=r=>{const c=RES[r]||RES['走水'];
    return `<span style="background:${c[1]};color:${c[0]};font-size:12px;font-weight:700;padding:3px 10px;border-radius:5px" class="nowrap">${r}</span>`};
  const stTag=t=>`<span style="background:${t==='待开赛'?'#FFF3E5':'#E8F7EF'};color:${t==='待开赛'?'#E8850C':'#1D9E75'};font-size:12px;font-weight:600;padding:3px 10px;border-radius:5px" class="nowrap">${t}</span>`;
  /* 玩法行:时段+盘段 · 玩法@赔率 (盘口) */
  const playLine=o=>`<div class="muted" style="margin-top:3px;font-size:12px">${o.period}${o.scope} · ${o.play}<b style="color:#222;margin-left:2px">@${o.odds}</b> <span style="color:#9aa0a6">(${o.mk})</span></div>`;
  const kv=(k,v,cls='')=>`<div class="row" style="margin-top:5px"><span class="muted nowrap" style="font-size:12px">${k}</span><span class="grow"></span><span class="nowrap ${cls}" style="font-size:12px">${v}</span></div>`;
  const oidRow=o=>`<div class="row" style="margin-top:5px"><span class="muted nowrap" style="font-size:12px">注单号：</span><span class="grow"></span>
      <span class="muted nowrap" style="font-size:11px">${o.oid}</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:#FF8C00;fill:none;stroke-width:2;margin-left:5px;cursor:pointer" onclick="toast('注单号已复制')"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg></div>`;

  $('buys-list').innerHTML=list.length?list.map(o=>{
    const settled=o.status==='settled';
    let head,body='';
    if(o.type==='parlay'){
      head=`<div class="row">
          <span style="font-size:15px;font-weight:700;color:#222" class="nowrap">${o.title}</span>
          <span class="muted" style="margin-left:8px;font-size:12px">总赔率 <b style="color:#FF8C00">@${o.totalOdds}</b></span>
          <span class="grow"></span>${settled?resTag(o.result):stTag(o.tag)}</div>`;
      body=o.legs.map(g=>`<div style="border-top:1px dashed #f0f0f0;padding:9px 0">
          <div class="row"><span style="font-size:14px;font-weight:700;color:#222">${g.item}</span>
            <span style="font-size:13px;color:#FF8C00;font-weight:600;margin-left:6px">@${g.odds}</span></div>
          <div class="muted" style="margin-top:3px;font-size:12px">${g.period}${g.scope} · ${g.play}${g.mk}</div>
          <div style="font-size:13px;color:#222;margin-top:3px">${g.match}</div>
          <div class="muted" style="margin-top:2px;font-size:12px">${g.sport} | ${g.league}</div>
          ${g.betScore!==undefined?`<div class="muted" style="margin-top:4px;font-size:12px">下注时比分 ${g.betScore}</div>`:''}
          ${g.endScore!==undefined?`<div class="muted" style="margin-top:2px;font-size:12px">${g.legScoreLabel||'全场比分'} ${g.endScore}</div>`:''}
          ${g.legResult?`<div style="margin-top:4px;font-size:12px;color:${g.legResult==='赢'?'#1D9E75':'#E24B4A'}">已结算 · ${g.legResult}</div>`:''}
        </div>`).join('');
    }else{
      head=`<div class="row">
          <span style="font-size:15px;font-weight:700;color:#222">${o.item}</span>
          <span class="grow"></span>${settled?resTag(o.result):stTag(o.tag)}</div>
        ${playLine(o)}
        <div style="font-size:13px;color:#222;margin-top:4px">${o.match}</div>
        <div class="muted" style="margin-top:2px;font-size:12px">${o.sport} | ${o.league}</div>`;
    }
    const money2=settled
      ? kv('投注金额：',money(o.amt)+' CNY')
        +kv('输赢：',(o.profit>=0?'+':'-')+money(Math.abs(o.profit))+' CNY',o.profit>0?'win':(o.profit<0?'lose':''))
        +(o.score?kv('比分：',o.score):'')
        +(o.betScore?kv('投注比分：',o.betScore):'')
        +(o.betAt?kv('下注时：',o.betAt):'')
      : kv('投注金额：',money(o.amt)+' CNY')
        +kv('最高可赢：',money(o.win)+' CNY','win')
        +(o.betAt?kv('下注时：',o.betAt):'');
    return `<div class="card" style="margin-bottom:10px">
      ${head}${body}
      <div style="border-top:1px dashed #f0f0f0;margin-top:9px;padding-top:6px">
        ${money2}${oidRow(o)}${kv('投注时间：',o.time)}
      </div></div>`;
  }).join(''):'<div class="muted" style="text-align:center;padding:36px">暂无注单</div>';
}

renderBuys();
</script>
</body>
</html>
